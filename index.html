<style>
:root {
  --primary: #34D186;
  --primary-light: #34D18620;
  --dark: #1A1A2E;
  --bg: #F8F9FA;
  --card: #FFFFFF;
  --border: #E2E8F0;
  --text: #1A1A2E;
  --text-secondary: #64748B;
  --red: #EF4444;
  --green: #34D186;
  --orange: #F59E0B;
  --sidebar-w: 230px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; overflow-x: hidden; }

.sidebar { width: var(--sidebar-w); background: var(--dark); color: #fff; position: fixed; top: 0; left: 0; bottom: 0; overflow-y: auto; z-index: 100; display: flex; flex-direction: column; }
.sidebar-header { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
.sidebar-header h2 { font-size: 16px; font-weight: 700; color: var(--primary); }
.sidebar-header p { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 4px; }
.sidebar-nav { flex: 1; padding: 12px 0; }
.nav-item { padding: 10px 20px; cursor: pointer; font-size: 13px; color: rgba(255,255,255,0.7); transition: all 0.2s; border-left: 3px solid transparent; }
.nav-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.nav-item.active { background: rgba(52,209,134,0.1); color: var(--primary); border-left-color: var(--primary); font-weight: 600; }
.nav-item.highlighted { color: #F59E0B; font-weight: 600; }
.nav-section-title { padding: 16px 20px 6px; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.35); }

.main { margin-left: var(--sidebar-w); flex: 1; padding: 24px 32px; max-width: calc(100vw - var(--sidebar-w)); overflow-x: hidden; box-sizing: border-box; }
.top-bar { margin-bottom: 16px; }
.controls-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
.top-bar h1 { font-size: 22px; font-weight: 700; }
.controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.toggle-group { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.toggle-btn { padding: 6px 16px; font-size: 12px; cursor: pointer; background: var(--card); border: none; color: var(--text-secondary); font-weight: 500; transition: all 0.2s; }
.toggle-btn.active { background: var(--primary); color: #fff; }

.period-slider { position: relative; max-width: 100%; overflow: hidden; }
.period-tabs { display: flex; gap: 4px; flex-wrap: wrap; padding: 2px 0; }
.period-tab { padding: 5px 12px; font-size: 11px; border-radius: 6px; cursor: pointer; background: var(--card); border: 1px solid var(--border); color: var(--text-secondary); transition: all 0.2s; white-space: nowrap; flex-shrink: 0; }
.period-tab:hover { border-color: var(--primary); }
.period-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.slider-arrow { display: none; }

.section { margin-bottom: 32px; }
.section-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 2px solid var(--primary); display: inline-block; }
.sub-section-title { font-size: 14px; font-weight: 600; margin: 20px 0 12px; color: var(--dark); }

.kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-bottom: 20px; }
.kpi-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
.kpi-label { font-size: 11px; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.3px; }
.kpi-value { font-size: 20px; font-weight: 700; color: var(--dark); }
.kpi-change { font-size: 11px; margin-top: 4px; display: flex; align-items: center; gap: 3px; }
.kpi-change.up { color: var(--green); }
.kpi-change.down { color: var(--red); }
.kpi-change.neutral { color: var(--text-secondary); }

.data-table-wrap { overflow-x: auto; margin-bottom: 20px; }
.data-table { width: 100%; border-collapse: collapse; font-size: 12px; background: var(--card); border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
.data-table th { background: var(--dark); color: #fff; padding: 10px 12px; text-align: left; font-weight: 600; white-space: nowrap; }
.data-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:hover td { background: var(--primary-light); }
.data-table .section-row td { background: #f1f5f9; font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-secondary); padding: 6px 12px; }
.chg-up { color: var(--green); font-size: 10px; margin-left: 4px; }
.chg-down { color: var(--red); font-size: 10px; margin-left: 4px; }

.chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
.chart-container { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
.chart-container.full { grid-column: 1 / -1; }
.chart-container h3 { font-size: 13px; font-weight: 600; margin-bottom: 12px; }
.chart-wrap { position: relative; height: 300px; }

.sub-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
.sub-kpi { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px; font-size: 12px; }
.sub-kpi .label { color: var(--text-secondary); font-size: 10px; text-transform: uppercase; }
.sub-kpi .val { font-size: 16px; font-weight: 700; margin-top: 2px; }
.sub-kpi .chg { font-size: 10px; margin-top: 2px; }

.run-rate-block { background: #FFF8E1; border: 2px solid #F59E0B; border-radius: 12px; padding: 20px; margin-bottom: 24px; }
.run-rate-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.run-rate-badge { background: #F59E0B; color: #fff; font-weight: 700; font-size: 12px; padding: 4px 12px; border-radius: 6px; text-transform: uppercase; }
.run-rate-info { font-size: 11px; color: var(--text-secondary); }
.run-rate-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 10px; }
.rr-card { background: #FFFDE7; border: 1px solid #FFF59D; border-radius: 8px; padding: 10px 12px; }
.rr-card .rr-label { font-size: 9px; color: var(--text-secondary); text-transform: uppercase; font-weight: 600; }
.rr-card .rr-value { font-size: 18px; font-weight: 700; margin-top: 2px; }
.rr-card .rr-chg { font-size: 10px; margin-top: 2px; }
.rr-card .rr-prev { font-size: 9px; color: var(--text-secondary); margin-top: 2px; }

.view-toggle { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-bottom: 8px; }
.view-toggle button { padding: 4px 12px; font-size: 11px; border: none; cursor: pointer; background: var(--card); color: var(--text-secondary); font-weight: 500; }
.view-toggle button.active { background: var(--dark); color: #fff; }

@media (max-width: 1000px) {
  .chart-row { grid-template-columns: 1fr; }
  .kpi-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
}
@media (max-width: 768px) {
  .sidebar { width: 100%; position: relative; height: auto; }
  .main { margin-left: 0; padding: 16px; }
}
</style>

  function periodLabel(p, gran) {
    if (!p) return '—';
    const parts = p.replace(' 00:00:00','').split('-');
    if (parts.length < 3) return p;
    const month = parseInt(parts[1]) - 1, day = parseInt(parts[2]);
    if (gran === 'quarterly') { const q = Math.ceil((month+1)/3); return `Q${q} ${parts[0]}`; }
    if (gran === 'monthly') return MONTHS_FULL[month] + ' ' + parts[0];
    return MONTHS_SHORT[month] + ' ' + day;
  }

  function pctChange(cur, prev) {
    if (prev == null || cur == null || prev === 0) return null;
    return ((cur - prev) / Math.abs(prev)) * 100;
  }
  function ppChange(cur, prev) {
    if (prev == null || cur == null) return null;
    return cur - prev;
  }
  function changeHtml(cur, prev, inverted=false) {
    const ch = pctChange(cur, prev);
    if (ch == null) return '<span class="kpi-change neutral">—</span>';
    const up = ch >= 0;
    const cls = inverted ? (up ? 'down' : 'up') : (up ? 'up' : 'down');
    const arrow = up ? '&#9650;' : '&#9660;';
    return `<span class="kpi-change ${cls}">${arrow} ${Math.abs(ch).toFixed(1)}%</span>`;
  }
  function ppChangeHtml(cur, prev, inverted=false) {
    const pp = ppChange(cur, prev);
    if (pp == null) return '';
    const up = pp >= 0;
    const cls = inverted ? (up ? 'chg-down' : 'chg-up') : (up ? 'chg-up' : 'chg-down');
    const sign = pp >= 0 ? '+' : '';
    return `<span class="${cls}">${sign}${pp.toFixed(1)}pp</span>`;
  }
  function pctChangeInline(cur, prev, inverted=false) {
    const ch = pctChange(cur, prev);
    if (ch == null) return '';
    const up = ch >= 0;
    const cls = inverted ? (up ? 'chg-down' : 'chg-up') : (up ? 'chg-up' : 'chg-down');
    const sign = ch >= 0 ? '+' : '';
    return `<span class="${cls}">${sign}${ch.toFixed(1)}%</span>`;
  }

  function destroyCharts() { charts.forEach(c => { try { c.destroy(); } catch(e){} }); charts = []; }
  function last(arr) { return arr.length ? arr[arr.length - 1] : null; }
  function prev(arr) { return arr.length >= 2 ? arr[arr.length - 2] : null; }

  /* ---- sidebar ---- */
  function buildSidebar() {
    const nav = $('sidebarNav');
    let html = '<div class="nav-section-title">Overview</div>';
    html += `<div class="nav-item ${currentView==='overview'?'active':''}" data-view="overview">All 3P Stores</div>`;
    html += '<div class="nav-section-title">Partners</div>';
    const highlightedPartners = new Set(['LOKO', 'VARUS', 'RUKAVYCHKA']);
    safe(D.partners_list).forEach(p => {
      const hl = highlightedPartners.has(p) ? ' highlighted' : '';
      html += `<div class="nav-item${hl} ${currentView===p?'active':''}" data-view="${p}">${p}</div>`;
    });
    nav.innerHTML = html;
    nav.querySelectorAll('.nav-item').forEach(el => {
      el.addEventListener('click', () => { currentView = el.dataset.view; currentPeriod = null; render(); });
    });
  }

  /* ---- granularity & period tabs with slider ---- */
  function buildControls() {
    const gt = $('granToggle');
    gt.innerHTML = ['quarterly','monthly','weekly'].map(g =>
      `<button class="toggle-btn ${currentGran===g?'active':''}" data-g="${g}">${g.charAt(0).toUpperCase()+g.slice(1)}</button>`
    ).join('');
    gt.querySelectorAll('.toggle-btn').forEach(b => {
      b.addEventListener('click', () => { currentGran = b.dataset.g; currentPeriod = null; render(); });
    });

    const src = getDataSource();
    const periods = [...new Set(safe(src.financial).map(r => r.period))].sort();

    if (!currentPeriod && periods.length) {
      currentPeriod = periods[periods.length - 1];
    }

    const pt = $('periodTabs');
    let ph = '';
    periods.forEach(p => {
      ph += `<span class="period-tab ${currentPeriod===p?'active':''}" data-p="${p}">${periodLabel(p, currentGran)}</span>`;
    });
    pt.innerHTML = ph;
    pt.querySelectorAll('.period-tab').forEach(t => {
      t.addEventListener('click', () => { currentPeriod = t.dataset.p; render(); });
    });
  }


  function getDataSource() {
    if (currentView === 'overview') return (D.overview || {})[currentGran] || {};
    return ((D.partners || {})[currentView] || {})[currentGran] || {};
  }

  function quarterLabel(period) {
    const d = period.replace(' 00:00:00','').split('-');
    const m = parseInt(d[1]);
    const q = Math.ceil(m / 3);
    return `Q${q} ${d[0]}`;
  }

  /* ---- KPI card builder ---- */
  function kpi(label, value, curRow, prevRow, field, opts={}) {
    const inv = opts.inverted || false;
    const chg = prevRow ? changeHtml(curRow[field], prevRow[field], inv) : '<span class="kpi-change neutral">—</span>';
    return `<div class="kpi-card"><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div>${chg}</div>`;
  }

  /* ---- acceptance/availability helpers ---- */
  function getAcceptAvail() {
    if (currentView === 'overview') return safe((D.acceptance_availability || {}).overview);
    return safe((D.acceptance_availability || {})[currentView]);
  }

  /* ---- render ---- */
  function render() {
    destroyCharts();
    buildSidebar();
    buildControls();
    $('pageTitle').textContent = currentView === 'overview' ? 'All 3P Stores' : currentView;

    const src = getDataSource();
    const fin = safe(src.financial);
    const cp = safe(src.cp_margins);
    const ops = safe(src.operational);
    const fail = safe(src.failed_orders);
    const camp = safe(src.campaigns);
    const aa = getAcceptAvail();

    let html = '';

    /* ===== SECTION 1: Financial Overview ===== */
    html += '<div class="section"><div class="section-title">Financial Overview</div>';

    const idx = fin.findIndex(r => r.period === currentPeriod);
    const c = idx >= 0 ? fin[idx] : last(fin);
    const p = idx > 0 ? fin[idx - 1] : (idx === 0 ? null : prev(fin));
    const cpIdx = cp.findIndex(r => r.period === currentPeriod);
    const cpC = cpIdx >= 0 ? cp[cpIdx] : last(cp);
    const cpP = cpIdx > 0 ? cp[cpIdx - 1] : (cpIdx === 0 ? null : prev(cp));

    if (c) {
      const commAov = cpC ? cpC.commission_aov_pct : null;
      const commGmv = cpC ? cpC.commission_gmv_pct : null;
      const pCommAov = cpP ? cpP.commission_aov_pct : null;
      const pCommGmv = cpP ? cpP.commission_gmv_pct : null;

      const campIdx = camp.findIndex(r => r.period === currentPeriod);
      const campC = campIdx >= 0 ? camp[campIdx] : last(camp);
      const campP = campIdx > 0 ? camp[campIdx - 1] : (campIdx === 0 ? null : (camp.length >= 2 ? camp[camp.length - 2] : null));
      const demandPct = campC && campC.gmv_eur ? (campC.campaigns_discount_eur / campC.gmv_eur * 100) : null;
      const pDemandPct = campP && campP.gmv_eur ? (campP.campaigns_discount_eur / campP.gmv_eur * 100) : null;

      html += '<div class="kpi-grid">';
      html += kpi('GMV', fmtEur(c.gmv_eur), c, p, 'gmv_eur');
      html += kpi('Orders', fmt(c.orders), c, p, 'orders');
      html += kpi('AOV (w/ Delivery)', fmtEur(c.aov_with_delivery, 2), c, p, 'aov_with_delivery');
      html += kpi('AOV (Items Only)', fmtEur(c.aov_items_only, 2), c, p, 'aov_items_only');
      html += kpi('Eater Fees / Order', fmtEur(c.eater_fees_per_order, 2), c, p, 'eater_fees_per_order');
      if (cpC) {
        html += kpi('CP Margin', fmtPct(cpC.cp_margin_pct), cpC, cpP, 'cp_margin_pct');
        html += kpi('CP L2 Margin', fmtPct(cpC.cp_l2_margin_pct), cpC, cpP, 'cp_l2_margin_pct');
      }
      html += kpi('Bolt Plus GMV Share', fmtPct(c.bolt_plus_gmv_share, 1), c, p, 'bolt_plus_gmv_share');
      html += kpi('Commission of AOV, %', fmtPct(commAov, 1), cpC, cpP, 'commission_aov_pct');
      html += kpi('Commission of GMV, %', fmtPct(commGmv, 1), cpC, cpP, 'commission_gmv_pct');
      if (currentView === 'overview') {
        html += kpi('Demand Incentives, % GMV', fmtPct(demandPct, 1), {v: demandPct}, pDemandPct != null ? {v: pDemandPct} : null, 'v');
      }
      html += '</div>';

      html += '<div class="sub-row">';
      html += `<div class="sub-kpi"><div class="label">Users Activated</div><div class="val">${fmt(c.users_activated)}</div><div class="chg">${changeHtml(c.users_activated, p ? p.users_activated : null)}</div></div>`;
      html += `<div class="sub-kpi"><div class="label">Active Users</div><div class="val">${fmt(c.active_users)}</div><div class="chg">${changeHtml(c.active_users, p ? p.active_users : null)}</div></div>`;
      html += '</div>';
    }

    // RUN RATE block (monthly/quarterly view, only for the current/latest period)
    if ((currentGran === 'monthly' || currentGran === 'quarterly') && fin.length >= 2 && currentPeriod === fin[fin.length - 1].period) {
      html += buildRunRateBlock(fin, cp, camp);
    }

    // Bolt+ Dynamics Table
    html += buildBoltPlusDynamicsTable(fin);

    // Eater Fees Dynamics Table
    html += buildEaterFeesDynamicsTable(fin);

    // Charts row
    html += '<div class="chart-row">';
    html += '<div class="chart-container"><h3>GMV &amp; Orders Trend</h3><div class="chart-wrap"><canvas id="chartGmvOrders"></canvas></div></div>';
    html += '<div class="chart-container"><h3>Eater Fees per Order</h3><div class="chart-wrap"><canvas id="chartEaterFees"></canvas></div></div>';
    html += '</div>';

    // GMV by Partner doughnut (overview only, uses period-filtered data)
    if (currentView === 'overview') {
      const gmvPart = safe(src.gmv_by_partner).filter(r => r.period === currentPeriod);
      if (gmvPart.length || safe(D.top_partners_gmv).length) {
        html += '<div class="chart-row"><div class="chart-container full"><h3>GMV Share by Partner</h3><div class="chart-wrap" style="height:350px;max-width:500px;margin:0 auto;"><canvas id="chartGmvShare"></canvas></div></div></div>';
      }
    }
    html += '</div>';

    /* ===== SECTION 2: Operational Overview ===== */
    html += '<div class="section"><div class="section-title">Operational Overview</div>';

    const opsIdx = ops.findIndex(r => r.period === currentPeriod);
    const oc = opsIdx >= 0 ? ops[opsIdx] : last(ops);
    const op = opsIdx > 0 ? ops[opsIdx - 1] : (opsIdx === 0 ? null : prev(ops));
    const aaLast = last(aa);

    if (oc || aaLast) {
      html += '<div class="kpi-grid">';
      if (oc) html += kpi('Active Stores', fmt(oc.active_stores), oc, op, 'active_stores');
      if (oc && oc.acceptance_rate != null) {
        html += kpi('Acceptance Rate', fmtPct(oc.acceptance_rate, 1), oc, op, 'acceptance_rate');
        html += kpi('Availability', fmtPct(oc.availability_rate, 1), oc, op, 'availability_rate');
        html += kpi('Avg Rating', fmt(oc.avg_rating, 2), oc, op, 'avg_rating');
      } else if (aaLast) {
        const aaPrev = aa.length >= 2 ? aa[aa.length - 2] : null;
        html += kpi('Acceptance Rate', fmtPct(aaLast.acceptance_rate_30d * 100, 1), {v: aaLast.acceptance_rate_30d*100}, aaPrev ? {v: aaPrev.acceptance_rate_30d*100} : null, 'v');
        html += kpi('Availability', fmtPct(aaLast.availability_rate_30d * 100, 1), {v: aaLast.availability_rate_30d*100}, aaPrev ? {v: aaPrev.availability_rate_30d*100} : null, 'v');
        html += kpi('Avg Rating', fmt(aaLast.avg_rating_30d, 2), {v: aaLast.avg_rating_30d}, aaPrev ? {v: aaPrev.avg_rating_30d} : null, 'v');
      }
      if (oc) {
        html += kpi('Honey Order Rate', fmtPct(oc.honey_order_rate, 1), oc, op, 'honey_order_rate');
        html += kpi('Bad Order Rate', fmtPct(oc.bad_order_rate, 2), oc, op, 'bad_order_rate', {inverted: true});
        html += kpi('Avg Delivery Time', fmt(oc.avg_delivery_minutes, 1) + ' min', oc, op, 'avg_delivery_minutes', {inverted: true});
        if (currentView !== 'overview' && oc.replacement_rate != null) html += kpi('Item Replacement Rate', fmtPct(oc.replacement_rate, 2), oc, op, 'replacement_rate', {inverted: true});
        if (currentView !== 'overview' && oc.adjustment_rate != null) html += kpi('Item Adjustment Rate', fmtPct(oc.adjustment_rate, 2), oc, op, 'adjustment_rate', {inverted: true});
      }
      html += '</div>';
    }

    // Bad Order Breakdown cards
    html += buildBadOrderBreakdown(ops, fail, opsIdx);

    // WoW Comparison Table
    html += buildWoWComparisonTable(ops, fail);

    html += '</div>';

    /* ===== SECTION 3: Campaign Analytics ===== */
    html += '<div class="section"><div class="section-title">Campaign Analytics</div>';
    const campIdx2 = camp.findIndex(r => r.period === currentPeriod);
    const cc = campIdx2 >= 0 ? camp[campIdx2] : last(camp);
    const cp2 = campIdx2 > 0 ? camp[campIdx2 - 1] : (campIdx2 === 0 ? null : (camp.length >= 2 ? camp[camp.length - 2] : null));
    html += '<div class="kpi-grid">';
    if (cc) {
      const gmv = cc.gmv_eur || 1;
      html += kpi('Campaigns Discount', fmtEur(cc.campaigns_discount_eur) + ` (${fmtPct(cc.campaigns_discount_eur / gmv * 100, 1)})`, cc, cp2, 'campaigns_discount_eur');
      html += kpi('Bolt Spend', fmtEur(cc.bolt_spend_eur) + ` (${fmtPct(cc.bolt_spend_eur / gmv * 100, 1)})`, cc, cp2, 'bolt_spend_eur');
      html += kpi('Merchant Spend', fmtEur(cc.merchant_spend_eur) + ` (${fmtPct(cc.merchant_spend_eur / gmv * 100, 1)})`, cc, cp2, 'merchant_spend_eur');
    }
    if (currentView !== 'overview') {
      const promoData = safe((D.item_discount_promo || {})[currentView]);
      if (promoData.length) {
        const promoIdx = promoData.findIndex(r => r.period === currentPeriod);
        const promoC = promoIdx >= 0 ? promoData[promoIdx] : last(promoData);
        const promoP = promoIdx > 0 ? promoData[promoIdx - 1] : (promoIdx === 0 ? null : (promoData.length >= 2 ? promoData[promoData.length - 2] : null));
        if (promoC) html += kpi('Item-Level Discount Promo Share, %', fmtPct(promoC.value, 2), promoC, promoP, 'value');
      }
    }
    html += '</div>';

    // Campaign Dynamics Table
    html += buildCampaignDynamicsTable(camp);

    html += '<div class="chart-row"><div class="chart-container full"><h3>Campaign Spend Trend (% of GMV)</h3><div class="chart-wrap"><canvas id="chartCampaigns"></canvas></div></div></div>';
    html += '</div>';

    $('content').innerHTML = html;

    /* ---- draw charts ---- */
    drawGmvOrdersChart(fin);
    drawEaterFeesChart(fin);
    if (currentView === 'overview') drawGmvShareChart();
    drawCampaignsChart(camp);
  }

  /* ---- Bolt+ Dynamics Table ---- */
  function buildBoltPlusDynamicsTable(fin) {
    const last10 = fin.slice(-10);
    if (last10.length < 2) return '';
    let html = '<div class="sub-section-title">Bolt Plus GMV Share, % — Dynamics</div>';
    html += '<div class="data-table-wrap"><table class="data-table"><thead><tr><th></th>';
    last10.forEach(r => { html += `<th>${periodLabel(r.period, currentGran)}</th>`; });
    html += '</tr></thead><tbody><tr><td><strong>Bolt Plus GMV Share, %</strong></td>';
    last10.forEach((r, i) => {
      const prevVal = i > 0 ? last10[i-1].bolt_plus_gmv_share : null;
      const pp = ppChangeHtml(r.bolt_plus_gmv_share, prevVal);
      html += `<td>${fmtPct(r.bolt_plus_gmv_share, 1)} ${pp}</td>`;
    });
    html += '</tr></tbody></table></div>';
    return html;
  }

  /* ---- Eater Fees Dynamics Table ---- */
  function buildEaterFeesDynamicsTable(fin) {
    const last10 = fin.slice(-10);
    if (last10.length < 2) return '';
    let html = '<div class="sub-section-title">Eater Fees Dynamics</div>';
    html += '<div class="data-table-wrap"><table class="data-table"><thead><tr><th></th>';
    last10.forEach(r => { html += `<th>${periodLabel(r.period, currentGran)}</th>`; });
    html += '</tr></thead><tbody>';

    html += '<tr class="section-row"><td colspan="' + (last10.length + 1) + '">Eater Fees Summary</td></tr>';

    // Eater Fees / Order
    html += '<tr><td>Eater Fees / Order, €</td>';
    last10.forEach((r, i) => {
      const pv = i > 0 ? last10[i-1].eater_fees_per_order : null;
      html += `<td>${fmtEur(r.eater_fees_per_order, 2)} ${pctChangeInline(r.eater_fees_per_order, pv)}</td>`;
    });
    html += '</tr>';

    // Total Eater Fees
    html += '<tr><td>Total Eater Fees, €</td>';
    last10.forEach((r, i) => {
      const total = r.eater_fees_per_order * r.orders;
      const pTotal = i > 0 ? last10[i-1].eater_fees_per_order * last10[i-1].orders : null;
      html += `<td>${fmtEur(total)} ${pctChangeInline(total, pTotal)}</td>`;
    });
    html += '</tr>';

    html += '<tr class="section-row"><td colspan="' + (last10.length + 1) + '">Breakdown — Per Order</td></tr>';

    // Service Fee / Order
    html += '<tr><td>Service Fee / Order, €</td>';
    last10.forEach((r, i) => {
      const pv = i > 0 ? last10[i-1].service_fee_per_order : null;
      html += `<td>${fmtEur(r.service_fee_per_order, 2)} ${pctChangeInline(r.service_fee_per_order, pv)}</td>`;
    });
    html += '</tr>';

    // Small Order Fee / Order
    html += '<tr><td>Small Order Fee / Order, €</td>';
    last10.forEach((r, i) => {
      const pv = i > 0 ? last10[i-1].small_order_fee_per_order : null;
      html += `<td>${fmtEur(r.small_order_fee_per_order, 2)} ${pctChangeInline(r.small_order_fee_per_order, pv)}</td>`;
    });
    html += '</tr>';

    // Delivery Fee / Order
    html += '<tr><td>Delivery Fee / Order, €</td>';
    last10.forEach((r, i) => {
      const pv = i > 0 ? last10[i-1].delivery_fee_per_order : null;
      html += `<td>${fmtEur(r.delivery_fee_per_order, 2)} ${pctChangeInline(r.delivery_fee_per_order, pv)}</td>`;
    });
    html += '</tr>';

    html += '</tbody></table></div>';
    return html;
  }

  /* ---- Run Rate Block (monthly only) ---- */
  function buildRunRateBlock(fin, cp, camp) {
    const latest = fin[fin.length - 1];
    if (!latest) return '';
    const parts = latest.period.replace(' 00:00:00','').split('-');
    const year = parseInt(parts[0]), month = parseInt(parts[1]) - 1;
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const today = new Date();
    const dataEndDay = (today.getFullYear() === year && today.getMonth() === month) ? today.getDate() - 1 : daysInMonth;
    if (dataEndDay <= 0 || dataEndDay >= daysInMonth) return '';

    const multiplier = daysInMonth / dataEndDay;
    const monthName = MONTHS_FULL[month];
    const prevMonth = fin.length >= 2 ? fin[fin.length - 2] : null;

    const rr = {
      gmv: latest.gmv_eur * multiplier,
      orders: latest.orders * multiplier,
      aov_del: latest.aov_with_delivery,
      aov_items: latest.aov_items_only,
      eater_fees: latest.eater_fees_per_order,
      bolt_plus: latest.bolt_plus_gmv_share,
      users_activated: latest.users_activated * multiplier,
      active_users: latest.active_users * multiplier,
    };

    const campLast = safe(camp).find(r => r.period === latest.period);
    const campPrev = prevMonth ? safe(camp).find(r => r.period === prevMonth.period) : null;
    const rrCampTotal = campLast ? campLast.campaigns_discount_eur * multiplier : null;
    const rrCampBolt = campLast ? campLast.bolt_spend_eur * multiplier : null;
    const rrCampMerch = campLast ? campLast.merchant_spend_eur * multiplier : null;
    const rrCampPctGmv = (rrCampTotal && rr.gmv) ? (rrCampTotal / rr.gmv * 100) : null;
    const rrDemandPct = rrCampPctGmv;
    const commAov = rr.aov_del ? (rr.eater_fees / rr.aov_del * 100) : null;
    const commGmv = rr.gmv ? (rr.eater_fees * rr.orders / rr.gmv * 100) : null;

    let html = '<div class="run-rate-block">';
    html += '<div class="run-rate-header">';
    html += `<span class="run-rate-badge">${monthName.toUpperCase()} RUN RATE</span>`;
    html += `<span class="run-rate-info">${dataEndDay} days of data · ×${multiplier.toFixed(2)} projection to ${monthName} ${daysInMonth}</span>`;
    html += '</div>';
    html += '<div class="run-rate-grid">';

    function rrCard(label, displayVal, curRaw, prevRaw) {
      const chg = (curRaw != null && prevRaw != null) ? changeHtml(curRaw, prevRaw) : '';
      const hasChg = curRaw != null && prevRaw != null && pctChange(curRaw, prevRaw) != null;
      const chgStr = hasChg ? `<div class="rr-chg">${chg}</div>` : '';
      const prevStr = prevRaw != null ? `<div class="rr-prev">${MONTHS_SHORT[month > 0 ? month - 1 : 11]}: ${typeof prevRaw === 'number' && prevRaw > 100 ? fmtEur(prevRaw) : (typeof prevRaw === 'number' ? prevRaw.toFixed(1) : prevRaw)}</div>` : '';
      return `<div class="rr-card"><div class="rr-label">${label}</div><div class="rr-value">${displayVal}</div>${chgStr}${prevStr}</div>`;
    }

    html += rrCard('GMV', fmtEur(rr.gmv), rr.gmv, prevMonth ? prevMonth.gmv_eur : null);
    html += rrCard('Orders', fmt(Math.round(rr.orders)), rr.orders, prevMonth ? prevMonth.orders : null);
    html += rrCard('AOV (w/ Delivery)', fmtEur(rr.aov_del, 2), rr.aov_del, prevMonth ? prevMonth.aov_with_delivery : null);
    html += rrCard('AOV (Items Only)', fmtEur(rr.aov_items, 2), rr.aov_items, prevMonth ? prevMonth.aov_items_only : null);
    html += rrCard('Eater Fees / Order', fmtEur(rr.eater_fees, 2), rr.eater_fees, prevMonth ? prevMonth.eater_fees_per_order : null);
    html += rrCard('Bolt Plus GMV Share', fmtPct(rr.bolt_plus, 1), rr.bolt_plus, prevMonth ? prevMonth.bolt_plus_gmv_share : null);
    if (rrCampTotal != null) html += rrCard('Campaigns Total', fmtEur(rrCampTotal), rrCampTotal, campPrev ? campPrev.campaigns_discount_eur : null);
    if (rrCampBolt != null) html += rrCard('Campaigns Bolt', fmtEur(rrCampBolt), rrCampBolt, campPrev ? campPrev.bolt_spend_eur : null);
    if (rrCampMerch != null) html += rrCard('Campaigns Merchant', fmtEur(rrCampMerch), rrCampMerch, campPrev ? campPrev.merchant_spend_eur : null);
    if (rrCampPctGmv != null) html += rrCard('Campaigns % GMV', fmtPct(rrCampPctGmv, 1), rrCampPctGmv, campPrev && campPrev.gmv_eur ? (campPrev.campaigns_discount_eur / campPrev.gmv_eur * 100) : null);
    if (commAov != null) html += rrCard('Commission of AOV, %', fmtPct(commAov, 1), commAov, prevMonth && prevMonth.aov_with_delivery ? (prevMonth.eater_fees_per_order / prevMonth.aov_with_delivery * 100) : null);
    if (commGmv != null) html += rrCard('Commission of GMV, %', fmtPct(commGmv, 1), commGmv, prevMonth && prevMonth.gmv_eur ? (prevMonth.eater_fees_per_order * prevMonth.orders / prevMonth.gmv_eur * 100) : null);
    html += rrCard('Users Activated', fmt(Math.round(rr.users_activated)), rr.users_activated, prevMonth ? prevMonth.users_activated : null);

    html += '</div></div>';
    return html;
  }

  /* ---- Bad Order Breakdown ---- */
  function buildBadOrderBreakdown(ops, fail, opsIdx) {
    const oc = opsIdx >= 0 ? ops[opsIdx] : last(ops);
    const op = opsIdx > 0 ? ops[opsIdx - 1] : (opsIdx === 0 ? null : prev(ops));

    const failIdx = fail.findIndex(r => r.period === currentPeriod);
    const fc = failIdx >= 0 ? fail[failIdx] : last(fail);
    const fp = failIdx > 0 ? fail[failIdx - 1] : (failIdx === 0 ? null : prev(fail));

    if (!oc && !fc) return '';

    let html = '<div class="sub-section-title">Bad Order Breakdown</div>';
    html += '<div class="kpi-grid">';
    if (oc) {
      html += kpi('Bad Rate', fmtPct(oc.bad_order_rate, 1), oc, op, 'bad_order_rate', {inverted: true});
      html += kpi('Late Delivery', fmtPct(oc.late_delivery_rate, 1), oc, op, 'late_delivery_rate', {inverted: true});
      html += kpi('Late Pickup', fmtPct(oc.late_pickup_rate, 1), oc, op, 'late_pickup_rate', {inverted: true});
    }
    if (fc) {
      const fmPct = fc.total_placed ? (fc.failed_merchant / fc.total_placed * 100) : 0;
      const fpMPct = fp && fp.total_placed ? (fp.failed_merchant / fp.total_placed * 100) : null;
      const fbPct = fc.total_placed ? (fc.failed_bolt_courier / fc.total_placed * 100) : 0;
      const fpBPct = fp && fp.total_placed ? (fp.failed_bolt_courier / fp.total_placed * 100) : null;
      html += kpi('Failed (Merchant)', fmtPct(fmPct, 1), {v: fmPct}, fpMPct != null ? {v: fpMPct} : null, 'v', {inverted: true});
      html += kpi('Failed (Bolt+Courier)', fmtPct(fbPct, 1), {v: fbPct}, fpBPct != null ? {v: fpBPct} : null, 'v', {inverted: true});
      html += kpi('Failed Rate Total', fmtPct(fc.failed_rate_total, 1), fc, fp, 'failed_rate_total', {inverted: true});
    }
    html += '</div>';
    return html;
  }

  /* ---- WoW Comparison Table ---- */
  function buildWoWComparisonTable(ops, fail) {
    const last10 = ops.slice(-10);
    if (last10.length < 2) return '';

    const tableTitle = currentGran === 'quarterly' ? 'QoQ Comparison' : (currentGran === 'monthly' ? 'MoM Comparison' : 'WoW Comparison');
    let html = `<div class="sub-section-title">${tableTitle}</div>`;
    html += '<div class="data-table-wrap"><table class="data-table"><thead><tr><th></th>';
    last10.forEach(r => { html += `<th>${periodLabel(r.period, currentGran)}</th>`; });
    html += '</tr></thead><tbody>';

    function rowFmt(label, getter, formatter, inverted=false) {
      let tr = `<tr><td>${label}</td>`;
      last10.forEach((r, i) => {
        const val = getter(r);
        const pv = i > 0 ? getter(last10[i-1]) : null;
        const chg = pctChangeInline(val, pv, inverted);
        tr += `<td>${formatter(val)} ${chg}</td>`;
      });
      tr += '</tr>';
      return tr;
    }

    html += rowFmt('Stores', r => r.active_stores, v => fmt(v));
    html += rowFmt('Acceptance Rate, %', r => r.acceptance_rate, v => fmtPct(v, 1));
    html += rowFmt('Availability, %', r => r.availability_rate, v => fmtPct(v, 1));
    html += rowFmt('Avg Rating', r => r.avg_rating, v => fmt(v, 2));
    html += rowFmt('Honey %', r => r.honey_order_rate, v => fmtPct(v, 1));
    html += rowFmt('Bad %', r => r.bad_order_rate, v => fmtPct(v, 1), true);
    html += rowFmt('Late Delivery Rate, %', r => r.late_delivery_rate, v => fmtPct(v, 1), true);
    html += rowFmt('Late Pickup Rate, %', r => r.late_pickup_rate, v => fmtPct(v, 1), true);

    // Failed rates from fail data
    const failSlice = safe(fail).slice(-10);
    if (failSlice.length) {
      let tr = '<tr><td>Failed (Bolt+Courier), %</td>';
      failSlice.forEach((r, i) => {
        const val = r.total_placed ? (r.failed_bolt_courier / r.total_placed * 100) : 0;
        const pv = i > 0 && failSlice[i-1].total_placed ? (failSlice[i-1].failed_bolt_courier / failSlice[i-1].total_placed * 100) : null;
        tr += `<td>${fmtPct(val, 1)} ${pctChangeInline(val, pv, true)}</td>`;
      });
      tr += '</tr>';
      html += tr;

      tr = '<tr><td>Failed Rate Total, %</td>';
      failSlice.forEach((r, i) => {
        const val = r.failed_rate_total;
        const pv = i > 0 ? failSlice[i-1].failed_rate_total : null;
        tr += `<td>${fmtPct(val, 1)} ${pctChangeInline(val, pv, true)}</td>`;
      });
      tr += '</tr>';
      html += tr;
    }

    html += rowFmt('Avg Delivery, min', r => r.avg_delivery_minutes, v => fmt(v, 1), true);
    html += rowFmt('Replacement Rate, %', r => r.replacement_rate, v => fmtPct(v, 2), true);
    html += rowFmt('Adjustment Rate, %', r => r.adjustment_rate, v => fmtPct(v, 2), true);

    html += '</tbody></table></div>';
    return html;
  }

  /* ---- Campaign Dynamics Table ---- */
  function buildCampaignDynamicsTable(camp) {
    const last10 = camp.slice(-10);
    if (last10.length < 2) return '';

    let html = '<div class="sub-section-title">Campaign Dynamics</div>';
    html += '<div class="data-table-wrap"><table class="data-table"><thead><tr><th></th>';
    last10.forEach(r => { html += `<th>${periodLabel(r.period, currentGran)}</th>`; });
    html += '</tr></thead><tbody>';

    // Total Discount
    html += '<tr><td>Total Discount, €</td>';
    last10.forEach((r, i) => {
      const pv = i > 0 ? last10[i-1].campaigns_discount_eur : null;
      html += `<td>${fmtEur(r.campaigns_discount_eur)} ${pctChangeInline(r.campaigns_discount_eur, pv)}</td>`;
    });
    html += '</tr>';

    // Bolt Spend
    html += '<tr><td>Bolt Spend, €</td>';
    last10.forEach((r, i) => {
      const pv = i > 0 ? last10[i-1].bolt_spend_eur : null;
      html += `<td>${fmtEur(r.bolt_spend_eur)} ${pctChangeInline(r.bolt_spend_eur, pv)}</td>`;
    });
    html += '</tr>';

    // Merchant Spend
    html += '<tr><td>Merchant Spend, €</td>';
    last10.forEach((r, i) => {
      const pv = i > 0 ? last10[i-1].merchant_spend_eur : null;
      html += `<td>${fmtEur(r.merchant_spend_eur)} ${pctChangeInline(r.merchant_spend_eur, pv)}</td>`;
    });
    html += '</tr>';

    // % of GMV
    html += '<tr><td>Campaigns % GMV</td>';
    last10.forEach((r, i) => {
      const val = r.gmv_eur ? (r.campaigns_discount_eur / r.gmv_eur * 100) : 0;
      const pv = i > 0 && last10[i-1].gmv_eur ? (last10[i-1].campaigns_discount_eur / last10[i-1].gmv_eur * 100) : null;
      html += `<td>${fmtPct(val, 1)} ${ppChangeHtml(val, pv)}</td>`;
    });
    html += '</tr>';

    // Bolt % GMV
    html += '<tr><td>Bolt % GMV</td>';
    last10.forEach((r, i) => {
      const val = r.gmv_eur ? (r.bolt_spend_eur / r.gmv_eur * 100) : 0;
      const pv = i > 0 && last10[i-1].gmv_eur ? (last10[i-1].bolt_spend_eur / last10[i-1].gmv_eur * 100) : null;
      html += `<td>${fmtPct(val, 1)} ${ppChangeHtml(val, pv)}</td>`;
    });
    html += '</tr>';

    // Merchant % GMV
    html += '<tr><td>Merchant % GMV</td>';
    last10.forEach((r, i) => {
      const val = r.gmv_eur ? (r.merchant_spend_eur / r.gmv_eur * 100) : 0;
      const pv = i > 0 && last10[i-1].gmv_eur ? (last10[i-1].merchant_spend_eur / last10[i-1].gmv_eur * 100) : null;
      html += `<td>${fmtPct(val, 1)} ${ppChangeHtml(val, pv)}</td>`;
    });
    html += '</tr>';

    // Item-Level Discount Promo Share (brand level)
    if (currentView !== 'overview') {
      const promoData = safe((D.item_discount_promo || {})[currentView]);
      if (promoData.length) {
        html += '<tr><td>Item Discount Promo, %</td>';
        last10.forEach((r, i) => {
          const pd = promoData.find(x => x.period === r.period);
          const val = pd ? pd.value : null;
          const ppd = i > 0 ? promoData.find(x => x.period === last10[i-1].period) : null;
          const pv = ppd ? ppd.value : null;
          html += `<td>${val != null ? fmtPct(val, 2) : '—'} ${ppChangeHtml(val, pv)}</td>`;
        });
        html += '</tr>';
      }
    }

    html += '</tbody></table></div>';
    return html;
  }

  /* ---- Charts ---- */
  function makeChart(id, cfg) {
    const el = document.getElementById(id);
    if (!el) return;
    const c = new Chart(el.getContext('2d'), cfg);
    charts.push(c);
    return c;
  }

  function drawGmvOrdersChart(fin) {
    if (!fin.length) return;
    const labels = fin.map(r => periodLabel(r.period, currentGran));
    makeChart('chartGmvOrders', {
      type: 'line',
      data: {
        labels,
        datasets: [
          { label: 'GMV (€)', data: fin.map(r => r.gmv_eur), borderColor: '#34D186', backgroundColor: '#34D18630', fill: true, tension: 0.3, yAxisID: 'y' },
          { label: 'Orders', data: fin.map(r => r.orders), borderColor: '#1A1A2E', backgroundColor: '#1A1A2E30', fill: false, tension: 0.3, yAxisID: 'y1' }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        scales: {
          y: { type: 'linear', position: 'left', title: { display: true, text: 'GMV (€)' }, grid: { color: '#E2E8F020' } },
          y1: { type: 'linear', position: 'right', title: { display: true, text: 'Orders' }, grid: { drawOnChartArea: false } }
        },
        plugins: { legend: { position: 'top' } }
      }
    });
  }

  function drawEaterFeesChart(fin) {
    if (!fin.length) return;
    const labels = fin.map(r => periodLabel(r.period, currentGran));
    makeChart('chartEaterFees', {
      type: 'line',
      data: {
        labels,
        datasets: [
          { label: 'Total Eater Fees/Order', data: fin.map(r => r.eater_fees_per_order), borderColor: '#1A1A2E', borderWidth: 2.5, borderDash: [5, 3], fill: false, tension: 0.3, pointRadius: 3 },
          { label: 'Delivery Fee/Order', data: fin.map(r => r.delivery_fee_per_order), borderColor: '#6366F1', backgroundColor: '#6366F120', fill: true, tension: 0.3 },
          { label: 'Small Order Fee/Order', data: fin.map(r => r.small_order_fee_per_order), borderColor: '#F59E0B', fill: false, tension: 0.3 },
          { label: 'Service Fee/Order', data: fin.map(r => r.service_fee_per_order), borderColor: '#EF4444', fill: false, tension: 0.3 }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        scales: { y: { title: { display: true, text: '€ per Order' } } },
        plugins: { legend: { position: 'top' } }
      }
    });
  }

  function drawGmvShareChart() {
    const src = getDataSource();
    let partnerData = safe(src.gmv_by_partner).filter(r => r.period === currentPeriod);
    if (!partnerData.length) partnerData = safe(D.top_partners_gmv);
    if (!partnerData.length) return;
    partnerData.sort((a, b) => b.gmv_eur - a.gmv_eur);
    const top10 = partnerData.slice(0, 10);
    const othersGmv = partnerData.slice(10).reduce((a, b) => a + b.gmv_eur, 0);
    const labels = top10.map(r => r.group_name);
    const data = top10.map(r => r.gmv_eur);
    if (othersGmv > 0) { labels.push('Others'); data.push(othersGmv); }
    const totalGmv = data.reduce((a, b) => a + b, 0);
    const colors = ['#34D186','#1A1A2E','#6366F1','#F59E0B','#EF4444','#8B5CF6','#EC4899','#14B8A6','#F97316','#64748B','#CBD5E1'];
    makeChart('chartGmvShare', {
      type: 'doughnut',
      data: { labels, datasets: [{ data, backgroundColor: colors.slice(0, labels.length) }] },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: 'right', labels: { boxWidth: 12, font: { size: 11 } } },
          tooltip: { callbacks: { label: ctx => `${ctx.label}: €${fmt(ctx.parsed, 0)} (${fmtPct(ctx.parsed / totalGmv * 100, 1)})` } }
        }
      }
    });
  }

  function drawCampaignsChart(camp) {
    if (!camp.length) return;
    const labels = camp.map(r => periodLabel(r.period, currentGran));
    makeChart('chartCampaigns', {
      type: 'line',
      data: {
        labels,
        datasets: [
          { label: 'Total Discount, % GMV', data: camp.map(r => r.gmv_eur ? (r.campaigns_discount_eur / r.gmv_eur * 100) : 0), borderColor: '#34D186', backgroundColor: '#34D18620', fill: true, tension: 0.3 },
          { label: 'Bolt Spend, % GMV', data: camp.map(r => r.gmv_eur ? (r.bolt_spend_eur / r.gmv_eur * 100) : 0), borderColor: '#1A1A2E', tension: 0.3 },
          { label: 'Merchant Spend, % GMV', data: camp.map(r => r.gmv_eur ? (r.merchant_spend_eur / r.gmv_eur * 100) : 0), borderColor: '#F59E0B', tension: 0.3 }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        scales: { y: { title: { display: true, text: '% of GMV' }, ticks: { callback: v => v.toFixed(1) + '%' } } },
        plugins: { legend: { position: 'top' } }
      }
    });
  }

  render();
})();
</script>
</body>
</html>
