<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3P Stores Ukraine — Weekly Performance Report</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root {
  --primary: #34D186;
  --primary-light: #34D18620;
  --dark: #1A1A2E;
  --bg: #F8F9FA;
  --card: #FFFFFF;
  --border: #E2E8F0;
  --text: #1A1A2E;
  --text-secondary: #64748B;
  --red: #EF4444;
  --green: #34D186;
  --orange: #F59E0B;
  --sidebar-w: 178px;
  --city-nav-w: 200px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; overflow-x: hidden; }

.sidebar { width: var(--sidebar-w); background: var(--dark); color: #fff; position: fixed; top: 0; left: 0; bottom: 0; overflow-y: auto; z-index: 100; display: flex; flex-direction: column; }
.sidebar-header { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
.sidebar-header h2 { font-size: 16px; font-weight: 700; color: var(--primary); }
.sidebar-header p { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 4px; }
.sidebar-nav { flex: 1; padding: 12px 0; }
.nav-item { padding: 10px 20px; cursor: pointer; font-size: 13px; color: rgba(255,255,255,0.7); transition: all 0.2s; border-left: 3px solid transparent; }
.nav-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.nav-item.active { background: rgba(52,209,134,0.1); color: var(--primary); border-left-color: var(--primary); font-weight: 600; }
.nav-item.highlighted { color: #F59E0B; font-weight: 600; }
.nav-section-title { padding: 16px 20px 6px; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.35); }

.main { margin-left: var(--sidebar-w); flex: 1; padding: 24px 32px; max-width: calc(100vw - var(--sidebar-w)); overflow-x: hidden; box-sizing: border-box; }

/* Secondary city navigation panel (appears to the right of the main nav in City overview mode) */
.city-nav { position: fixed; top: 0; left: var(--sidebar-w); bottom: 0; width: var(--city-nav-w); background: var(--card); border-right: 1px solid var(--border); overflow-y: auto; z-index: 99; display: none; padding: 14px 0; }
.city-nav .city-nav-title { padding: 8px 18px 10px; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-secondary); font-weight: 700; }
.city-nav .city-nav-item { padding: 8px 18px; cursor: pointer; font-size: 13px; color: var(--text); border-left: 3px solid transparent; transition: all 0.15s; }
.city-nav .city-nav-item:hover { background: var(--primary-light); }
.city-nav .city-nav-item.active { background: var(--primary-light); color: var(--dark); border-left-color: var(--primary); font-weight: 600; }
body.city-mode .city-nav { display: block; }
body.city-mode .main { margin-left: calc(var(--sidebar-w) + var(--city-nav-w)); max-width: calc(100vw - var(--sidebar-w) - var(--city-nav-w)); }
.top-bar { margin-bottom: 16px; }
.controls-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
.top-bar h1 { font-size: 22px; font-weight: 700; }
.controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.toggle-group { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.toggle-btn { padding: 6px 16px; font-size: 12px; cursor: pointer; background: var(--card); border: none; color: var(--text-secondary); font-weight: 500; transition: all 0.2s; }
.toggle-btn.active { background: var(--primary); color: #fff; }

.period-slider { position: relative; max-width: 100%; overflow: hidden; }
.period-tabs { display: flex; gap: 4px; flex-wrap: wrap; padding: 2px 0; }
.period-tab { padding: 5px 12px; font-size: 11px; border-radius: 6px; cursor: pointer; background: var(--card); border: 1px solid var(--border); color: var(--text-secondary); transition: all 0.2s; white-space: nowrap; flex-shrink: 0; }
.period-tab:hover { border-color: var(--primary); }
.period-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.slider-arrow { display: none; }

.section { margin-bottom: 32px; }
.section-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 2px solid var(--primary); display: inline-block; }
.sub-section-title { font-size: 14px; font-weight: 600; margin: 20px 0 12px; color: var(--dark); }

.kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-bottom: 20px; }
.kpi-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
.kpi-label { font-size: 11px; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.3px; }
.kpi-value { font-size: 20px; font-weight: 700; color: var(--dark); }
.kpi-change { font-size: 11px; margin-top: 4px; display: flex; align-items: center; gap: 3px; }
.kpi-change.up { color: var(--green); }
.kpi-change.down { color: var(--red); }
.kpi-change.neutral { color: var(--text-secondary); }

.data-table-wrap { overflow-x: auto; margin-bottom: 20px; }
.data-table { width: 100%; border-collapse: collapse; font-size: 12px; background: var(--card); border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
.data-table th { background: var(--dark); color: #fff; padding: 10px 12px; text-align: left; font-weight: 600; white-space: nowrap; }
.data-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:hover td { background: var(--primary-light); }
.data-table .section-row td { background: #f1f5f9; font-weight: 700; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-secondary); padding: 7px 12px; }
.data-table .section-row.grp-overview td { background: #E8F9F1; color: #0F7A4F; }
.data-table .section-row.grp-courier td { background: #EAF1FE; color: #2456B3; }
.data-table .section-row.grp-failed td { background: #FDECEC; color: #B3283A; }
.data-table .section-row.grp-adjust td { background: #F2ECFB; color: #6A3FB0; }
.chg-up { color: var(--green); font-size: 10px; margin-left: 4px; }
.chg-down { color: var(--red); font-size: 10px; margin-left: 4px; }

.chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
.chart-container { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
.chart-container.full { grid-column: 1 / -1; }
.chart-container h3 { font-size: 13px; font-weight: 600; margin-bottom: 12px; }
.chart-wrap { position: relative; height: 300px; }

.sub-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
.sub-kpi { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px; font-size: 12px; }
.sub-kpi .label { color: var(--text-secondary); font-size: 10px; text-transform: uppercase; }
.sub-kpi .val { font-size: 16px; font-weight: 700; margin-top: 2px; }
.sub-kpi .chg { font-size: 10px; margin-top: 2px; }

/* Weekly notes / insights */
.notes-banner { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; margin-bottom: 20px; }
.notes-banner .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-secondary); margin-bottom: 6px; }
.notes-banner h2 { font-size: 18px; font-weight: 700; margin-bottom: 8px; line-height: 1.35; }
.notes-banner p { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
.notes-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
.notes-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
.notes-card h3 { font-size: 13px; font-weight: 700; margin-bottom: 12px; }
.insight { border-left: 3px solid var(--primary); background: #F0FDF6; border-radius: 0 8px 8px 0; padding: 10px 12px; margin-bottom: 8px; }
.insight.good { border-color: var(--green); background: #F0FDF6; }
.insight.warn { border-color: var(--orange); background: #FFF8EB; }
.insight.risk { border-color: var(--red); background: #FEF2F2; }
.insight.action { border-color: #6366F1; background: #EEF2FF; }
.insight-title { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
.insight-text { font-size: 12px; color: var(--text-secondary); line-height: 1.45; }
.notes-kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-bottom: 20px; }
.notes-kpi { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
.notes-kpi .label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.3px; color: var(--text-secondary); margin-bottom: 4px; }
.notes-kpi .val { font-size: 16px; font-weight: 700; }
.notes-kpi .wow { font-size: 11px; margin-top: 3px; }
.notes-kpi .wow.up.good, .notes-kpi .wow.down.good { color: var(--green); }
.notes-kpi .wow.up.bad, .notes-kpi .wow.down.bad { color: var(--red); }
.notes-kpi .wow.flat { color: var(--text-secondary); }
.notes-meta { font-size: 11px; color: var(--text-secondary); margin-top: 8px; }
.partner-chip { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
.partner-chip:last-child { border-bottom: none; }
.partner-chip .name { font-weight: 600; }
.partner-chip .detail { color: var(--text-secondary); text-align: right; }
@media (max-width: 900px) { .notes-grid { grid-template-columns: 1fr; } }

.run-rate-block { background: #FFF8E1; border: 2px solid #F59E0B; border-radius: 12px; padding: 20px; margin-bottom: 24px; }
.run-rate-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.run-rate-badge { background: #F59E0B; color: #fff; font-weight: 700; font-size: 12px; padding: 4px 12px; border-radius: 6px; text-transform: uppercase; }
.run-rate-info { font-size: 11px; color: var(--text-secondary); }
.run-rate-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 10px; }
.rr-card { background: #FFFDE7; border: 1px solid #FFF59D; border-radius: 8px; padding: 10px 12px; }
.rr-card .rr-label { font-size: 9px; color: var(--text-secondary); text-transform: uppercase; font-weight: 600; }
.rr-card .rr-value { font-size: 18px; font-weight: 700; margin-top: 2px; }
.rr-card .rr-chg { font-size: 10px; margin-top: 2px; }
.rr-card .rr-prev { font-size: 9px; color: var(--text-secondary); margin-top: 2px; }

.view-toggle { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-bottom: 8px; }
.view-toggle button { padding: 4px 12px; font-size: 11px; border: none; cursor: pointer; background: var(--card); color: var(--text-secondary); font-weight: 500; }
.view-toggle button.active { background: var(--dark); color: #fff; }

.city-toggle-btn { display: inline-block; padding: 4px 14px; font-size: 11px; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; background: var(--card); color: var(--text-secondary); font-weight: 500; margin: 8px 0; transition: all 0.2s; }
.city-toggle-btn.active { background: var(--dark); color: #fff; border-color: var(--dark); }

@media (max-width: 1000px) {
  .chart-row { grid-template-columns: 1fr; }
  .kpi-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
}
@media (max-width: 768px) {
  .sidebar { width: 100%; position: relative; height: auto; }
  .main { margin-left: 0; padding: 16px; }
}
</style>
</head>
<body>

<nav class="sidebar">
  <div class="sidebar-header">
    <h2>3P Stores Ukraine</h2>
    <p>Weekly Performance Report</p>
  </div>
  <div class="sidebar-nav" id="sidebarNav"></div>
</nav>

<div id="cityNav" class="city-nav"></div>

<div class="main">
  <div class="top-bar">
    <h1 id="pageTitle">All 3P Stores</h1>
  </div>
  <div id="brandSelector"></div>
  <div class="controls-row">
    <div class="toggle-group" id="granToggle"></div>
    <div class="period-tabs" id="periodTabs"></div>
  </div>

  <div id="content"></div>
</div>

<script>
/*__REPORT_DATA__*/

(function() {
  const D = typeof REPORT_DATA !== 'undefined' ? REPORT_DATA : null;
  if (!D) { document.getElementById('content').innerHTML = '<p>No data loaded.</p>'; return; }

  // Merchant SKU Sessions Availability Rate — shown as-is (weighted rate from fact_provider_weekly).
  // Note: reads ~1.4x higher than the internal Looker report; definition not yet fully reconciled.
  const SHOW_SKU_AVAILABILITY = true;

  let currentView = 'overview';
  let currentGran = 'weekly';
  let currentPeriod = null;
  let currentCity = null;
  let charts = [];
  let showCityBreakdown = false;

  const $ = id => document.getElementById(id);

  /* ---- helpers ---- */
  function safe(arr) { return Array.isArray(arr) ? arr : []; }
  function fmt(v, dec=0) { if (v == null || isNaN(v)) return '—'; return Number(v).toLocaleString('en-US', {minimumFractionDigits: dec, maximumFractionDigits: dec}); }
  function fmtPct(v, dec=1) { if (v == null || isNaN(v)) return '—'; return Number(v).toFixed(dec) + '%'; }
  function fmtEur(v, dec=0) { if (v == null || isNaN(v)) return '—'; return '€' + Number(v).toLocaleString('en-US', {minimumFractionDigits: dec, maximumFractionDigits: dec}); }

  const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const MONTHS_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  function periodLabel(p, gran) {
    if (!p) return '—';
    const parts = p.replace(' 00:00:00','').split('-');
    if (parts.length < 3) return p;
    const month = parseInt(parts[1]) - 1, day = parseInt(parts[2]);
    if (gran === 'quarterly') { const q = Math.ceil((month+1)/3); return `Q${q} ${parts[0]}`; }
    if (gran === 'monthly') return MONTHS_FULL[month] + ' ' + parts[0];
    return MONTHS_SHORT[month] + ' ' + day;
  }

  function pctChange(cur, prev) {
    if (prev == null || cur == null || prev === 0) return null;
    return ((cur - prev) / Math.abs(prev)) * 100;
  }
  function ppChange(cur, prev) {
    if (prev == null || cur == null) return null;
    return cur - prev;
  }
  function changeHtml(cur, prev, inverted=false) {
    const ch = pctChange(cur, prev);
    if (ch == null) return '<span class="kpi-change neutral">—</span>';
    const up = ch >= 0;
    const cls = inverted ? (up ? 'down' : 'up') : (up ? 'up' : 'down');
    const arrow = up ? '&#9650;' : '&#9660;';
    return `<span class="kpi-change ${cls}">${arrow} ${Math.abs(ch).toFixed(1)}%</span>`;
  }
  function ppChangeHtml(cur, prev, inverted=false) {
    const pp = ppChange(cur, prev);
    if (pp == null) return '';
    const up = pp >= 0;
    const cls = inverted ? (up ? 'chg-down' : 'chg-up') : (up ? 'chg-up' : 'chg-down');
    const sign = pp >= 0 ? '+' : '';
    return `<span class="${cls}">${sign}${pp.toFixed(1)}pp</span>`;
  }
  function pctChangeInline(cur, prev, inverted=false) {
    const ch = pctChange(cur, prev);
    if (ch == null) return '';
    const up = ch >= 0;
    const cls = inverted ? (up ? 'chg-down' : 'chg-up') : (up ? 'chg-up' : 'chg-down');
    const sign = ch >= 0 ? '+' : '';
    return `<span class="${cls}">${sign}${ch.toFixed(1)}%</span>`;
  }

  function destroyCharts() { charts.forEach(c => { try { c.destroy(); } catch(e){} }); charts = []; }
  function last(arr) { return arr.length ? arr[arr.length - 1] : null; }
  function prev(arr) { return arr.length >= 2 ? arr[arr.length - 2] : null; }

  /* ---- collapsible wrapper (Show/Hide button, like GMV by City) ---- */
  function collapsible(label, innerHtml, open=true) {
    if (!innerHtml) return '';
    const disp = open ? 'block' : 'none';
    const verb = open ? 'Hide' : 'Show';
    return `<div style="margin-bottom:16px;"><button class="toggle-btn" data-label="${label}" style="font-size:12px;padding:6px 14px;border:1px solid var(--border);border-radius:6px;cursor:pointer;background:var(--card);" onclick="var t=this.nextElementSibling;var o=t.style.display==='none';t.style.display=o?'block':'none';this.textContent=(o?'Hide ':'Show ')+this.dataset.label;">${verb} ${label}</button><div style="display:${disp};">${innerHtml}</div></div>`;
  }

  /* ---- sidebar (Change 1: employee grouping) ---- */
  function buildSidebar() {
    const nav = $('sidebarNav');
    const highlightedPartners = new Set(['LOKO', 'VARUS', 'RUKAVYCHKA']);
    const subBrandKeys = new Set(safe(D.subbrand_keys));  // KOPIYKA sub-brands: reachable only via the KOPIYKA Group page
    const partnerSet = new Set(safe(D.partners_list).filter(p => !subBrandKeys.has(p)));
    let html = '<div class="nav-section-title">Overview</div>';
    html += `<div class="nav-item ${currentView==='overview'?'active':''}" data-view="overview">All 3P Stores</div>`;
    if (D.weekly_insights) {
      html += `<div class="nav-item ${currentView==='insights'?'active':''}" data-view="insights">Weekly notes</div>`;
    }
    if (safe(D.city_list).length) {
      html += `<div class="nav-item ${currentView==='city'?'active':''}" data-view="city">City overview</div>`;
    }
    html += `<div class="nav-item ${currentView==='portfolio'?'active':''}" data-view="portfolio">AM Performance</div>`;
    html += `<div class="nav-item ${currentView==='varus-performance'?'active':''}" data-view="varus-performance">Varus Performance</div>`;

    const groups = D.employee_groups || {};
    const groupNames = Object.keys(groups);

    if (groupNames.length) {
      const listed = new Set(subBrandKeys);
      groupNames.forEach(emp => {
        html += `<div class="nav-section-title">${emp}</div>`;
        const brands = safe(groups[emp]).filter(p => partnerSet.has(p));
        brands.sort((a, b) => (highlightedPartners.has(b) ? 1 : 0) - (highlightedPartners.has(a) ? 1 : 0));
        brands.forEach(p => {
          listed.add(p);
          const hl = highlightedPartners.has(p) ? ' highlighted' : '';
          html += `<div class="nav-item${hl} ${currentView===p?'active':''}" data-view="${p}">${displayName(p)}</div>`;
        });
      });
      const unlisted = safe(D.partners_list).filter(p => !listed.has(p) && !subBrandKeys.has(p));
      if (unlisted.length) {
        html += '<div class="nav-section-title">Other</div>';
        unlisted.forEach(p => {
          const hl = highlightedPartners.has(p) ? ' highlighted' : '';
          html += `<div class="nav-item${hl} ${currentView===p?'active':''}" data-view="${p}">${displayName(p)}</div>`;
        });
      }
    } else {
      html += '<div class="nav-section-title">Partners</div>';
      safe(D.partners_list).forEach(p => {
        const hl = highlightedPartners.has(p) ? ' highlighted' : '';
        html += `<div class="nav-item${hl} ${currentView===p?'active':''}" data-view="${p}">${p}</div>`;
      });
    }

    nav.innerHTML = html;
    nav.querySelectorAll('.nav-item').forEach(el => {
      el.addEventListener('click', () => {
        if (el.dataset.city) { currentView = 'city'; currentCity = el.dataset.city; }
        else { currentView = el.dataset.view; }
        currentPeriod = null;
        render();
      });
    });
  }

  /* ---- secondary city nav panel (right of the main sidebar, City overview only) ---- */
  function buildCityNav() {
    const el = $('cityNav');
    if (!el) return;
    if (currentView !== 'city') { document.body.classList.remove('city-mode'); el.innerHTML = ''; return; }
    document.body.classList.add('city-mode');
    let html = '<div class="city-nav-title">Cities · by GMV</div>';
    safe(D.city_list).forEach(c => {
      html += `<div class="city-nav-item ${currentCity===c?'active':''}" data-city="${c}">${c}</div>`;
    });
    el.innerHTML = html;
    el.querySelectorAll('.city-nav-item').forEach(elm => {
      elm.addEventListener('click', () => { currentCity = elm.dataset.city; currentPeriod = null; render(); });
    });
  }

  /* ---- brand sub-selector for groups that have sub-brands (e.g. KOPIYKA Group) ---- */
  function buildBrandSelector() {
    const el = $('brandSelector');
    if (!el) return;
    const groups = D.subbrand_groups || {};
    // Which group are we in? currentView is the group key or one of its sub-brand keys.
    let groupKey = null;
    Object.keys(groups).forEach(g => {
      if (currentView === g || (groups[g] || []).includes(currentView)) groupKey = g;
    });
    if (!groupKey) { el.innerHTML = ''; return; }
    const opts = [{ key: groupKey, label: 'Group' }].concat((groups[groupKey] || []).map(b => ({ key: b, label: b })));
    el.innerHTML = '<div class="view-toggle">' + opts.map(o =>
      `<button class="${currentView === o.key ? 'active' : ''}" data-bk="${o.key}">${o.label}</button>`
    ).join('') + '</div>';
    el.querySelectorAll('button').forEach(b => {
      b.addEventListener('click', () => { currentView = b.dataset.bk; currentPeriod = null; render(); });
    });
  }

  /* ---- granularity & period tabs with slider ---- */
  function buildControls() {
    buildBrandSelector();
    const gt = $('granToggle');
    gt.innerHTML = ['quarterly','monthly','weekly'].map(g =>
      `<button class="toggle-btn ${currentGran===g?'active':''}" data-g="${g}">${g.charAt(0).toUpperCase()+g.slice(1)}</button>`
    ).join('');
    gt.querySelectorAll('.toggle-btn').forEach(b => {
      b.addEventListener('click', () => { currentGran = b.dataset.g; currentPeriod = null; render(); });
    });

    const src = getDataSource();
    const periods = [...new Set(safe(src.financial).map(r => r.period))].sort();

    if (!currentPeriod && periods.length) {
      currentPeriod = periods[periods.length - 1];
    }

    const pt = $('periodTabs');
    let ph = '';
    periods.forEach(p => {
      ph += `<span class="period-tab ${currentPeriod===p?'active':''}" data-p="${p}">${periodLabel(p, currentGran)}</span>`;
    });
    pt.innerHTML = ph;
    pt.querySelectorAll('.period-tab').forEach(t => {
      t.addEventListener('click', () => { currentPeriod = t.dataset.p; render(); });
    });
  }


  function getDataSource() {
    if (currentView === 'overview') return (D.overview || {})[currentGran] || {};
    if (currentView === 'portfolio') return (D.overview || {})[currentGran] || {};
    if (currentView === 'varus-performance') return ((D.partners || {}).VARUS || {}).weekly || {};
    if (currentView === 'city') return (((D.cities || {})[currentCity] || {})[currentGran]) || {};
    return ((D.partners || {})[canonicalPartner(currentView)] || {})[currentGran] || {};
  }

  function quarterLabel(period) {
    const d = period.replace(' 00:00:00','').split('-');
    const m = parseInt(d[1]);
    const q = Math.ceil(m / 3);
    return `Q${q} ${d[0]}`;
  }

  /* ---- KPI card builder ---- */
  function kpi(label, value, curRow, prevRow, field, opts={}) {
    const inv = opts.inverted || false;
    const chg = prevRow ? changeHtml(curRow[field], prevRow[field], inv) : '<span class="kpi-change neutral">—</span>';
    return `<div class="kpi-card"><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div>${chg}</div>`;
  }

  /* ---- acceptance/availability helpers ---- */
  function getAcceptAvail() {
    if (currentView === 'overview') return safe((D.acceptance_availability || {}).overview);
    return safe((D.acceptance_availability || {})[canonicalPartner(currentView)]);
  }

  /* ---- aggregate partner city data (reuses aggregateCityData logic) ---- */
  function aggregatePartnerCityData(weeklyData, targetPeriod, targetGran) {
    return aggregateCityData(weeklyData, targetPeriod, targetGran);
  }

  /* ---- aggregate weekly city data for non-weekly granularity ---- */
  function aggregateCityData(weeklyData, targetPeriod, targetGran) {
    if (targetGran === 'weekly') {
      return safe(weeklyData).filter(r => r.period === targetPeriod).map(r => ({...r, city: r.city_name || r.city || 'Unknown'}));
    }
    const parts = targetPeriod.replace(' 00:00:00','').split('-');
    const yr = parseInt(parts[0]), mo = parseInt(parts[1]) - 1;
    let startDate, endDate;
    if (targetGran === 'monthly') {
      startDate = new Date(yr, mo, 1);
      endDate = new Date(yr, mo + 1, 0);
    } else {
      const qStartMonth = Math.floor(mo / 3) * 3;
      startDate = new Date(yr, qStartMonth, 1);
      endDate = new Date(yr, qStartMonth + 3, 0);
    }
    const cityMap = {};
    safe(weeklyData).forEach(r => {
      const rDate = new Date(r.period.replace(' 00:00:00',''));
      const cname = r.city_name || r.city || 'Unknown';
      if (rDate >= startDate && rDate <= endDate) {
        if (!cityMap[cname]) cityMap[cname] = { city: cname, orders: 0, gmv_eur: 0 };
        cityMap[cname].orders += (r.orders || 0);
        cityMap[cname].gmv_eur += (r.gmv_eur || 0);
      }
    });
    return Object.values(cityMap);
  }

    if (view === 'MILLION FLOWERS') return 'Million Flowers';

  function canonicalPartner(view) {
    return view === 'РОСТ' ? 'ROST' : view;

    const p = (D.partners || {})[canonicalPartner(view)] || {};

  function renderAMPortfolio() {
    $('pageTitle').textContent = 'AM Performance';
    const overview = (D.overview || {})[currentGran] || {};
    const totalFin = safe(overview.financial).find(r => r.period === currentPeriod);
    const totalCp = safe(overview.cp_margins).find(r => r.period === currentPeriod) || {};
    const totalOps = safe(overview.operational).find(r => r.period === currentPeriod) || {};
    const totalCamp = safe(overview.campaigns).find(r => r.period === currentPeriod) || {};
    if (!totalFin) {
      $('content').innerHTML = '<div class="section"><div class="section-title">AM Performance</div><p>No data for this period.</p></div>';
      return;
    }

    const groups = D.employee_groups || {};
    const getPeriod = (name, section) => {
      const node = (((D.partners || {})[canonicalPartner(name)] || {})[currentGran] || {});
      return safe(node[section]).find(r => r.period === currentPeriod) || null;
    };
    const sum = (rows, field) => rows.reduce((a, r) => a + Number((r && r[field]) || 0), 0);
    const rate = (num, den) => den ? num / den * 100 : null;
    const weighted = (rows, field) => {
      let num = 0, den = 0;
      rows.forEach(r => {
        if (!r || r[field] == null) return;
        const w = Number(r.delivered_orders || 0);
        if (w <= 0) return;
        num += Number(r[field]) * w;
        den += w;
      });
      return den ? num / den : null;
    };

    const rows = Object.keys(groups).map(owner => {
      const names = safe(groups[owner]);
      const fin = names.map(n => getPeriod(n, 'financial')).filter(Boolean);
      const cp = names.map(n => getPeriod(n, 'cp_margins')).filter(Boolean);
      const ops = names.map(n => getPeriod(n, 'operational')).filter(Boolean);
      const camp = names.map(n => getPeriod(n, 'campaigns')).filter(Boolean);
      const gmv = sum(fin, 'gmv_eur');
      const orders = sum(fin, 'orders');
      const opsGmv = sum(cp, 'ops_gmv_eur');
      const sessionsViewed = sum(fin, 'sessions_viewed');
      const sessionsOrdered = sum(fin, 'sessions_ordered');
      const retained = sum(fin, 'retained_users');
      const priorActive = sum(fin, 'prior_active_users');
      const delivered = sum(ops, 'delivered_orders');
      return {
        owner,
        assigned: names.length,
        gmv,
        orders,
        gmv_share: rate(gmv, totalFin.gmv_eur),
        order_share: rate(orders, totalFin.orders),
        avg_gmv: null,
        ops_gmv: opsGmv,
        commission: sum(cp, 'commission_eur'),
        cp_l1: sum(cp, 'cp_l1_eur'),
        cp_l2: sum(cp, 'cp_l2_eur'),
        courier_cost: sum(cp, 'courier_cost_eur'),
        delivered,
        acceptance: weighted(ops, 'acceptance_rate'),
        availability: weighted(ops, 'availability_rate'),
        rating: weighted(ops, 'avg_rating'),
        honey: weighted(ops, 'honey_order_rate'),
        bad: weighted(ops, 'bad_order_rate'),
        late: weighted(ops, 'late_delivery_rate'),
        delivery_time: weighted(ops, 'avg_delivery_minutes'),
        stores: sum(ops, 'stores_with_orders'),
        discount: sum(camp, 'campaigns_discount_eur'),
        bolt_spend: sum(camp, 'bolt_spend_eur'),
        merchant_spend: sum(camp, 'merchant_spend_eur'),
        active_users: sum(fin, 'active_users'),
        conversion: rate(sessionsOrdered, sessionsViewed),
        retention: rate(retained, priorActive),
      };
    });
    rows.forEach(r => { r.avg_gmv = r.assigned ? r.gmv / r.assigned : null; });

    const managedRows = rows.filter(r => r.owner !== 'NEW w/o AM');
    const coveredGmv = sum(managedRows, 'gmv');
    const coveredOrders = sum(managedRows, 'orders');
    const assigned = sum(managedRows, 'assigned');
    const coveredPct = rate(coveredGmv, totalFin.gmv_eur);
    const unassignedGmv = Math.max(0, Number(totalFin.gmv_eur || 0) - coveredGmv);

    const table = (title, headers, body) =>
      `<div class="section"><div class="section-title">${title}</div>
        <div class="data-table-wrap"><table class="data-table"><thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead>
        <tbody>${body}</tbody></table></div></div>`;
    const ownerCell = r => `<td><strong>${r.owner}</strong></td>`;
    const totalStyle = ' style="font-weight:700;background:var(--bg);"';

    let html = `<div class="section"><div class="section-title">Portfolio summary · ${periodLabel(currentPeriod, currentGran)}</div>
      <div class="kpi-grid">
        <div class="kpi-card"><div class="kpi-label">AM-assigned accounts</div><div class="kpi-value">${fmt(assigned)}</div><span class="kpi-change neutral">excluding NEW w/o AM</span></div>
        <div class="kpi-card"><div class="kpi-label">GMV / assigned account</div><div class="kpi-value">${fmtEur(assigned ? coveredGmv/assigned : null)}</div><span class="kpi-change neutral">${fmt(assigned)} assigned accounts</span></div>
        <div class="kpi-card"><div class="kpi-label">AM-managed GMV coverage</div><div class="kpi-value">${fmtPct(coveredPct, 1)}</div><span class="kpi-change neutral">${fmtEur(coveredGmv)}</span></div>
        <div class="kpi-card"><div class="kpi-label">Unmanaged / other GMV</div><div class="kpi-value">${fmtEur(unassignedGmv)}</div><span class="kpi-change neutral">${fmtPct(rate(unassignedGmv, totalFin.gmv_eur), 1)} of business</span></div>
      </div></div>`;

    html += table('Business ownership', ['AM / section','Assigned partners','GMV','% business','Orders','% business','GMV / assigned partner'],
      rows.map(r => `<tr>${ownerCell(r)}<td>${fmt(r.assigned)}</td><td>${fmtEur(r.gmv)}</td><td>${fmtPct(r.gmv_share,1)}</td><td>${fmt(r.orders)}</td><td>${fmtPct(r.order_share,1)}</td><td>${fmtEur(r.avg_gmv)}</td></tr>`).join('') +
      `<tr${totalStyle}><td>Total AM-managed</td><td>${fmt(assigned)}</td><td>${fmtEur(coveredGmv)}</td><td>${fmtPct(coveredPct,1)}</td><td>${fmt(coveredOrders)}</td><td>${fmtPct(rate(coveredOrders,totalFin.orders),1)}</td><td>${fmtEur(assigned ? coveredGmv/assigned : null)}</td></tr>
       <tr${totalStyle}><td>All 3P Stores</td><td>—</td><td>${fmtEur(totalFin.gmv_eur)}</td><td>100.0%</td><td>${fmt(totalFin.orders)}</td><td>100.0%</td><td>—</td></tr>`);

    html += table('Account roster', ['AM / section','Assigned partners'],
      rows.map(r => `<tr>${ownerCell(r)}<td>${safe(groups[r.owner]).map(displayName).join(', ')}</td></tr>`).join(''));

    html += table('Economics', ['AM / section','Commission, €','Commission, % GMV','CP L1, €','CP L1, %','CP L2, €','CP L2, %','CPO'],
      rows.map(r => `<tr>${ownerCell(r)}<td>${fmtEur(r.commission)}</td><td>${fmtPct(rate(r.commission,r.ops_gmv),1)}</td><td>${fmtEur(r.cp_l1)}</td><td>${fmtPct(rate(r.cp_l1,r.ops_gmv),1)}</td><td>${fmtEur(r.cp_l2)}</td><td>${fmtPct(rate(r.cp_l2,r.ops_gmv),1)}</td><td>${fmtEur(r.delivered ? r.courier_cost/r.delivered : null,2)}</td></tr>`).join('') +
      `<tr${totalStyle}><td>All 3P Stores</td><td>${fmtEur(totalCp.commission_eur)}</td><td>${fmtPct(rate(totalCp.commission_eur,totalCp.ops_gmv_eur),1)}</td><td>${fmtEur(totalCp.cp_l1_eur)}</td><td>${fmtPct(rate(totalCp.cp_l1_eur,totalCp.ops_gmv_eur),1)}</td><td>${fmtEur(totalCp.cp_l2_eur)}</td><td>${fmtPct(rate(totalCp.cp_l2_eur,totalCp.ops_gmv_eur),1)}</td><td>${fmtEur(totalOps.delivered_orders ? totalCp.courier_cost_eur/totalOps.delivered_orders : null,2)}</td></tr>`);

    html += table('Operational performance', ['AM / section','Stores w/ orders','Acceptance','Availability','Rating','Honey','Bad','Late delivery','Avg delivery'],
      rows.map(r => `<tr>${ownerCell(r)}<td>${fmt(r.stores)}</td><td>${fmtPct(r.acceptance,1)}</td><td>${fmtPct(r.availability,1)}</td><td>${fmt(r.rating,2)}</td><td>${fmtPct(r.honey,1)}</td><td>${fmtPct(r.bad,1)}</td><td>${fmtPct(r.late,1)}</td><td>${fmt(r.delivery_time,1)} min</td></tr>`).join('') +
      `<tr${totalStyle}><td>All 3P Stores</td><td>${fmt(totalOps.stores_with_orders)}</td><td>${fmtPct(totalOps.acceptance_rate,1)}</td><td>${fmtPct(totalOps.availability_rate,1)}</td><td>${fmt(totalOps.avg_rating,2)}</td><td>${fmtPct(totalOps.honey_order_rate,1)}</td><td>${fmtPct(totalOps.bad_order_rate,1)}</td><td>${fmtPct(totalOps.late_delivery_rate,1)}</td><td>${fmt(totalOps.avg_delivery_minutes,1)} min</td></tr>`);

    html += table('Campaigns & users', ['AM / section','Discount, €','Bolt spend, €','Merchant spend, €','Discount, % GMV','Active users*','Conversion','Retention'],
      rows.map(r => `<tr>${ownerCell(r)}<td>${fmtEur(r.discount)}</td><td>${fmtEur(r.bolt_spend)}</td><td>${fmtEur(r.merchant_spend)}</td><td>${fmtPct(rate(r.discount,r.gmv),1)}</td><td>${fmt(r.active_users)}</td><td>${fmtPct(r.conversion,1)}</td><td>${fmtPct(r.retention,1)}</td></tr>`).join('') +
      `<tr${totalStyle}><td>All 3P Stores</td><td>${fmtEur(totalCamp.campaigns_discount_eur)}</td><td>${fmtEur(totalCamp.bolt_spend_eur)}</td><td>${fmtEur(totalCamp.merchant_spend_eur)}</td><td>${fmtPct(rate(totalCamp.campaigns_discount_eur,totalFin.gmv_eur),1)}</td><td>${fmt(totalFin.active_users)}</td><td>${fmtPct(totalFin.conversion_rate,1)}</td><td>${fmtPct(totalFin.retention_rate,1)}</td></tr>`);

    html += '<div class="section"><div style="font-size:12px;color:var(--text-secondary);line-height:1.5;">* AM-level active users are summed across partner accounts and are not deduplicated between partners. Operational AM rates are weighted by delivered orders; All 3P uses the source-weighted total metric. CP and commission amounts come directly from provider weekly/monthly facts.</div></div>';
    $('content').innerHTML = html;
  }

  function renderVarusPerformance() {
    const vp = D.varus_performance || {};
    const src = (((D.partners || {}).VARUS || {}).weekly) || {};
    const fin = safe(src.financial);
    const camp = safe(src.campaigns);
    const ops = safe(src.operational);
    const fail = safe(src.failed_orders);
    const cur = last(fin), prv = prev(fin);
    if (!cur || !prv) {
      $('content').innerHTML = '<div class="section"><div class="section-title">Varus Performance</div><div style="padding:20px;">Not enough weekly data.</div></div>';
      return;
    }

    const curKey = cur.period.slice(0,10), prvKey = prv.period.slice(0,10);
    const at = (rows, key) => safe(rows).find(r => String(r.period || '').slice(0,10) === key) || {};
    const cCamp = at(camp, curKey), pCamp = at(camp, prvKey);
    const cOps = at(ops, curKey), pOps = at(ops, prvKey);
    const cFail = at(fail, curKey), pFail = at(fail, prvKey);
    const sum = (rows, field) => safe(rows).reduce((a,r) => a + Number(r[field] || 0), 0);
    const delta = (a,b) => Number(a || 0) - Number(b || 0);
    const signed = (v, dec=0) => `${v > 0 ? '+' : ''}${fmt(v, dec)}`;
    const pp = (a,b) => `${delta(a,b) > 0 ? '+' : ''}${fmt(delta(a,b),1)}pp`;
    const table = (title, headers, body, note='') =>
      `<div class="section"><div class="section-title">${title}</div>
       <div class="data-table-wrap"><table class="data-table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
       <tbody>${body}</tbody></table></div>${note ? `<div style="padding:10px 16px;color:var(--text-secondary);font-size:12px;">${note}</div>` : ''}</div>`;

    const orderLoss = Math.max(0, Number(prv.orders || 0) - Number(cur.orders || 0));
    const gmvLoss = Math.max(0, Number(prv.gmv_eur || 0) - Number(cur.gmv_eur || 0));
    const prevAov = Number(prv.gmv_eur || 0) / Number(prv.orders || 1);
    const curAov = Number(cur.gmv_eur || 0) / Number(cur.orders || 1);
    const volumeImpact = (Number(cur.orders || 0) - Number(prv.orders || 0)) * prevAov;
    const aovImpact = Number(cur.orders || 0) * (curAov - prevAov);
    const campaignOrderLoss = Math.max(0, Number(pCamp.campaign_orders || 0) - Number(cCamp.campaign_orders || 0));

    const daily = safe(vp.daily).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));
    const curDaily = daily.filter(r => String(r.date) >= curKey);
    const prvDaily = daily.filter(r => String(r.date) < curKey);
    const merchantPrev = sum(prvDaily, 'merchant_funded_orders');
    const merchantCur = sum(curDaily, 'merchant_funded_orders');
    const boltPrev = sum(prvDaily, 'bolt_funded_orders');
    const boltCur = sum(curDaily, 'bolt_funded_orders');
    const worstDay = curDaily.filter(r => r.availability_pct != null)
      .sort((a,b)=>Number(a.availability_pct)-Number(b.availability_pct))[0] || {};
    const maxLowDay = curDaily.slice().sort((a,b)=>Number(b.stores_below_50pct||0)-Number(a.stores_below_50pct||0))[0] || {};
    const maxLowStores = Number(maxLowDay.stores_below_50pct || 0);
    const troughLowStores = Number(worstDay.stores_below_50pct || 0);

    const citySets = {
      fin: safe(vp.city_financial), camp: safe(vp.city_campaigns),
      ops: safe(vp.city_operational), fail: safe(vp.city_failed)
    };
    const cities = [...new Set(citySets.fin.map(r=>r.city_name))];
    const cityRows = cities.map(city => {
      const pick = (set,key) => citySets[set].find(r=>r.city_name===city && String(r.period).slice(0,10)===key) || {};
      const pf=pick('fin',prvKey), cf=pick('fin',curKey), pc=pick('camp',prvKey), cc=pick('camp',curKey);
      const po=pick('ops',prvKey), co=pick('ops',curKey), pfa=pick('fail',prvKey), cfa=pick('fail',curKey);
      return {city, prev_gmv:pf.gmv_eur||0, gmv:cf.gmv_eur||0, prev_orders:pf.orders||0, orders:cf.orders||0,
        promo_delta:delta(cc.campaign_orders,pc.campaign_orders), merchant_delta:delta(cc.merchant_spend_eur,pc.merchant_spend_eur),
        prev_avail:po.availability_rate, avail:co.availability_rate,
        prev_stores:po.stores_with_orders, stores:co.stores_with_orders,
        prev_fail:pfa.failed_rate_total, fail:cfa.failed_rate_total,
        gmv_delta:delta(cf.gmv_eur,pf.gmv_eur), order_delta:delta(cf.orders,pf.orders)};
    }).sort((a,b)=>a.gmv_delta-b.gmv_delta);
    const topCities = cityRows.filter(r=>r.gmv_delta<0).slice(0,3);
    const topCityLoss = -sum(topCities.map(r=>({v:r.gmv_delta})),'v');

    const storeRowsRaw = safe(vp.stores_weekly);
    const storeIds = [...new Set(storeRowsRaw.map(r=>String(r.provider_id)))];
    const storeRows = storeIds.map(id => {
      const p=storeRowsRaw.find(r=>String(r.provider_id)===id && String(r.period).slice(0,10)===prvKey)||{};
      const c=storeRowsRaw.find(r=>String(r.provider_id)===id && String(r.period).slice(0,10)===curKey)||{};
      return {id, name:c.provider_name||p.provider_name||id, city:c.city_name||p.city_name||'—',
        prev_orders:p.orders||0, orders:c.orders||0, prev_gmv:p.gmv_eur||0, gmv:c.gmv_eur||0,
        status:c.provider_status||p.provider_status||'—',
        prev_avail:p.availability_pct, avail:c.availability_pct, scheduled:c.scheduled_hours, inactive:c.inactive_hours,
        low_days:c.low_availability_days, gmv_delta:delta(c.gmv_eur,p.gmv_eur), order_delta:delta(c.orders,p.orders)};
    }).filter(r=>r.prev_orders||r.orders).sort((a,b)=>a.gmv_delta-b.gmv_delta);
    const noOrderStores = storeRows.filter(r=>r.prev_orders>0 && r.orders===0);
    const confirmedClosed = noOrderStores.filter(r=>r.status==='hidden' || r.status==='deleted');
    const zeroOrdersActive = noOrderStores.filter(r=>!confirmedClosed.includes(r));
    const closedPrevGmv = sum(confirmedClosed,'prev_gmv');
    const closedPrevOrders = sum(confirmedClosed,'prev_orders');
    const lowAvailabilityRows = safe(vp.low_availability_daily)
      .filter(r=>String(r.date)>=curKey)
      .sort((a,b)=>String(a.date).localeCompare(String(b.date)) || String(a.city_name).localeCompare(String(b.city_name)));
    const worstLowRows = lowAvailabilityRows.filter(r=>String(r.date)===String(worstDay.date));
    const affectedIds = new Set(worstLowRows.map(r=>String(r.provider_id)));
    const affectedStores = storeRows.filter(r=>affectedIds.has(String(r.id)));
    const affectedPrevGmv = sum(affectedStores,'prev_gmv');
    const affectedGmv = sum(affectedStores,'gmv');
    const affectedPrevOrders = sum(affectedStores,'prev_orders');
    const affectedOrders = sum(affectedStores,'orders');
    const worstCityCounts = {};
    worstLowRows.forEach(r => { worstCityCounts[r.city_name] = (worstCityCounts[r.city_name] || 0) + 1; });
    const worstCitySummary = Object.entries(worstCityCounts)
      .sort((a,b)=>b[1]-a[1]).map(([city,count])=>`${city}: ${count}`).join(', ');
    const storeById = id => storeRows.find(r=>String(r.id)===String(id)) || {};

    let html = `<div class="section"><div class="section-title">Why VARUS declined · ${periodLabel(cur.period,'weekly')} vs ${periodLabel(prv.period,'weekly')}</div>
      <div style="padding:18px 20px;background:#FFF7ED;border-left:5px solid #F97316;border-radius:8px;line-height:1.55;">
        <div style="font-size:17px;font-weight:750;margin-bottom:6px;">Primary cause: merchant-funded promo pullback and lower traffic, compounded by a Tue–Thu availability incident.</div>
        <div style="color:var(--text-secondary);">GMV fell by <strong>${fmtEur(gmvLoss)}</strong> (${fmtPct(Math.abs(pctChange(cur.gmv_eur,prv.gmv_eur)),1)}) and orders by ${fmt(orderLoss)}. Campaign orders fell by ${fmt(campaignOrderLoss)} — ${fmt(orderLoss ? campaignOrderLoss/orderLoss*100 : null,0)}% of the net order decline. Merchant-funded orders fell ${fmtPct(Math.abs(pctChange(merchantCur,merchantPrev)),1)}, while viewed sessions fell ${fmtPct(Math.abs(pctChange(cur.sessions_viewed,prv.sessions_viewed)),1)} despite conversion improving ${pp(cur.conversion_rate,prv.conversion_rate)}. Availability dropped to ${fmtPct(worstDay.availability_pct,1)} on ${worstDay.date || '—'} with ${fmt(troughLowStores)} stores below 50%; the affected-store count peaked at ${fmt(maxLowStores)} on ${maxLowDay.date || '—'}. ${confirmedClosed.length} stores were confirmed hidden for the full week.</div>
      </div></div>`;

    html += `<div class="section"><div class="section-title">Weekly impact</div><div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-label">GMV</div><div class="kpi-value">${fmtEur(cur.gmv_eur)}</div>${changeHtml(cur.gmv_eur,prv.gmv_eur)}</div>
      <div class="kpi-card"><div class="kpi-label">Orders</div><div class="kpi-value">${fmt(cur.orders)}</div>${changeHtml(cur.orders,prv.orders)}</div>
      <div class="kpi-card"><div class="kpi-label">AOV</div><div class="kpi-value">${fmtEur(curAov,2)}</div>${changeHtml(curAov,prevAov)}</div>
      <div class="kpi-card"><div class="kpi-label">Viewed sessions</div><div class="kpi-value">${fmt(cur.sessions_viewed)}</div>${changeHtml(cur.sessions_viewed,prv.sessions_viewed)}</div>
    </div></div>`;

    const driverCard = (title, verdict, body, color) =>
      `<div style="padding:16px 18px;border:1px solid var(--border);border-top:4px solid ${color};border-radius:9px;background:var(--card);">
       <div style="font-size:12px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.04em;">${verdict}</div>
       <div style="font-size:16px;font-weight:700;margin:4px 0 8px;">${title}</div><div style="font-size:13px;line-height:1.55;color:var(--text-secondary);">${body}</div></div>`;
    html += `<div class="section"><div class="section-title">Driver assessment</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;padding:0 4px 4px;">
      ${driverCard('Merchant promotions','Primary driver',
        `Merchant spend fell ${fmtPct(Math.abs(pctChange(cCamp.merchant_spend_eur,pCamp.merchant_spend_eur)),1)} (${fmtEur(pCamp.merchant_spend_eur)} → ${fmtEur(cCamp.merchant_spend_eur)}). Merchant-funded orders fell ${fmt(merchantPrev)} → ${fmt(merchantCur)}; Bolt-funded orders were broadly stable (${fmt(boltPrev)} → ${fmt(boltCur)}).`, '#DC2626')}
      ${driverCard('Traffic / demand','Primary driver',
        `Sessions viewed fell ${fmtPct(Math.abs(pctChange(cur.sessions_viewed,prv.sessions_viewed)),1)} and active users fell ${fmtPct(Math.abs(pctChange(cur.active_users,prv.active_users)),1)}. Conversion improved from ${fmtPct(prv.conversion_rate,1)} to ${fmtPct(cur.conversion_rate,1)}, so the issue was fewer visitors, not poorer checkout conversion.`, '#DC2626')}
      ${driverCard('Store availability','Material contributor',
        `Weekly availability fell ${fmtPct(pOps.availability_rate,1)} → ${fmtPct(cOps.availability_rate,1)}. On the availability trough (${worstDay.date || '—'}), ${fmt(troughLowStores)} stores were below 50%; together those stores moved from ${fmtEur(affectedPrevGmv)} / ${fmt(affectedPrevOrders)} orders to ${fmtEur(affectedGmv)} / ${fmt(affectedOrders)} orders. ${confirmedClosed.length} hidden stores removed ${fmtEur(closedPrevGmv)} and ${fmt(closedPrevOrders)} prior-week orders.`, '#F59E0B')}
      ${driverCard('Courier / catalogue','Not the main cause',
        `Courier acceptance improved ${pp(cOps.courier_acceptance_rate,pOps.courier_acceptance_rate)}, late delivery improved ${pp(cOps.late_delivery_rate,pOps.late_delivery_rate)}, and SKU session availability improved ${pp(cOps.sku_availability_pct,pOps.sku_availability_pct)}. Acceptance only moved ${pp(cOps.acceptance_rate,pOps.acceptance_rate)}.`, '#16A34A')}
      </div></div>`;

    html += table('GMV decline decomposition', ['Driver','Estimated GMV impact','Share of decline','Interpretation'],
      `<tr><td>Order volume</td><td>${fmtEur(volumeImpact)}</td><td>${fmtPct(gmvLoss ? Math.abs(volumeImpact)/gmvLoss*100 : null,0)}</td><td>${fmt(orderLoss)} fewer orders</td></tr>
       <tr><td>Basket size / AOV</td><td>${fmtEur(aovImpact)}</td><td>${fmtPct(gmvLoss ? Math.abs(aovImpact)/gmvLoss*100 : null,0)}</td><td>AOV ${fmtEur(prevAov,2)} → ${fmtEur(curAov,2)}</td></tr>`,
      'Additive decomposition: order-volume effect at prior-week AOV plus AOV effect on current-week orders.');

    html += table('Operational root-cause check', ['Metric','Previous week','Latest week','Change','Conclusion'],
      `<tr><td><strong>Availability</strong></td><td>${fmtPct(pOps.availability_rate,1)}</td><td>${fmtPct(cOps.availability_rate,1)}</td><td class="chg-down">${pp(cOps.availability_rate,pOps.availability_rate)}</td><td>Material negative</td></tr>
       <tr><td>Stores with orders</td><td>${fmt(pOps.stores_with_orders)}</td><td>${fmt(cOps.stores_with_orders)}</td><td>${signed(delta(cOps.stores_with_orders,pOps.stores_with_orders))}</td><td>${confirmedClosed.length} hidden; ${zeroOrdersActive.length} active with zero delivered orders</td></tr>
       <tr><td>Acceptance</td><td>${fmtPct(pOps.acceptance_rate,1)}</td><td>${fmtPct(cOps.acceptance_rate,1)}</td><td>${pp(cOps.acceptance_rate,pOps.acceptance_rate)}</td><td>Small deterioration</td></tr>
       <tr><td>Failed-order rate</td><td>${fmtPct(pFail.failed_rate_total,1)}</td><td>${fmtPct(cFail.failed_rate_total,1)}</td><td>${pp(cFail.failed_rate_total,pFail.failed_rate_total)}</td><td>Rate slightly worse</td></tr>
       <tr><td>Merchant failures</td><td>${fmt(pFail.failed_merchant)}</td><td>${fmt(cFail.failed_merchant)}</td><td>${signed(delta(cFail.failed_merchant,pFail.failed_merchant))}</td><td>${fmtPct(orderLoss ? Number(cFail.failed_merchant||0)/orderLoss*100 : null,1)} of net order decline</td></tr>
       <tr><td>Courier failures</td><td>${fmt(pFail.failed_bolt_courier)}</td><td>${fmt(cFail.failed_bolt_courier)}</td><td>${signed(delta(cFail.failed_bolt_courier,pFail.failed_bolt_courier))}</td><td>Absolute failures decreased</td></tr>
       <tr><td>Courier acceptance</td><td>${fmtPct(pOps.courier_acceptance_rate,1)}</td><td>${fmtPct(cOps.courier_acceptance_rate,1)}</td><td class="chg-up">${pp(cOps.courier_acceptance_rate,pOps.courier_acceptance_rate)}</td><td>Improved</td></tr>
       <tr><td>Late delivery</td><td>${fmtPct(pOps.late_delivery_rate,1)}</td><td>${fmtPct(cOps.late_delivery_rate,1)}</td><td class="chg-up">${pp(cOps.late_delivery_rate,pOps.late_delivery_rate)}</td><td>Improved</td></tr>
       <tr><td>SKU session availability</td><td>${fmtPct(pOps.sku_availability_pct,1)}</td><td>${fmtPct(cOps.sku_availability_pct,1)}</td><td class="chg-up">${pp(cOps.sku_availability_pct,pOps.sku_availability_pct)}</td><td>Not a driver</td></tr>
       <tr><td>Median available SKU</td><td>${fmt(pOps.median_available_sku)}</td><td>${fmt(cOps.median_available_sku)}</td><td>${fmtPct(pctChange(cOps.median_available_sku,pOps.median_available_sku),1)}</td><td>Catalogue breadth decreased</td></tr>`,
      'Availability and 22 merchant failures contributed to the decline. Courier acceptance, late delivery and SKU session availability improved, so they do not explain the −17% GMV.');

    html += table('City impact and sales mix', ['City','GMV previous → latest','Latest GMV share','GMV Δ','Share of decline','Orders previous → latest','Latest order share','Campaign orders Δ','Merchant spend Δ','Availability'],
      cityRows.map(r=>`<tr><td><strong>${r.city}</strong></td><td>${fmtEur(r.prev_gmv)} → ${fmtEur(r.gmv)}</td>
        <td>${fmtPct(cur.gmv_eur ? r.gmv/cur.gmv_eur*100 : null,1)}</td><td class="${r.gmv_delta<0?'chg-down':'chg-up'}">${fmtEur(r.gmv_delta)}</td>
        <td>${r.gmv_delta<0 ? fmtPct(Math.abs(r.gmv_delta)/gmvLoss*100,1) : 'offset'}</td><td>${fmt(r.prev_orders)} → ${fmt(r.orders)}</td>
        <td>${fmtPct(cur.orders ? r.orders/cur.orders*100 : null,1)}</td>
        <td>${signed(r.promo_delta)}</td><td>${fmtEur(r.merchant_delta)}</td><td>${fmtPct(r.prev_avail,1)} → ${fmtPct(r.avail,1)}</td>
        </tr>`).join(''),
      `${topCities.map(r=>r.city).join(', ')} explain ${fmtPct(gmvLoss ? topCityLoss/gmvLoss*100 : null,1)} of the total GMV decline.`);

    html += table('Stores with zero delivered orders for the full week', ['Store','City','Status','Prior-week GMV','Prior-week orders','Share of total decline','Availability evidence','Conclusion'],
      noOrderStores.map(r=>`<tr><td><strong>${r.name.replace(/^VARUS,?\\s*/,'')}</strong></td><td>${r.city}</td>
        <td>${r.status}</td><td>${fmtEur(r.prev_gmv)}</td><td>${fmt(r.prev_orders)}</td>
        <td>${fmtPct(gmvLoss ? r.prev_gmv/gmvLoss*100 : null,1)}</td>
        <td>${r.scheduled ? `${fmtPct(r.avail,1)} · ${fmt(r.scheduled,1)} scheduled h` : 'No current-week schedule'}</td>
        <td>${confirmedClosed.includes(r) ? '<strong>Confirmed hidden / closed</strong>' : 'Active; zero delivered orders, not closed'}</td></tr>`).join(''),
      `Confirmed hidden stores removed ${fmtEur(closedPrevGmv)} and ${fmt(closedPrevOrders)} orders versus the prior week (${fmtPct(gmvLoss ? closedPrevGmv/gmvLoss*100 : null,1)} of the GMV decline). ${zeroOrdersActive.length} active zero-order store(s) are shown separately and are not classified as closed.`);

    html += table(`Stores below 50% availability · exact locations (${fmt(troughLowStores)} on ${worstDay.date || 'trough'}; peak ${fmt(maxLowStores)} on ${maxLowDay.date || '—'})`,
      ['Date','Store','City','Availability','Inactive / scheduled hours','Weekly GMV previous → latest','Weekly orders previous → latest','Share of decline'],
      lowAvailabilityRows.map(r=>{ const s=storeById(r.provider_id); return `<tr><td><strong>${r.date}</strong></td>
        <td>${String(r.provider_name||'').replace(/^VARUS,?\\s*/,'')}</td><td>${r.city_name}</td><td class="chg-down">${fmtPct(r.availability_pct,1)}</td>
        <td>${fmt(r.inactive_hours,1)} / ${fmt(r.scheduled_hours,1)}</td>
        <td>${fmtEur(s.prev_gmv)} → ${fmtEur(s.gmv)}</td><td>${fmt(s.prev_orders)} → ${fmt(s.orders)}</td>
        <td>${s.gmv_delta<0 ? fmtPct(gmvLoss ? Math.abs(s.gmv_delta)/gmvLoss*100 : null,1) : 'offset'}</td></tr>`;}).join(''),
      `On ${worstDay.date || 'the worst day'} the ${fmt(maxLowStores)} stores were located in ${worstCitySummary || '—'}. They generated ${fmtEur(affectedPrevGmv)} previously versus ${fmtEur(affectedGmv)} in the latest week, a ${fmtEur(affectedGmv-affectedPrevGmv)} change. Store-days are shown separately, so a store affected on multiple dates appears more than once.`);

    html += table('All VARUS stores · sales share and decline contribution',
      ['Store','City','Status','GMV previous → latest','Latest GMV share','GMV Δ','Share of decline','Orders previous → latest','Latest order share','Availability','Low-avail. days'],
      storeRows.slice().sort((a,b)=>b.gmv-a.gmv).map(r=>`<tr>
        <td><strong>${r.name.replace(/^VARUS,?\\s*/,'')}</strong></td><td>${r.city}</td><td>${r.status}</td>
        <td>${fmtEur(r.prev_gmv)} → ${fmtEur(r.gmv)}</td><td>${fmtPct(cur.gmv_eur ? r.gmv/cur.gmv_eur*100 : null,1)}</td>
        <td class="${r.gmv_delta<0?'chg-down':'chg-up'}">${fmtEur(r.gmv_delta)}</td>
        <td>${r.gmv_delta<0 ? fmtPct(gmvLoss ? Math.abs(r.gmv_delta)/gmvLoss*100 : null,1) : 'offset'}</td>
        <td>${fmt(r.prev_orders)} → ${fmt(r.orders)}</td><td>${fmtPct(cur.orders ? r.orders/cur.orders*100 : null,1)}</td>
        <td>${fmtPct(r.prev_avail,1)} → ${fmtPct(r.avail,1)}</td><td>${fmt(r.low_days)}</td></tr>`).join(''),
      'Latest GMV/order share shows each point’s contribution to current VARUS sales. Share of decline is shown only for negative contributors; growing stores are marked as offsets.');

    html += table('Daily incident timeline · latest week', ['Date','Orders','GMV','Stores w/ orders','Availability','Stores <50% avail.','Inactive hours','Merchant-funded orders','Merchant spend'],
      curDaily.map(r=>`<tr><td><strong>${r.date}</strong></td><td>${fmt(r.orders)}</td><td>${fmtEur(r.gmv_eur)}</td>
        <td>${fmt(r.stores_with_orders)}</td><td>${fmtPct(r.availability_pct,1)}</td><td>${fmt(r.stores_below_50pct)}</td>
        <td>${fmt(r.inactive_hours,1)}</td><td>${fmt(r.merchant_funded_orders)}</td><td>${fmtEur(r.merchant_spend_eur)}</td></tr>`).join(''),
      'Daily availability can lag for the final day of the week; weekly availability above uses the finalized provider-week metric.');

    html += `<div class="section"><div style="font-size:12px;color:var(--text-secondary);line-height:1.5;">
      Interpretation is evidence-based but not a controlled causal estimate. Promo, traffic, and availability overlap: an unavailable store also loses campaign orders and sessions. The strongest supported conclusion is that the decline was demand-led (merchant promo/traffic), with a material mid-week availability incident; courier performance and SKU session availability do not explain the drop.
    </div></div>`;
    $('content').innerHTML = html;
  }

  function render() {
    destroyCharts();
    if (currentView === 'city' && !currentCity) currentCity = safe(D.city_list)[0] || null;
    buildSidebar();
    buildCityNav();
    const controlsRow = document.querySelector('.controls-row');
    const brandSel = $('brandSelector');
    if (currentView === 'insights' || currentView === 'varus-performance') {
      if (controlsRow) controlsRow.style.display = 'none';
      if (brandSel) brandSel.innerHTML = '';
      $('pageTitle').textContent = displayName(currentView);
      if (currentView === 'insights') renderWeeklyNotes();
      else renderVarusPerformance();
      return;
    }
    if (controlsRow) controlsRow.style.display = '';
    buildControls();
    if (currentView === 'city') { renderCity(); return; }
    if (currentView === 'portfolio') { renderAMPortfolio(); return; }
    $('pageTitle').textContent = displayName(currentView);

    // Future / onboarding key accounts with no data yet -> "Not yet activated" banner
    if (currentView !== 'overview' && !partnerHasData(currentView)) {
      $('content').innerHTML = '<div class="section"><div class="section-title">' + displayName(currentView) + '</div>'
        + '<div style="padding:22px 24px;background:#FFF8E1;border:1px solid #F59E0B;border-radius:10px;color:#92400E;font-weight:600;">Not yet activated — this is a planned key account not yet live on Bolt UA stores. No data to display yet.</div></div>';
      return;
    }

    const src = getDataSource();
    const fin = safe(src.financial);
    const cp = safe(src.cp_margins);
    const ops = safe(src.operational);
    const fail = safe(src.failed_orders);
    const camp = safe(src.campaigns);
    const aa = getAcceptAvail();

    let html = '';

    /* ===== SECTION 1: Financial Overview ===== */
    html += '<div class="section"><div class="section-title">Financial Overview</div>';

    const idx = fin.findIndex(r => r.period === currentPeriod);
    const c = idx >= 0 ? fin[idx] : last(fin);
    const p = idx > 0 ? fin[idx - 1] : (idx === 0 ? null : prev(fin));
    const cpIdx = cp.findIndex(r => r.period === currentPeriod);
    const cpC = cpIdx >= 0 ? cp[cpIdx] : last(cp);
    const cpP = cpIdx > 0 ? cp[cpIdx - 1] : (cpIdx === 0 ? null : prev(cp));

    if (c) {
      const commAov = cpC ? cpC.commission_aov_pct : null;
      const commGmv = cpC ? cpC.commission_gmv_pct : null;
      const pCommAov = cpP ? cpP.commission_aov_pct : null;
      const pCommGmv = cpP ? cpP.commission_gmv_pct : null;

      const campIdx = camp.findIndex(r => r.period === currentPeriod);
      const campC = campIdx >= 0 ? camp[campIdx] : last(camp);
      const campP = campIdx > 0 ? camp[campIdx - 1] : (campIdx === 0 ? null : (camp.length >= 2 ? camp[camp.length - 2] : null));
      const demandPct = cpC && cpC.demand_incentives_gmv_share != null ? cpC.demand_incentives_gmv_share : null;
      const pDemandPct = cpP && cpP.demand_incentives_gmv_share != null ? cpP.demand_incentives_gmv_share : null;

      html += '<div class="kpi-grid">';
      html += kpi('GMV', fmtEur(c.gmv_eur), c, p, 'gmv_eur');
      html += kpi('Orders', fmt(c.orders), c, p, 'orders');
      html += kpi('AOV (w/ Eater Fees)', fmtEur(c.aov_with_delivery, 2), c, p, 'aov_with_delivery');
      html += kpi('AOV (Items Only)', fmtEur(c.aov_items_only, 2), c, p, 'aov_items_only');
      html += kpi('Eater Fees / Order', fmtEur(c.eater_fees_per_order, 2), c, p, 'eater_fees_per_order');
      if (cpC) {
        html += kpi('CP Margin', fmtPct(cpC.cp_margin_pct), cpC, cpP, 'cp_margin_pct');
        html += kpi('CP L2 Margin', fmtPct(cpC.cp_l2_margin_pct), cpC, cpP, 'cp_l2_margin_pct');
      }
      html += kpi('Bolt Plus GMV Share', fmtPct(c.bolt_plus_gmv_share, 1), c, p, 'bolt_plus_gmv_share');
      html += kpi('Commission of AOV, %', fmtPct(commAov, 1), cpC, cpP, 'commission_aov_pct');
      html += kpi('Commission of GMV, %', fmtPct(commGmv, 1), cpC, cpP, 'commission_gmv_pct');
      if (currentView === 'overview') {
        html += kpi('Demand Incentives, % GMV', fmtPct(demandPct, 1), {v: demandPct}, pDemandPct != null ? {v: pDemandPct} : null, 'v', {inverted: true});
      }

      /* Change 2: Refund metrics */
      if (c.supply_refund_gmv_pct != null) {
        html += kpi('Supply Refunds GMV Share, %', fmtPct(c.supply_refund_gmv_pct, 2), c, p, 'supply_refund_gmv_pct', {inverted: true});
      }
      if (c.demand_refund_gmv_pct != null) {
        html += kpi('Demand Refunds % GMV', fmtPct(c.demand_refund_gmv_pct, 2), c, p, 'demand_refund_gmv_pct', {inverted: true});
      }

      html += kpi('Users Activated', fmt(c.users_activated), c, p, 'users_activated');
      html += kpi('Active Users', fmt(c.active_users), c, p, 'active_users');
      if (c.conversion_rate != null) {
        html += kpi('Session Conversion (Viewed → Ordered)', fmtPct(c.conversion_rate, 1), c, p, 'conversion_rate');
      }
      if (c.retention_rate != null) {
        html += kpi('User Retention (Previous → Current Period)', fmtPct(c.retention_rate, 1), c, p, 'retention_rate');
        html += kpi('Retained Users', fmt(c.retained_users), c, p, 'retained_users');
      }
      html += '</div>';

      if (c.conversion_rate != null || c.retention_rate != null) {
        const retentionScope = currentView === 'overview'
          ? 'For Total, a user is retained when they order from any 3P Store again in the next period.'
          : 'For a partner, a user is retained only when they order from the same partner again in the next period.';
        const definitions = `<div style="margin-top:10px;padding:14px 16px;background:var(--card);border:1px solid var(--border);border-radius:8px;font-size:12px;line-height:1.55;color:var(--text-secondary);">
          <div><strong style="color:var(--text-primary);">Users Activated</strong> — users whose first-ever delivered Bolt Delivery order occurred in the selected period. On a partner tab, that first order was placed with this partner.</div>
          <div><strong style="color:var(--text-primary);">Active Users</strong> — unique users with at least one delivered order in the selected week or month.</div>
          <div><strong style="color:var(--text-primary);">Provider-view Sessions</strong> — sessions in which a provider from the selected Total/partner scope was viewed. Total sums provider-level views, so one app session can be counted more than once if several providers were viewed.</div>
          <div><strong style="color:var(--text-primary);">Ordered Sessions</strong> — provider-view sessions that resulted in an order with that provider.</div>
          <div><strong style="color:var(--text-primary);">Session Conversion</strong> = Ordered Sessions ÷ Provider-view Sessions × 100%.</div>
          <div><strong style="color:var(--text-primary);">Retained Users</strong> — users active in both the previous and selected consecutive period. ${retentionScope}</div>
          <div><strong style="color:var(--text-primary);">User Retention</strong> = Retained Users ÷ Active Users in the previous period × 100%.</div>
        </div>`;
        html += collapsible('user metrics definitions', definitions, true);
      }
    }

    // Financial Overview comparison table (WoW/MoM/QoQ), collapsible
    const finCmpTitle = (currentGran === 'quarterly' ? 'QoQ' : currentGran === 'monthly' ? 'MoM' : 'WoW') + ' Comparison';
    html += collapsible(finCmpTitle, buildFinancialComparisonTable(fin, cp, camp));

    // RUN RATE block (monthly/quarterly view, only for the current/latest period)
    if ((currentGran === 'monthly' || currentGran === 'quarterly') && fin.length >= 2 && currentPeriod === fin[fin.length - 1].period) {
      html += buildRunRateBlock(fin, cp, camp);
    }

    // City GMV breakdown (overview only, collapsible)
    if (currentView === 'overview') {
      const cityHtml = buildCityBreakdownSection();
      if (cityHtml) {
        html += '<div style="margin-bottom:16px;"><button class="toggle-btn" style="font-size:12px;padding:6px 14px;border:1px solid var(--border);border-radius:6px;cursor:pointer;background:var(--card);" onclick="var t=this.nextElementSibling;t.style.display=t.style.display===\'none\'?\'block\':\'none\';this.textContent=t.style.display===\'none\'?\'Show GMV by City\':\'Hide GMV by City\'">Show GMV by City</button>';
        html += '<div style="display:none;">' + cityHtml + '</div></div>';
      }
    }

    // Partner city breakdown (brand views with 2+ cities, all granularities)
    if (currentView !== 'overview') {
      const partnerCityAll = safe(D.partner_city_weekly).filter(r => r.group_name === canonicalPartner(currentView));
      const curCities = aggregatePartnerCityData(partnerCityAll, currentPeriod, currentGran);
      if (curCities.length >= 2) {
        const prevPer = getPrevPeriod(currentPeriod, currentGran);
        const prevCities = prevPer ? aggregatePartnerCityData(partnerCityAll, prevPer, currentGran) : [];
        const prevMap = {}; prevCities.forEach(r => { prevMap[r.city] = r; });
        curCities.sort((a, b) => b.gmv_eur - a.gmv_eur);
        const totalGmv = curCities.reduce((a, b) => a + b.gmv_eur, 0);
        let cityHtml = '<div class="sub-section-title">GMV by City — ' + periodLabel(currentPeriod, currentGran) + '</div>';
        cityHtml += '<div class="data-table-wrap"><table class="data-table"><thead><tr><th>City</th><th>Orders</th><th>GMV, €</th><th>% of Total</th></tr></thead><tbody>';
        curCities.forEach(r => {
          const pct = totalGmv ? (r.gmv_eur / totalGmv * 100) : 0;
          const pr = prevMap[r.city];
          cityHtml += `<tr><td>${r.city}</td><td>${fmt(r.orders)} ${pctChangeInline(r.orders, pr ? pr.orders : null)}</td><td>${fmtEur(r.gmv_eur)} ${pctChangeInline(r.gmv_eur, pr ? pr.gmv_eur : null)}</td><td>${fmtPct(pct, 1)}</td></tr>`;
        });
        cityHtml += '</tbody></table></div>';
        html += '<div style="margin-bottom:16px;"><button class="toggle-btn" style="font-size:12px;padding:6px 14px;border:1px solid var(--border);border-radius:6px;cursor:pointer;background:var(--card);" onclick="var t=this.nextElementSibling;t.style.display=t.style.display===\'none\'?\'block\':\'none\';this.textContent=t.style.display===\'none\'?\'Show GMV by City\':\'Hide GMV by City\'">Show GMV by City</button>';
        html += '<div style="display:none;">' + cityHtml + '</div></div>';
      }
    }

    // Bolt+ Dynamics Table
    html += buildBoltPlusDynamicsTable(fin);

    // Eater Fees Dynamics Table
    html += buildEaterFeesDynamicsTable(fin);

    // City Eater Fees (overview only, collapsible)
    if (currentView === 'overview') {
      const cityFeesHtml = buildCityEaterFeesTable();
      if (cityFeesHtml) {
        html += '<div style="margin-bottom:16px;"><button class="toggle-btn" style="font-size:12px;padding:6px 14px;border:1px solid var(--border);border-radius:6px;cursor:pointer;background:var(--card);" onclick="var t=this.nextElementSibling;t.style.display=t.style.display===\'none\'?\'block\':\'none\';this.textContent=t.style.display===\'none\'?\'Show Eater Fees by City\':\'Hide Eater Fees by City\'">Show Eater Fees by City</button>';
        html += '<div style="display:none;">' + cityFeesHtml + '</div></div>';
      }
    }

    // Charts row
    html += '<div class="chart-row">';
    html += '<div class="chart-container"><h3>GMV &amp; Orders Trend</h3><div class="chart-wrap"><canvas id="chartGmvOrders"></canvas></div></div>';
    html += '<div class="chart-container"><h3>Eater Fees per Order</h3><div class="chart-wrap"><canvas id="chartEaterFees"></canvas></div></div>';
    html += '</div>';

    // GMV & Orders Share by Partner doughnuts (overview only) — shared colors + one legend
    if (currentView === 'overview') {
      const gmvPart = safe(src.gmv_by_partner).filter(r => r.period === currentPeriod);
      if (gmvPart.length || safe(D.top_partners_gmv).length) {
        html += '<div class="chart-row"><div class="chart-container full"><h3>Share by Partner — Top 15</h3>'
          + '<div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:28px;">'
          + '<div style="text-align:center;"><div style="font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:8px;">GMV Share</div><div class="chart-wrap" style="height:300px;width:300px;"><canvas id="chartGmvShare"></canvas></div></div>'
          + '<div style="text-align:center;"><div style="font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:8px;">Orders Share</div><div class="chart-wrap" style="height:300px;width:300px;"><canvas id="chartOrdersShare"></canvas></div></div>'
          + '<div id="shareLegend" style="min-width:170px;"></div>'
          + '</div></div></div>';
      }
    }
    html += '</div>';

    /* ===== SECTION 2: Operational Overview ===== */
    html += '<div class="section"><div class="section-title">Operational Overview</div>';

    const opsIdx = ops.findIndex(r => r.period === currentPeriod);
    const oc = opsIdx >= 0 ? ops[opsIdx] : last(ops);
    const op = opsIdx > 0 ? ops[opsIdx - 1] : (opsIdx === 0 ? null : prev(ops));
    const aaLast = last(aa);

    if (oc || aaLast) {
      html += '<div class="kpi-grid">';
      if (oc) {
        const snap = D.active_stores_snapshot || {};
        const activeCount = currentView === 'overview' ? snap.total : (snap[canonicalPartner(currentView)] || null);
        if (activeCount != null) {
          html += `<div class="kpi-card"><div class="kpi-label">ACTIVE STORES</div><div class="kpi-value">${fmt(activeCount)}</div><span class="kpi-change neutral">status: active</span></div>`;
        }
        if (oc.stores_with_orders != null) {
          html += kpi('Stores with Orders', fmt(oc.stores_with_orders), oc, op, 'stores_with_orders');
        }
      }
      if (oc && oc.acceptance_rate != null) {
        html += kpi('Acceptance Rate', fmtPct(oc.acceptance_rate, 1), oc, op, 'acceptance_rate');
        html += kpi('Availability', fmtPct(oc.availability_rate, 1), oc, op, 'availability_rate');
        html += kpi('Avg Rating', fmt(oc.avg_rating, 2), oc, op, 'avg_rating');
      } else if (aaLast) {
        const aaPrev = aa.length >= 2 ? aa[aa.length - 2] : null;
        html += kpi('Acceptance Rate', fmtPct(aaLast.acceptance_rate_30d * 100, 1), {v: aaLast.acceptance_rate_30d*100}, aaPrev ? {v: aaPrev.acceptance_rate_30d*100} : null, 'v');
        html += kpi('Availability', fmtPct(aaLast.availability_rate_30d * 100, 1), {v: aaLast.availability_rate_30d*100}, aaPrev ? {v: aaPrev.availability_rate_30d*100} : null, 'v');
        html += kpi('Avg Rating', fmt(aaLast.avg_rating_30d, 2), {v: aaLast.avg_rating_30d}, aaPrev ? {v: aaPrev.avg_rating_30d} : null, 'v');
      }
      if (oc) {
        html += kpi('Honey Order Rate', fmtPct(oc.honey_order_rate, 1), oc, op, 'honey_order_rate');
        html += kpi('Bad Order Rate', fmtPct(oc.bad_order_rate, 2), oc, op, 'bad_order_rate', {inverted: true});
        html += kpi('Avg Delivery Time', fmt(oc.avg_delivery_minutes, 1) + ' min', oc, op, 'avg_delivery_minutes', {inverted: true});
        if (oc.median_available_sku != null) html += kpi('Median Provider Available SKU, #', fmt(oc.median_available_sku), oc, op, 'median_available_sku');
        if (SHOW_SKU_AVAILABILITY && oc.sku_availability_pct != null) html += kpi('Merchant SKU Sessions Availability Rate, %', fmtPct(oc.sku_availability_pct, 1), oc, op, 'sku_availability_pct');
      }
      html += '</div>';

      /* Courier Metrics sub-block */
      if (oc) {
        const courierCards = [];
        if (oc.courier_minutes_per_order != null) courierCards.push(kpi('Courier Time / Order', fmt(oc.courier_minutes_per_order, 1) + ' min', oc, op, 'courier_minutes_per_order', {inverted: true}));
        if (oc.batching_rate != null) courierCards.push(kpi('Batching Rate', fmtPct(oc.batching_rate, 1), oc, op, 'batching_rate'));
        if (oc.courier_acceptance_rate != null) courierCards.push(kpi('Courier Acceptance Rate', fmtPct(oc.courier_acceptance_rate, 1), oc, op, 'courier_acceptance_rate'));
        if (oc.cpo_eur != null) courierCards.push(kpi('CPO', '€' + fmt(oc.cpo_eur, 2), oc, op, 'cpo_eur', {inverted: true}));
        if (courierCards.length) {
          html += '<div class="sub-section-title">Courier Metrics</div>';
          html += '<div class="kpi-grid">' + courierCards.join('') + '</div>';
        }
      }

      /* Order & Item Adjustments sub-block (brand views only; hidden when all-zero) */
      if (oc && currentView !== 'overview') {
        const defectsArr = safe(((D.item_defects || {})[currentGran] || {})[canonicalPartner(currentView)]);
        const defRow = defectsArr.find(r => r.period === currentPeriod) || last(defectsArr);
        const defRowPIdx = defRow ? defectsArr.indexOf(defRow) : -1;
        const defPrev = defRowPIdx > 0 ? defectsArr[defRowPIdx - 1] : null;
        if (defRow && anyDefect(defectsArr)) {
          const adjCards = [];
          if (defRow.item_quantity_defect_rate != null) adjCards.push(kpi('Item Quantity Adjustment Defect Rate, %', fmtPct(defRow.item_quantity_defect_rate, 2), defRow, defPrev, 'item_quantity_defect_rate', {inverted: true}));
          if (defRow.item_replacement_rate != null) adjCards.push(kpi('Item Replacement Rate, %', fmtPct(defRow.item_replacement_rate, 2), defRow, defPrev, 'item_replacement_rate', {inverted: true}));
          if (defRow.item_weight_defect_rate != null) adjCards.push(kpi('Item Weighted Adjustment Defect Rate, %', fmtPct(defRow.item_weight_defect_rate, 2), defRow, defPrev, 'item_weight_defect_rate', {inverted: true}));
          if (defRow.item_price_defect_rate != null) adjCards.push(kpi('Item Price Adjustment Defect Rate, %', fmtPct(defRow.item_price_defect_rate, 2), defRow, defPrev, 'item_price_defect_rate', {inverted: true}));
          if (adjCards.length) {
            html += '<div class="sub-section-title">Order &amp; Item Adjustments</div>';
            html += '<div class="kpi-grid">' + adjCards.join('') + '</div>';
          }
        }
      }
    }

    // Bad Order Breakdown cards
    html += buildBadOrderBreakdown(ops, fail, opsIdx);

    // WoW Comparison Table
    const cmpTitle = (currentGran === 'quarterly' ? 'QoQ' : currentGran === 'monthly' ? 'MoM' : 'WoW') + ' Comparison';
    html += collapsible(cmpTitle, buildWoWComparisonTable(ops, fail));

    html += '</div>';

    /* ===== SECTION 3: Campaign Analytics ===== */
    html += '<div class="section"><div class="section-title">Campaign Analytics</div>';
    const campIdx2 = camp.findIndex(r => r.period === currentPeriod);
    const cc = campIdx2 >= 0 ? camp[campIdx2] : last(camp);
    const cp2 = campIdx2 > 0 ? camp[campIdx2 - 1] : (campIdx2 === 0 ? null : (camp.length >= 2 ? camp[camp.length - 2] : null));
    html += '<div class="kpi-grid">';
    if (cc) {
      const gmv = cc.gmv_eur || 1;
      html += kpi('Campaigns Discount', fmtEur(cc.campaigns_discount_eur) + ` (${fmtPct(cc.campaigns_discount_eur / gmv * 100, 1)})`, cc, cp2, 'campaigns_discount_eur');
      html += kpi('Bolt Spend', fmtEur(cc.bolt_spend_eur) + ` (${fmtPct(cc.bolt_spend_eur / gmv * 100, 1)})`, cc, cp2, 'bolt_spend_eur');
      html += kpi('Merchant Spend', fmtEur(cc.merchant_spend_eur) + ` (${fmtPct(cc.merchant_spend_eur / gmv * 100, 1)})`, cc, cp2, 'merchant_spend_eur');
    }
    if (currentView !== 'overview') {
      const promoStore = (D.item_discount_promo || {})[currentGran] || (D.item_discount_promo || {});
      const promoData = safe(promoStore[canonicalPartner(currentView)]);
      if (promoData.length) {
        const promoIdx = promoData.findIndex(r => r.period === currentPeriod);
        const promoC = promoIdx >= 0 ? promoData[promoIdx] : last(promoData);
        const promoP = promoIdx > 0 ? promoData[promoIdx - 1] : (promoIdx === 0 ? null : (promoData.length >= 2 ? promoData[promoData.length - 2] : null));
        if (promoC) html += kpi('Item level discount promo share, %', fmtPct(promoC.value, 2), promoC, promoP, 'value');
      }
    }
    html += '</div>';

    // Campaign Dynamics Table
    html += buildCampaignDynamicsTable(camp);

    html += '<div class="chart-row"><div class="chart-container full"><h3>Campaign Spend Trend (% of GMV)</h3><div class="chart-wrap"><canvas id="chartCampaigns"></canvas></div></div></div>';
    html += '</div>';

    $('content').innerHTML = html;

    /* ---- attach city toggle event listeners ---- */
    const cityToggle = document.getElementById('cityBreakdownToggle');
    if (cityToggle) {
      cityToggle.addEventListener('click', () => { showCityBreakdown = !showCityBreakdown; render(); });
    }

    /* ---- draw charts ---- */
    drawGmvOrdersChart(fin);
    drawEaterFeesChart(fin);
    if (currentView === 'overview') drawShareCharts();
    drawCampaignsChart(camp);
  }

  /* ===================== CITY OVERVIEW ===================== */
  function renderCity() {

    $('pageTitle').textContent = 'City overview — ' + (city || '');
    const cityNode = (D.cities || {})[city] || {};
    const src = getDataSource();

      html += kpi('Orders', fmt(c.orders), c, pcw, 'orders');
      html += kpi('AOV (w/ Eater Fees)', fmtEur(c.aov_with_delivery, 2), c, pcw, 'aov_with_delivery');
      html += kpi('AOV (Items Only)', fmtEur(c.aov_items_only, 2), c, pcw, 'aov_items_only');
      html += kpi('Eater Fees / Order', fmtEur(c.eater_fees_per_order, 2), c, pcw, 'eater_fees_per_order');
      if (cpC) { html += kpi('CP Margin', fmtPct(cpC.cp_margin_pct), cpC, cpP, 'cp_margin_pct'); html += kpi('CP L2 Margin', fmtPct(cpC.cp_l2_margin_pct), cpC, cpP, 'cp_l2_margin_pct'); }
      html += kpi('Bolt Plus GMV Share', fmtPct(c.bolt_plus_gmv_share, 1), c, pcw, 'bolt_plus_gmv_share');
