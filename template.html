  /* ---- city per-partner table helpers ---- */
  function _managedPartners() {
    const s = new Set();
    const g = D.employee_groups || {};
    Object.keys(g).forEach(k => safe(g[k]).forEach(p => s.add(p)));
    return s;
  }
  const CITY_TOP_N = 15;
  function _ssum(rows, key) { return rows.reduce((a, b) => a + (b[key] || 0), 0); }
  function _wavg(rows, key, wKey) {
    let num = 0, den = 0;
    rows.forEach(r => { const v = r[key], w = r[wKey] || 0; if (v != null) { num += v * w; den += w; } });
    return den ? num / den : null;
  }
  function _periodUsed(rows) {
    const r = safe(rows);
    if (r.some(x => x.period === currentPeriod)) return currentPeriod;
    const ps = [...new Set(r.map(x => x.period))].sort();
    return ps[ps.length - 1] || null;
  }

  function buildCityFinancialByPartner(cityNode) {
    const gmvAll = safe((cityNode[currentGran] || {}).gmv_by_partner);
    const opsAll = safe((cityNode.partner_ops || {})[currentGran]);
    if (!gmvAll.length) return '';
    const curP = _periodUsed(gmvAll), prevP = curP ? getPrevPeriod(curP, currentGran) : null;
    const gmvPrevBy = {}, cpCurBy = {}, cpPrevBy = {};
    gmvAll.forEach(r => { if (r.period === prevP) gmvPrevBy[r.group_name] = r; });
    opsAll.forEach(r => { if (r.period === curP) cpCurBy[r.group_name] = r; else if (r.period === prevP) cpPrevBy[r.group_name] = r; });
    const gmvCur = gmvAll.filter(r => r.period === curP).sort((a, b) => (b.gmv_eur || 0) - (a.gmv_eur || 0));
    const topList = gmvCur.slice(0, CITY_TOP_N).map(r => r.group_name);
    const topSet = new Set(topList);
    const othCur = gmvCur.filter(r => !topSet.has(r.group_name));
    const othPrev = gmvAll.filter(r => r.period === prevP && !topSet.has(r.group_name));
    const othOpsCur = opsAll.filter(r => r.period === curP && !topSet.has(r.group_name));
    const othOpsPrev = opsAll.filter(r => r.period === prevP && !topSet.has(r.group_name));
    const gmvCurBy = {}; gmvCur.forEach(r => gmvCurBy[r.group_name] = r);

    let html = '<div class="sub-section-title">Financial Overview by Partner</div>';
    html += '<div class="data-table-wrap"><table class="data-table"><thead><tr><th>Partner</th><th>GMV, €</th><th>Orders</th><th>AOV (Items Only)</th><th>Eater Fees / Order</th><th>CP Margin, %</th><th>CP L2 Margin, %</th></tr></thead><tbody>';
    const rowHtml = (name, cur, prev, curOps, prevOps) => {
      const g = cur ? cur.gmv_eur : null, gp = prev ? prev.gmv_eur : null;
      const o = cur ? cur.orders : null, op = prev ? prev.orders : null;
      const ai = cur ? cur.aov_items_only : null, aip = prev ? prev.aov_items_only : null;
      const ef = cur ? cur.eater_fees_per_order : null, efp = prev ? prev.eater_fees_per_order : null;
      const cpm = curOps ? curOps.cp_margin_pct : null, cpmp = prevOps ? prevOps.cp_margin_pct : null;
      const cpl = curOps ? curOps.cp_l2_margin_pct : null, cplp = prevOps ? prevOps.cp_l2_margin_pct : null;
      return `<tr><td>${displayName(name)}</td>`
        + `<td>${fmtEur(g)} ${pctChangeInline(g, gp)}</td>`
        + `<td>${fmt(o)} ${pctChangeInline(o, op)}</td>`
        + `<td>${fmtEur(ai, 2)} ${pctChangeInline(ai, aip)}</td>`
        + `<td>${fmtEur(ef, 2)} ${pctChangeInline(ef, efp)}</td>`
        + `<td>${cpm != null ? fmtPct(cpm) : '—'} ${pctChangeInline(cpm, cpmp)}</td>`
        + `<td>${cpl != null ? fmtPct(cpl) : '—'} ${pctChangeInline(cpl, cplp)}</td></tr>`;
    };
    topList.forEach(p => html += rowHtml(p, gmvCurBy[p] || null, gmvPrevBy[p] || null, cpCurBy[p] || null, cpPrevBy[p] || null));
    if (othCur.length) {
      const oc = { gmv_eur: _ssum(othCur, 'gmv_eur'), orders: _ssum(othCur, 'orders'), aov_items_only: _wavg(othCur, 'aov_items_only', 'orders'), eater_fees_per_order: _wavg(othCur, 'eater_fees_per_order', 'orders') };
      const opv = othPrev.length ? { gmv_eur: _ssum(othPrev, 'gmv_eur'), orders: _ssum(othPrev, 'orders'), aov_items_only: _wavg(othPrev, 'aov_items_only', 'orders'), eater_fees_per_order: _wavg(othPrev, 'eater_fees_per_order', 'orders') } : null;
      const ocOps = { cp_margin_pct: _wavg(othOpsCur, 'cp_margin_pct', 'orders'), cp_l2_margin_pct: _wavg(othOpsCur, 'cp_l2_margin_pct', 'orders') };
      const opvOps = othOpsPrev.length ? { cp_margin_pct: _wavg(othOpsPrev, 'cp_margin_pct', 'orders'), cp_l2_margin_pct: _wavg(othOpsPrev, 'cp_l2_margin_pct', 'orders') } : null;
      html += rowHtml('Others', oc, opv, ocOps, opvOps);
    }
    html += '</tbody></table></div>';
    return html;
  }

  function buildCityPartnerOpsTable(cityNode) {
    const all = safe((cityNode.partner_ops || {})[currentGran]);
    if (!all.length) return '';
    const curP = _periodUsed(all), prevP = curP ? getPrevPeriod(curP, currentGran) : null;
    const prevBy = {};
    all.forEach(r => { if (r.period === prevP) prevBy[r.group_name] = r; });
    const cur = all.filter(r => r.period === curP).sort((a, b) => (b.orders || 0) - (a.orders || 0));
    const topList = cur.slice(0, CITY_TOP_N).map(r => r.group_name);
    const topSet = new Set(topList);
    const curBy = {}; cur.forEach(r => curBy[r.group_name] = r);
    const othCur = cur.filter(r => !topSet.has(r.group_name));
    const othPrev = all.filter(r => r.period === prevP && !topSet.has(r.group_name));
    const OPS_F = ['acceptance_rate', 'availability_rate', 'avg_rating', 'honey_order_rate', 'bad_order_rate', 'avg_delivery_minutes', 'cpo_eur', 'failed_rate_total', 'failed_merchant_pct', 'failed_bolt_courier_pct', 'late_delivery_rate', 'late_pickup_rate'];
    const INV = new Set(['bad_order_rate', 'avg_delivery_minutes', 'cpo_eur', 'failed_rate_total', 'failed_merchant_pct', 'failed_bolt_courier_pct', 'late_delivery_rate', 'late_pickup_rate']);
    const aggRow = (rows) => { const o = { orders: _ssum(rows, 'orders') }; OPS_F.forEach(f => o[f] = _wavg(rows, f, 'orders')); return o; };

    let html = '<div class="sub-section-title">Operational by Partner</div>';
    html += '<div class="data-table-wrap"><table class="data-table"><thead><tr><th>Partner</th><th>Acceptance</th><th>Availability</th><th>Avg Rating</th><th>Honey</th><th>Bad</th><th>Avg Delivery</th><th>CPO</th><th>Failed Total</th><th>Failed Merch.</th><th>Failed Bolt+Cour.</th><th>Late Delivery</th><th>Late Pickup</th></tr></thead><tbody>';
    const cellPct = (v, pv, f, dec) => `${v != null ? fmtPct(v, dec) : '—'} ${pctChangeInline(v, pv, INV.has(f))}`;
    const rowHtml = (name, r, pr) => {
      r = r || {}; pr = pr || {};
      return `<tr><td>${displayName(name)}</td>`

        + `<td>${cellPct(r.availability_rate, pr.availability_rate, 'availability_rate', 1)}</td>`
        + `<td>${r.avg_rating != null ? fmt(r.avg_rating, 2) : '—'} ${pctChangeInline(r.avg_rating, pr.avg_rating)}</td>`
        + `<td>${cellPct(r.honey_order_rate, pr.honey_order_rate, 'honey_order_rate', 1)}</td>`
        + `<td>${cellPct(r.bad_order_rate, pr.bad_order_rate, 'bad_order_rate', 2)}</td>`
        + `<td>${r.avg_delivery_minutes != null ? fmt(r.avg_delivery_minutes, 1) + ' min' : '—'} ${pctChangeInline(r.avg_delivery_minutes, pr.avg_delivery_minutes, true)}</td>`
        + `<td>${r.cpo_eur != null ? '€' + fmt(r.cpo_eur, 2) : '—'} ${pctChangeInline(r.cpo_eur, pr.cpo_eur, true)}</td>`
        + `<td>${cellPct(r.failed_rate_total, pr.failed_rate_total, 'failed_rate_total', 1)}</td>`
        + `<td>${cellPct(r.failed_merchant_pct, pr.failed_merchant_pct, 'failed_merchant_pct', 1)}</td>`
        + `<td>${cellPct(r.failed_bolt_courier_pct, pr.failed_bolt_courier_pct, 'failed_bolt_courier_pct', 1)}</td>`
        + `<td>${cellPct(r.late_delivery_rate, pr.late_delivery_rate, 'late_delivery_rate', 1)}</td>`
        + `<td>${cellPct(r.late_pickup_rate, pr.late_pickup_rate, 'late_pickup_rate', 1)}</td></tr>`;
    };
    topList.forEach(p => html += rowHtml(p, curBy[p] || null, prevBy[p] || null));
    if (othCur.length) html += rowHtml('Others', aggRow(othCur), othPrev.length ? aggRow(othPrev) : {});
    html += '</tbody></table></div>';
    return html;
  }

      html += rowHtml('Others', oc, opv);

    html += '</tbody></table></div>';

  /* ---- City-level Eater Fees Table with deltas ---- */
  function buildCityEaterFeesTable() {
    const allWeekly = safe(D.city_eater_fees_weekly);
    if (!allWeekly.length) return '';
    const cityFeeData = aggregateCityFeeData(allWeekly, currentPeriod, currentGran);
    if (!cityFeeData.length) return '';

    const prevPeriod = getPrevPeriod(currentPeriod, currentGran);
    const prevFeeData = prevPeriod ? aggregateCityFeeData(allWeekly, prevPeriod, currentGran) : [];
    const prevMap = {};
    prevFeeData.forEach(r => { prevMap[r.city] = r; });

    cityFeeData.sort((a, b) => (b.orders || 0) - (a.orders || 0));
    let html = '<div class="sub-section-title">Eater Fees Dynamics by City — ' + periodLabel(currentPeriod, currentGran) + '</div>';
    html += '<div class="data-table-wrap"><table class="data-table"><thead><tr><th>City</th><th>Eater Fees / Order</th><th>Delivery Fee</th><th>Service Fee</th><th>Small Order Fee</th></tr></thead><tbody>';
    cityFeeData.forEach(r => {
      const pr = prevMap[r.city];
      html += `<tr><td>${r.city}</td><td>${fmtEur(r.eater_fees_per_order, 2)} ${pctChangeInline(r.eater_fees_per_order, pr ? pr.eater_fees_per_order : null)}</td><td>${fmtEur(r.delivery_fee_per_order, 2)} ${pctChangeInline(r.delivery_fee_per_order, pr ? pr.delivery_fee_per_order : null)}</td><td>${fmtEur(r.service_fee_per_order, 2)} ${pctChangeInline(r.service_fee_per_order, pr ? pr.service_fee_per_order : null)}</td><td>${fmtEur(r.small_order_fee_per_order, 2)} ${pctChangeInline(r.small_order_fee_per_order, pr ? pr.small_order_fee_per_order : null)}</td></tr>`;
    });
    html += '</tbody></table></div>';
    return html;
  }

  function aggregateCityFeeData(weeklyData, targetPeriod, targetGran) {
    if (targetGran === 'weekly') {
      return safe(weeklyData).filter(r => r.period === targetPeriod).map(r => ({...r, city: r.city_name || r.city || 'Unknown'}));
    }
    const parts = targetPeriod.replace(' 00:00:00','').split('-');
    const yr = parseInt(parts[0]), mo = parseInt(parts[1]) - 1;
    let startDate, endDate;
    if (targetGran === 'monthly') { startDate = new Date(yr, mo, 1); endDate = new Date(yr, mo + 1, 0); }
    else { const qs = Math.floor(mo / 3) * 3; startDate = new Date(yr, qs, 1); endDate = new Date(yr, qs + 3, 0); }
    const m = {};
    safe(weeklyData).forEach(r => {
      const rDate = new Date(r.period.replace(' 00:00:00',''));
      const cn = r.city_name || r.city || 'Unknown';
      if (rDate >= startDate && rDate <= endDate) {
        if (!m[cn]) m[cn] = {city: cn, orders: 0, total_eater: 0, total_del: 0, total_sof: 0, total_svc: 0};
        const ord = r.orders || 0;
        m[cn].orders += ord;
        m[cn].total_eater += (r.eater_fees_per_order || 0) * ord;
        m[cn].total_del += (r.delivery_fee_per_order || 0) * ord;
        m[cn].total_sof += (r.small_order_fee_per_order || 0) * ord;
        m[cn].total_svc += (r.service_fee_per_order || 0) * ord;
      }
    });
    return Object.values(m).map(c => ({
      city: c.city, orders: c.orders,
      eater_fees_per_order: c.orders ? c.total_eater / c.orders : 0,
      delivery_fee_per_order: c.orders ? c.total_del / c.orders : 0,
      small_order_fee_per_order: c.orders ? c.total_sof / c.orders : 0,
      service_fee_per_order: c.orders ? c.total_svc / c.orders : 0
    }));
  }

  /* ---- City Breakdown Section with deltas ---- */
  function buildCityBreakdownSection() {
    const rawWeekly = safe(D.city_breakdown_weekly);
    if (!rawWeekly.length) return '';

    let cityData = aggregateCityData(rawWeekly, currentPeriod, currentGran);
    if (!cityData.length) return '';

    const prevPeriod = getPrevPeriod(currentPeriod, currentGran);
    let prevCityData = prevPeriod ? aggregateCityData(rawWeekly, prevPeriod, currentGran) : [];
    const prevMap = {};
    prevCityData.forEach(r => { prevMap[r.city] = r; });

    cityData.sort((a, b) => (b.gmv_eur || 0) - (a.gmv_eur || 0));
    const totalGmv = cityData.reduce((a, b) => a + (b.gmv_eur || 0), 0);
    const top = cityData.slice(0, 10);
    const others = cityData.slice(10);

    let html = '<div class="sub-section-title">GMV by City — ' + periodLabel(currentPeriod, currentGran) + '</div>';
    html += '<div class="data-table-wrap"><table class="data-table"><thead><tr><th>City</th><th>Orders</th><th>GMV, €</th><th>% of Total</th></tr></thead><tbody>';
    top.forEach(r => {
      const pct = totalGmv ? (r.gmv_eur / totalGmv * 100) : 0;
      const pr = prevMap[r.city];
      const ordChg = pctChangeInline(r.orders, pr ? pr.orders : null);
      const gmvChg = pctChangeInline(r.gmv_eur, pr ? pr.gmv_eur : null);
      html += `<tr><td>${r.city}</td><td>${fmt(r.orders)} ${ordChg}</td><td>${fmtEur(r.gmv_eur)} ${gmvChg}</td><td>${fmtPct(pct, 1)}</td></tr>`;
    });
    if (others.length) {
      const oOrd = others.reduce((a, b) => a + (b.orders || 0), 0);
      const oGmv = others.reduce((a, b) => a + (b.gmv_eur || 0), 0);
      html += `<tr style="font-weight:600;"><td>Others (${others.length})</td><td>${fmt(oOrd)}</td><td>${fmtEur(oGmv)}</td><td>${fmtPct(totalGmv ? oGmv/totalGmv*100 : 0, 1)}</td></tr>`;
    }
    html += '</tbody></table></div>';
    return html;
  }

  function getPrevPeriod(period, gran) {
    const parts = period.replace(' 00:00:00','').split('-');
    const yr = parseInt(parts[0]), mo = parseInt(parts[1]) - 1, day = parseInt(parts[2]);
    let d;
    if (gran === 'weekly') d = new Date(yr, mo, day - 7);
    else if (gran === 'monthly') d = new Date(yr, mo - 1, 1);
    else d = new Date(yr, mo - 3, 1);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} 00:00:00`;
  }

  /* ---- Run Rate Block ---- */
  function buildRunRateBlock(fin, cp, camp) {
    const latest = fin[fin.length - 1];
    if (!latest) return '';
    const parts = latest.period.replace(' 00:00:00','').split('-');
    const year = parseInt(parts[0]), month = parseInt(parts[1]) - 1;
    const today = new Date();

    let daysInPeriod, dataEndDay, periodLabel;

    if (currentGran === 'quarterly') {
      const qStart = new Date(year, month, 1);
      const qEnd = new Date(year, month + 3, 0);
      daysInPeriod = Math.round((qEnd - qStart) / 86400000) + 1;
      const elapsed = Math.round((today - qStart) / 86400000) - 1;
      dataEndDay = Math.min(elapsed, daysInPeriod);
      const q = Math.ceil((month + 1) / 3);
      periodLabel = `Q${q} ${year}`;
    } else {
      daysInPeriod = new Date(year, month + 1, 0).getDate();
      dataEndDay = (today.getFullYear() === year && today.getMonth() === month) ? today.getDate() - 1 : daysInPeriod;
      periodLabel = MONTHS_FULL[month];
    }

    if (dataEndDay <= 0 || dataEndDay >= daysInPeriod) return '';

    const multiplier = daysInPeriod / dataEndDay;
    const monthName = currentGran === 'quarterly' ? periodLabel : MONTHS_FULL[month];
    const prevMonth = fin.length >= 2 ? fin[fin.length - 2] : null;

    const rr = {
      gmv: latest.gmv_eur * multiplier,
      orders: latest.orders * multiplier,
      aov_del: latest.aov_with_delivery,
      aov_items: latest.aov_items_only,
      eater_fees: latest.eater_fees_per_order,
      bolt_plus: latest.bolt_plus_gmv_share,
      users_activated: latest.users_activated * multiplier,
      active_users: latest.active_users * multiplier,
    };

    const campLast = safe(camp).find(r => r.period === latest.period);
    const campPrev = prevMonth ? safe(camp).find(r => r.period === prevMonth.period) : null;
    const rrCampTotal = campLast ? campLast.campaigns_discount_eur * multiplier : null;
    const rrCampBolt = campLast ? campLast.bolt_spend_eur * multiplier : null;
    const rrCampMerch = campLast ? campLast.merchant_spend_eur * multiplier : null;
    const rrCampPctGmv = (rrCampTotal && rr.gmv) ? (rrCampTotal / rr.gmv * 100) : null;
    const rrDemandPct = rrCampPctGmv;
    const commAov = rr.aov_del ? (rr.eater_fees / rr.aov_del * 100) : null;
    const commGmv = rr.gmv ? (rr.eater_fees * rr.orders / rr.gmv * 100) : null;

    let html = '<div class="run-rate-block">';
    html += '<div class="run-rate-header">';
    html += `<span class="run-rate-badge">${monthName.toUpperCase()} RUN RATE</span>`;
    const projTarget = currentGran === 'quarterly' ? `end of ${periodLabel}` : `${MONTHS_FULL[month]} ${daysInPeriod}`;
    html += `<span class="run-rate-info">${dataEndDay} days of data · ×${multiplier.toFixed(2)} projection to ${projTarget}</span>`;
    html += '</div>';
    html += '<div class="run-rate-grid">';

    const prevLabel = currentGran === 'quarterly' ? 'Q' + (Math.ceil((month+1)/3) - 1 || 4) : MONTHS_SHORT[month > 0 ? month - 1 : 11];
    function rrCard(label, displayVal, curRaw, prevRaw) {
      const chg = (curRaw != null && prevRaw != null) ? changeHtml(curRaw, prevRaw) : '';
      const hasChg = curRaw != null && prevRaw != null && pctChange(curRaw, prevRaw) != null;
      const chgStr = hasChg ? `<div class="rr-chg">${chg}</div>` : '';
      const prevStr = prevRaw != null ? `<div class="rr-prev">${prevLabel}: ${typeof prevRaw === 'number' && prevRaw > 100 ? fmtEur(prevRaw) : (typeof prevRaw === 'number' ? prevRaw.toFixed(1) : prevRaw)}</div>` : '';
      return `<div class="rr-card"><div class="rr-label">${label}</div><div class="rr-value">${displayVal}</div>${chgStr}${prevStr}</div>`;
    }

    html += rrCard('GMV', fmtEur(rr.gmv), rr.gmv, prevMonth ? prevMonth.gmv_eur : null);
    html += rrCard('Orders', fmt(Math.round(rr.orders)), rr.orders, prevMonth ? prevMonth.orders : null);
    html += rrCard('AOV (w/ Eater Fees)', fmtEur(rr.aov_del, 2), rr.aov_del, prevMonth ? prevMonth.aov_with_delivery : null);
    html += rrCard('AOV (Items Only)', fmtEur(rr.aov_items, 2), rr.aov_items, prevMonth ? prevMonth.aov_items_only : null);
    html += rrCard('Eater Fees / Order', fmtEur(rr.eater_fees, 2), rr.eater_fees, prevMonth ? prevMonth.eater_fees_per_order : null);
    html += rrCard('Bolt Plus GMV Share', fmtPct(rr.bolt_plus, 1), rr.bolt_plus, prevMonth ? prevMonth.bolt_plus_gmv_share : null);
    if (rrCampTotal != null) html += rrCard('Campaigns Total', fmtEur(rrCampTotal), rrCampTotal, campPrev ? campPrev.campaigns_discount_eur : null);
    if (rrCampBolt != null) html += rrCard('Campaigns Bolt', fmtEur(rrCampBolt), rrCampBolt, campPrev ? campPrev.bolt_spend_eur : null);
    if (rrCampMerch != null) html += rrCard('Campaigns Merchant', fmtEur(rrCampMerch), rrCampMerch, campPrev ? campPrev.merchant_spend_eur : null);
    if (rrCampPctGmv != null) html += rrCard('Campaigns % GMV', fmtPct(rrCampPctGmv, 1), rrCampPctGmv, campPrev && campPrev.gmv_eur ? (campPrev.campaigns_discount_eur / campPrev.gmv_eur * 100) : null);
    if (commAov != null) html += rrCard('Commission of AOV, %', fmtPct(commAov, 1), commAov, prevMonth && prevMonth.aov_with_delivery ? (prevMonth.eater_fees_per_order / prevMonth.aov_with_delivery * 100) : null);
    if (commGmv != null) html += rrCard('Commission of GMV, %', fmtPct(commGmv, 1), commGmv, prevMonth && prevMonth.gmv_eur ? (prevMonth.eater_fees_per_order * prevMonth.orders / prevMonth.gmv_eur * 100) : null);
    html += rrCard('Users Activated', fmt(Math.round(rr.users_activated)), rr.users_activated, prevMonth ? prevMonth.users_activated : null);

    html += '</div></div>';
    return html;
  }

  /* ---- Failed Order Breakdown ---- */
  function buildBadOrderBreakdown(ops, fail, opsIdx) {
    const oc = opsIdx >= 0 ? ops[opsIdx] : last(ops);
    const op = opsIdx > 0 ? ops[opsIdx - 1] : (opsIdx === 0 ? null : prev(ops));

    const failIdx = fail.findIndex(r => r.period === currentPeriod);
    const fc = failIdx >= 0 ? fail[failIdx] : last(fail);
    const fp = failIdx > 0 ? fail[failIdx - 1] : (failIdx === 0 ? null : prev(fail));

    if (!oc && !fc) return '';

    let html = '<div class="sub-section-title">Failed Order Breakdown</div>';
    html += '<div class="kpi-grid">';
    if (fc) {
      html += kpi('Failed Rate Total', fmtPct(fc.failed_rate_total, 1), fc, fp, 'failed_rate_total', {inverted: true});
      const fmPct = fc.total_placed ? (fc.failed_merchant / fc.total_placed * 100) : 0;
      const fpMPct = fp && fp.total_placed ? (fp.failed_merchant / fp.total_placed * 100) : null;
      html += kpi('Failed (Merchant)', fmtPct(fmPct, 1), {v: fmPct}, fpMPct != null ? {v: fpMPct} : null, 'v', {inverted: true});
      const fbPct = fc.total_placed ? (fc.failed_bolt_courier / fc.total_placed * 100) : 0;
      const fpBPct = fp && fp.total_placed ? (fp.failed_bolt_courier / fp.total_placed * 100) : null;
      html += kpi('Failed (Bolt+Courier)', fmtPct(fbPct, 1), {v: fbPct}, fpBPct != null ? {v: fpBPct} : null, 'v', {inverted: true});
    }
    if (oc) {
      html += kpi('Late Delivery', fmtPct(oc.late_delivery_rate, 1), oc, op, 'late_delivery_rate', {inverted: true});
      html += kpi('Late Pickup', fmtPct(oc.late_pickup_rate, 1), oc, op, 'late_pickup_rate', {inverted: true});
    }
    html += '</div>';
    return html;
  }

  /* ---- Operational Comparison Table (grouped into labeled blocks) ---- */
  function buildWoWComparisonTable(ops, fail) {
    const last10 = ops.slice(-10);
    if (last10.length < 2) return '';

    const cols = last10.length + 1;
    let html = '<div class="data-table-wrap"><table class="data-table"><thead><tr><th></th>';
    last10.forEach(r => { html += `<th>${periodLabel(r.period, currentGran)}</th>`; });
    html += '</tr></thead><tbody>';

    function groupHeader(label, cls) {
      return `<tr class="section-row ${cls}"><td colspan="${cols}">${label}</td></tr>`;
    }
    function rowFmt(label, getter, formatter, inverted=false) {
      let tr = `<tr><td>${label}</td>`;
      last10.forEach((r, i) => {
        const val = getter(r);
        const pv = i > 0 ? getter(last10[i-1]) : null;
        tr += `<td>${formatter(val)} ${pctChangeInline(val, pv, inverted)}</td>`;
      });
      return tr + '</tr>';
    }

    /* ===== Block 1: Overview ===== */
    html += groupHeader('Overview', 'grp-overview');
    html += rowFmt('Stores with Orders', r => r.stores_with_orders || r.active_stores, v => fmt(v));
    html += rowFmt('Acceptance Rate, %', r => r.acceptance_rate, v => fmtPct(v, 1));
    html += rowFmt('Availability, %', r => r.availability_rate, v => fmtPct(v, 1));
    if (currentView === 'overview') {
      html += rowFmt('Merchant Availability — ENT, %', r => r.availability_ent_pct, v => fmtPct(v, 1));
      html += rowFmt('Merchant Availability — SMB, %', r => r.availability_smb_pct, v => fmtPct(v, 1));
      html += rowFmt('Merchant Availability — MM, %', r => r.availability_mm_pct, v => fmtPct(v, 1));
    }
    html += rowFmt('Avg Rating', r => r.avg_rating, v => fmt(v, 2));
    html += rowFmt('Honey %', r => r.honey_order_rate, v => fmtPct(v, 1));
    html += rowFmt('Bad %', r => r.bad_order_rate, v => fmtPct(v, 1), true);
    html += rowFmt('Late Delivery Rate, %', r => r.late_delivery_rate, v => fmtPct(v, 1), true);
    html += rowFmt('Late Pickup Rate, %', r => r.late_pickup_rate, v => fmtPct(v, 1), true);
    html += rowFmt('Avg Delivery, min', r => r.avg_delivery_minutes, v => fmt(v, 1), true);
    if (last10.some(r => r.median_available_sku != null))
      html += rowFmt('Median Provider Available SKU, #', r => r.median_available_sku, v => v != null ? fmt(v) : '—');
    if (SHOW_SKU_AVAILABILITY && last10.some(r => r.sku_availability_pct != null))
      html += rowFmt('Merchant SKU Sessions Availability Rate, %', r => r.sku_availability_pct, v => v != null ? fmtPct(v, 1) : '—');

    /* ===== Block 2: Courier Metrics ===== */
    html += groupHeader('Courier Metrics', 'grp-courier');
    html += rowFmt('Courier Time / Order, min', r => r.courier_minutes_per_order, v => fmt(v, 1), true);
    html += rowFmt('Batching Rate, %', r => r.batching_rate, v => fmtPct(v, 1));
    html += rowFmt('Courier Acceptance Rate, %', r => r.courier_acceptance_rate, v => fmtPct(v, 1));
    html += rowFmt('CPO, €', r => r.cpo_eur, v => '€' + fmt(v, 2), true);

    /* ===== Block 3: Failed Order Breakdown (aligned to header periods) ===== */
    const failByPeriod = {};
    safe(fail).forEach(r => { if (r && r.period != null) failByPeriod[r.period] = r; });
    function failRow(label, getter) {
      let tr = `<tr><td>${label}</td>`;
      last10.forEach((r, i) => {
        const fr = failByPeriod[r.period];
        const pfr = i > 0 ? failByPeriod[last10[i-1].period] : null;
        const val = fr ? getter(fr) : null;
        const pv = pfr ? getter(pfr) : null;
        tr += `<td>${val != null ? fmtPct(val, 1) : '—'} ${pctChangeInline(val, pv, true)}</td>`;
      });
      return tr + '</tr>';
    }
    if (Object.keys(failByPeriod).length) {
      html += groupHeader('Failed Order Breakdown', 'grp-failed');
      html += failRow('Failed Merchant, %', r => r.total_placed ? (r.failed_merchant / r.total_placed * 100) : 0);
      html += failRow('Failed Bolt+Courier, %', r => r.total_placed ? (r.failed_bolt_courier / r.total_placed * 100) : 0);
      html += failRow('Failed Rate Total, %', r => r.failed_rate_total);
    }

    /* ===== Block 4: Order & Item Adjustments (brand views only) ===== */
    if (currentView !== 'overview') {
      const defectsAll = safe(((D.item_defects || {})[currentGran] || {})[canonicalPartner(currentView)]);
      if (anyDefect(defectsAll)) {
        function defectRow(label, field) {
          let tr = `<tr><td>${label}</td>`;
          last10.forEach(r => {
            const d = defectsAll.find(x => x.period === r.period);
            const val = d ? d[field] : null;
            const dIdx = d ? defectsAll.indexOf(d) : -1;
            const dPrev = dIdx > 0 ? defectsAll[dIdx - 1] : null;
            const pv = dPrev ? dPrev[field] : null;
            tr += `<td>${val != null ? fmtPct(val, 2) : '—'} ${pctChangeInline(val, pv, true)}</td>`;
          });
          return tr + '</tr>';
        }
        html += groupHeader('Order & Item Adjustments', 'grp-adjust');
        html += defectRow('Item Quantity Adjustment Defect Rate, %', 'item_quantity_defect_rate');
        html += defectRow('Item Replacement Rate, %', 'item_replacement_rate');
        html += defectRow('Item Weighted Adjustment Defect Rate, %', 'item_weight_defect_rate');
        html += defectRow('Item Price Adjustment Defect Rate, %', 'item_price_defect_rate');
      }
    }

    html += '</tbody></table></div>';
    return html;
  }

  /* ---- Financial Overview Comparison Table (WoW/MoM/QoQ) ---- */
  function buildFinancialComparisonTable(fin, cp, camp) {
    const last10 = safe(fin).slice(-10);
    if (last10.length < 2) return '';
    const cpBy = {}; safe(cp).forEach(r => { cpBy[r.period] = r; });

    let html = '<div class="data-table-wrap"><table class="data-table"><thead><tr><th></th>';
    rows.forEach(r => { html += `<th>${periodLabel(r.f.period, currentGran)}</th>`; });
    html += '</tr></thead><tbody>';

    function row(label, getter, formatter, inverted=false) {
      let tr = `<tr><td>${label}</td>`;

        const val = getter(r);
        const pv = i > 0 ? getter(rows[i-1]) : null;
        tr += `<td>${val != null ? formatter(val) : '—'} ${pctChangeInline(val, pv, inverted)}</td>`;
      });
      return tr + '</tr>';
    }

    html += row('GMV, €', r => r.f.gmv_eur, v => fmtEur(v));

    html += row('Eater Fees / Order, €', r => r.f.eater_fees_per_order, v => fmtEur(v, 2));
    html += row('CP Margin, %', r => r.cp.cp_margin_pct, v => fmtPct(v));
    html += row('CP L2 Margin, %', r => r.cp.cp_l2_margin_pct, v => fmtPct(v));
    html += row('Bolt Plus GMV Share, %', r => r.f.bolt_plus_gmv_share, v => fmtPct(v, 1));
    html += row('Commission of AOV, %', r => r.cp.commission_aov_pct, v => fmtPct(v, 1));
    html += row('Commission of GMV, %', r => r.cp.commission_gmv_pct, v => fmtPct(v, 1));
    if (currentView === 'overview')
      html += row('Demand Incentives, % GMV', r => r.cp.demand_incentives_gmv_share, v => fmtPct(v, 1), true);
    if (rows.some(r => r.f.supply_refund_gmv_pct != null))
      html += row('Supply Refunds GMV Share, %', r => r.f.supply_refund_gmv_pct, v => fmtPct(v, 2), true);
    if (rows.some(r => r.f.demand_refund_gmv_pct != null))
      html += row('Demand Refunds % GMV', r => r.f.demand_refund_gmv_pct, v => fmtPct(v, 2), true);
    html += row('Users Activated', r => r.f.users_activated, v => fmt(v));
    html += row('Active Users', r => r.f.active_users, v => fmt(v));
    if (rows.some(r => r.f.sessions_viewed != null))
      html += row('Provider-view Sessions', r => r.f.sessions_viewed, v => fmt(v));
    if (rows.some(r => r.f.sessions_ordered != null))
      html += row('Ordered Sessions', r => r.f.sessions_ordered, v => fmt(v));
    if (rows.some(r => r.f.conversion_rate != null))
      html += row('Session Conversion (Viewed → Ordered), %', r => r.f.conversion_rate, v => fmtPct(v, 1));
    if (rows.some(r => r.f.retained_users != null))
      html += row('Retained Users', r => r.f.retained_users, v => fmt(v));
    if (rows.some(r => r.f.retention_rate != null))
      html += row('User Retention (Previous → Current Period), %', r => r.f.retention_rate, v => fmtPct(v, 1));

    html += '</tbody></table></div>';
    return html;
  }

  /* ---- Campaign Dynamics Table ---- */
  function buildCampaignDynamicsTable(camp) {
    const last10 = camp.slice(-10);
    if (last10.length < 2) return '';

    let html = '<div class="sub-section-title">Campaign Dynamics</div>';
    html += '<div class="data-table-wrap"><table class="data-table"><thead><tr><th></th>';
    last10.forEach(r => { html += `<th>${periodLabel(r.period, currentGran)}</th>`; });
    html += '</tr></thead><tbody>';

    html += '<tr><td>Total Discount, €</td>';
    last10.forEach((r, i) => {
      const pv = i > 0 ? last10[i-1].campaigns_discount_eur : null;
      html += `<td>${fmtEur(r.campaigns_discount_eur)} ${pctChangeInline(r.campaigns_discount_eur, pv)}</td>`;
    });
    html += '</tr>';

    html += '<tr><td>Bolt Spend, €</td>';
    last10.forEach((r, i) => {
      const pv = i > 0 ? last10[i-1].bolt_spend_eur : null;
      html += `<td>${fmtEur(r.bolt_spend_eur)} ${pctChangeInline(r.bolt_spend_eur, pv)}</td>`;
    });
    html += '</tr>';

    html += '<tr><td>Merchant Spend, €</td>';
    last10.forEach((r, i) => {
      const pv = i > 0 ? last10[i-1].merchant_spend_eur : null;
      html += `<td>${fmtEur(r.merchant_spend_eur)} ${pctChangeInline(r.merchant_spend_eur, pv)}</td>`;
    });
    html += '</tr>';

    html += '<tr><td>Campaigns % GMV</td>';
    last10.forEach((r, i) => {
      const val = r.gmv_eur ? (r.campaigns_discount_eur / r.gmv_eur * 100) : 0;
      const pv = i > 0 && last10[i-1].gmv_eur ? (last10[i-1].campaigns_discount_eur / last10[i-1].gmv_eur * 100) : null;
      html += `<td>${fmtPct(val, 1)} ${ppChangeHtml(val, pv)}</td>`;
    });
    html += '</tr>';

    html += '<tr><td>Bolt % GMV</td>';
    last10.forEach((r, i) => {
      const val = r.gmv_eur ? (r.bolt_spend_eur / r.gmv_eur * 100) : 0;
      const pv = i > 0 && last10[i-1].gmv_eur ? (last10[i-1].bolt_spend_eur / last10[i-1].gmv_eur * 100) : null;
      html += `<td>${fmtPct(val, 1)} ${ppChangeHtml(val, pv)}</td>`;
    });
    html += '</tr>';

    html += '<tr><td>Merchant % GMV</td>';
    last10.forEach((r, i) => {
      const val = r.gmv_eur ? (r.merchant_spend_eur / r.gmv_eur * 100) : 0;
      const pv = i > 0 && last10[i-1].gmv_eur ? (last10[i-1].merchant_spend_eur / last10[i-1].gmv_eur * 100) : null;
      html += `<td>${fmtPct(val, 1)} ${ppChangeHtml(val, pv)}</td>`;
    });
    html += '</tr>';

    const campOrdPct = (r) => (r && r.orders) ? ((r.campaign_orders || 0) / r.orders * 100) : null;
    const boltOrdPct = (r) => (r && r.orders) ? ((r.bolt_campaign_orders || 0) / r.orders * 100) : null;
    const hasOrderShare = last10.some(r => r.orders != null && r.campaign_orders != null);
    if (hasOrderShare) {
      html += '<tr><td>Orders on campaigns, %</td>';
      last10.forEach((r, i) => {
        const val = campOrdPct(r);
        const pv = i > 0 ? campOrdPct(last10[i-1]) : null;
        html += `<td>${val != null ? fmtPct(val, 1) : '—'} ${ppChangeHtml(val, pv)}</td>`;
      });
      html += '</tr>';

      html += '<tr><td>Orders on Bolt campaigns, %</td>';
      last10.forEach((r, i) => {
        const val = boltOrdPct(r);
        const pv = i > 0 ? boltOrdPct(last10[i-1]) : null;
        html += `<td>${val != null ? fmtPct(val, 1) : '—'} ${ppChangeHtml(val, pv)}</td>`;
      });
      html += '</tr>';
    }

    if (currentView !== 'overview') {
      const promoStore = (D.item_discount_promo || {})[currentGran] || (D.item_discount_promo || {});
      const promoData = safe(promoStore[canonicalPartner(currentView)]);
      if (promoData.length) {
        html += '<tr><td>Item level discount promo share, %</td>';
        last10.forEach((r, i) => {
          const pd = promoData.find(x => x.period === r.period);
          const val = pd ? pd.value : null;
          const ppd = i > 0 ? promoData.find(x => x.period === last10[i-1].period) : null;
          const pv = ppd ? ppd.value : null;
          html += `<td>${val != null ? fmtPct(val, 2) : '—'} ${ppChangeHtml(val, pv)}</td>`;
        });
        html += '</tr>';
      }
    }

    html += '</tbody></table></div>';
    return html;
  }

  /* ---- Charts ---- */
  function makeChart(id, cfg) {
    const el = document.getElementById(id);
    if (!el) return;
    const c = new Chart(el.getContext('2d'), cfg);
    charts.push(c);
    return c;
  }

  function drawGmvOrdersChart(fin) {
    if (!fin.length) return;
    const labels = fin.map(r => periodLabel(r.period, currentGran));
    makeChart('chartGmvOrders', {
      type: 'line',
      data: {
        labels,
        datasets: [
          { label: 'GMV (€)', data: fin.map(r => r.gmv_eur), borderColor: '#34D186', backgroundColor: '#34D18630', fill: true, tension: 0.3, yAxisID: 'y' },
          { label: 'Orders', data: fin.map(r => r.orders), borderColor: '#1A1A2E', backgroundColor: '#1A1A2E30', fill: false, tension: 0.3, yAxisID: 'y1' }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        scales: {
          y: { type: 'linear', position: 'left', title: { display: true, text: 'GMV (€)' }, grid: { color: '#E2E8F020' } },
          y1: { type: 'linear', position: 'right', title: { display: true, text: 'Orders' }, grid: { drawOnChartArea: false } }
        },
        plugins: { legend: { position: 'top' } }
      }
    });
  }

  function drawEaterFeesChart(fin) {
    if (!fin.length) return;
    const labels = fin.map(r => periodLabel(r.period, currentGran));
    makeChart('chartEaterFees', {
      type: 'line',
      data: {
        labels,
        datasets: [
          { label: 'Total Eater Fees/Order', data: fin.map(r => r.eater_fees_per_order), borderColor: '#1A1A2E', borderWidth: 2.5, borderDash: [5, 3], fill: false, tension: 0.3, pointRadius: 3 },
          { label: 'Delivery Fee/Order', data: fin.map(r => r.delivery_fee_per_order), borderColor: '#6366F1', backgroundColor: '#6366F120', fill: true, tension: 0.3 },
          { label: 'Small Order Fee/Order', data: fin.map(r => r.small_order_fee_per_order), borderColor: '#F59E0B', fill: false, tension: 0.3 },
          { label: 'Service Fee/Order', data: fin.map(r => r.service_fee_per_order), borderColor: '#EF4444', fill: false, tension: 0.3 }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        scales: { y: { title: { display: true, text: '€ per Order' } } },
        plugins: { legend: { position: 'top' } }
      }
    });
  }

  const SHARE_PALETTE = ['#34D186','#1A1A2E','#6366F1','#F59E0B','#EF4444','#8B5CF6','#EC4899','#14B8A6','#F97316','#0EA5E9','#A3E635','#DB2777','#7C3AED','#22C55E','#EAB308'];
  const OTHERS_COLOR = '#CBD5E1';

  function doughnutCfg(labels, data, colors, total, isEur) {
    return {
      type: 'doughnut',
      data: { labels, datasets: [{ data, backgroundColor: colors }] },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: ctx => `${ctx.label}: ${isEur ? '€' + fmt(ctx.parsed, 0) : fmt(ctx.parsed, 0)} (${fmtPct(total ? ctx.parsed / total * 100 : 0, 1)})` } }
        }
      }
    };
  }

  // GMV + Orders share doughnuts: one ordered partner list (top 15 by GMV + Others),
  // fixed color per partner shared by both charts, single shared HTML legend.
  function drawShareCharts(dataSource, gmvId, ordersId, legendId) {
    const src = dataSource || getDataSource();
    gmvId = gmvId || 'chartGmvShare'; ordersId = ordersId || 'chartOrdersShare'; legendId = legendId || 'shareLegend';
    let partnerData = safe(src.gmv_by_partner).filter(r => r.period === currentPeriod);
    if (!partnerData.length) partnerData = safe(D.top_partners_gmv);
    if (!partnerData.length) return;
    const byPartner = {};
    partnerData.forEach(r => {
      const k = r.group_name;
      if (!k) return;
      if (!byPartner[k]) byPartner[k] = { name: k, gmv: 0, orders: 0 };
      byPartner[k].gmv += (r.gmv_eur || 0);
      byPartner[k].orders += (r.orders || 0);
    });
    const arr = Object.values(byPartner).sort((a, b) => b.gmv - a.gmv);
    const TOP = 15;
    const items = arr.slice(0, TOP).map((r, i) => ({ name: r.name, gmv: r.gmv, orders: r.orders, color: SHARE_PALETTE[i % SHARE_PALETTE.length] }));
    const rest = arr.slice(TOP);
    if (rest.length) items.push({ name: 'Others', gmv: rest.reduce((a, b) => a + b.gmv, 0), orders: rest.reduce((a, b) => a + b.orders, 0), color: OTHERS_COLOR });
    const labels = items.map(i => i.name);
    const colors = items.map(i => i.color);
    const gmvData = items.map(i => i.gmv);
    const ordersData = items.map(i => i.orders);
    const totalGmv = gmvData.reduce((a, b) => a + b, 0);
    const totalOrders = ordersData.reduce((a, b) => a + b, 0);
    makeChart(gmvId, doughnutCfg(labels, gmvData, colors, totalGmv, true));
    makeChart(ordersId, doughnutCfg(labels, ordersData, colors, totalOrders, false));
    const lg = document.getElementById(legendId);
    if (lg) lg.innerHTML = items.map(i => `<div style="display:flex;align-items:center;gap:6px;font-size:11px;margin-bottom:5px;"><span style="width:11px;height:11px;border-radius:2px;background:${i.color};display:inline-block;flex:0 0 auto;"></span><span>${i.name}</span></div>`).join('');
  }

  function drawCampaignsChart(camp) {
    if (!camp.length) return;
    const labels = camp.map(r => periodLabel(r.period, currentGran));
    makeChart('chartCampaigns', {
      type: 'line',
      data: {
        labels,
        datasets: [
          { label: 'Total Discount, % GMV', data: camp.map(r => r.gmv_eur ? (r.campaigns_discount_eur / r.gmv_eur * 100) : 0), borderColor: '#34D186', backgroundColor: '#34D18620', fill: true, tension: 0.3 },
          { label: 'Bolt Spend, % GMV', data: camp.map(r => r.gmv_eur ? (r.bolt_spend_eur / r.gmv_eur * 100) : 0), borderColor: '#1A1A2E', tension: 0.3 },
          { label: 'Merchant Spend, % GMV', data: camp.map(r => r.gmv_eur ? (r.merchant_spend_eur / r.gmv_eur * 100) : 0), borderColor: '#F59E0B', tension: 0.3 }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        scales: { y: { title: { display: true, text: '% of GMV' }, ticks: { callback: v => v.toFixed(1) + '%' } } },
        plugins: { legend: { position: 'top' } }
      }
    });
  }

  render();
})();
</script>
</body>
</html>
