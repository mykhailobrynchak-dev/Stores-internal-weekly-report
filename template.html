<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3P Stores Ukraine — Weekly Performance Report</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root {
  --primary: #34D186;
  --primary-light: #34D18620;
  --dark: #1A1A2E;
  --bg: #F8F9FA;
  --card: #FFFFFF;
  --border: #E2E8F0;
  --text: #1A1A2E;
  --text-secondary: #64748B;
  --red: #EF4444;
  --green: #34D186;
  --orange: #F59E0B;
  --sidebar-w: 178px;
  --city-nav-w: 200px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; overflow-x: hidden; }

.sidebar { width: var(--sidebar-w); background: var(--dark); color: #fff; position: fixed; top: 0; left: 0; bottom: 0; overflow-y: auto; z-index: 100; display: flex; flex-direction: column; }
.sidebar-header { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
.sidebar-header h2 { font-size: 16px; font-weight: 700; color: var(--primary); }
.sidebar-header p { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 4px; }
.sidebar-nav { flex: 1; padding: 12px 0; }
.nav-item { padding: 10px 20px; cursor: pointer; font-size: 13px; color: rgba(255,255,255,0.7); transition: all 0.2s; border-left: 3px solid transparent; }
.nav-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.nav-item.active { background: rgba(52,209,134,0.1); color: var(--primary); border-left-color: var(--primary); font-weight: 600; }
.nav-item.highlighted { color: #F59E0B; font-weight: 600; }
.nav-section-title { padding: 16px 20px 6px; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.35); }

.main { margin-left: var(--sidebar-w); flex: 1; padding: 24px 32px; max-width: calc(100vw - var(--sidebar-w)); overflow-x: hidden; box-sizing: border-box; }

/* Secondary city navigation panel (appears to the right of the main nav in City overview mode) */
.city-nav { position: fixed; top: 0; left: var(--sidebar-w); bottom: 0; width: var(--city-nav-w); background: var(--card); border-right: 1px solid var(--border); overflow-y: auto; z-index: 99; display: none; padding: 14px 0; }
.city-nav .city-nav-title { padding: 8px 18px 10px; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-secondary); font-weight: 700; }
.city-nav .city-nav-item { padding: 8px 18px; cursor: pointer; font-size: 13px; color: var(--text); border-left: 3px solid transparent; transition: all 0.15s; }
.city-nav .city-nav-item:hover { background: var(--primary-light); }
.city-nav .city-nav-item.active { background: var(--primary-light); color: var(--dark); border-left-color: var(--primary); font-weight: 600; }
body.city-mode .city-nav { display: block; }
body.city-mode .main { margin-left: calc(var(--sidebar-w) + var(--city-nav-w)); max-width: calc(100vw - var(--sidebar-w) - var(--city-nav-w)); }
.top-bar { margin-bottom: 16px; }
.controls-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
.top-bar h1 { font-size: 22px; font-weight: 700; }
.controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.toggle-group { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.toggle-btn { padding: 6px 16px; font-size: 12px; cursor: pointer; background: var(--card); border: none; color: var(--text-secondary); font-weight: 500; transition: all 0.2s; }
.toggle-btn.active { background: var(--primary); color: #fff; }

.period-slider { position: relative; max-width: 100%; overflow: hidden; }
.period-tabs { display: flex; gap: 4px; flex-wrap: wrap; padding: 2px 0; }
.period-tab { padding: 5px 12px; font-size: 11px; border-radius: 6px; cursor: pointer; background: var(--card); border: 1px solid var(--border); color: var(--text-secondary); transition: all 0.2s; white-space: nowrap; flex-shrink: 0; }
.period-tab:hover { border-color: var(--primary); }
.period-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.slider-arrow { display: none; }

.section { margin-bottom: 32px; }
.section-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 2px solid var(--primary); display: inline-block; }
.sub-section-title { font-size: 14px; font-weight: 600; margin: 20px 0 12px; color: var(--dark); }

.kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-bottom: 20px; }
.kpi-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
.kpi-label { font-size: 11px; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.3px; }
.kpi-value { font-size: 20px; font-weight: 700; color: var(--dark); }
.kpi-change { font-size: 11px; margin-top: 4px; display: flex; align-items: center; gap: 3px; }
.kpi-change.up { color: var(--green); }
.kpi-change.down { color: var(--red); }
.kpi-change.neutral { color: var(--text-secondary); }

.data-table-wrap { overflow-x: auto; margin-bottom: 20px; }
.data-table { width: 100%; border-collapse: collapse; font-size: 12px; background: var(--card); border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
.data-table th { background: var(--dark); color: #fff; padding: 10px 12px; text-align: left; font-weight: 600; white-space: nowrap; }
.data-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:hover td { background: var(--primary-light); }
.data-table .section-row td { background: #f1f5f9; font-weight: 700; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-secondary); padding: 7px 12px; }
.data-table .section-row.grp-overview td { background: #E8F9F1; color: #0F7A4F; }
.data-table .section-row.grp-courier td { background: #EAF1FE; color: #2456B3; }
.data-table .section-row.grp-failed td { background: #FDECEC; color: #B3283A; }
.data-table .section-row.grp-adjust td { background: #F2ECFB; color: #6A3FB0; }
.chg-up { color: var(--green); font-size: 10px; margin-left: 4px; }
.chg-down { color: var(--red); font-size: 10px; margin-left: 4px; }

.chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
.chart-container { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
.chart-container.full { grid-column: 1 / -1; }
.chart-container h3 { font-size: 13px; font-weight: 600; margin-bottom: 12px; }
.chart-wrap { position: relative; height: 300px; }

.sub-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
.sub-kpi { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px; font-size: 12px; }
.sub-kpi .label { color: var(--text-secondary); font-size: 10px; text-transform: uppercase; }
.sub-kpi .val { font-size: 16px; font-weight: 700; margin-top: 2px; }
.sub-kpi .chg { font-size: 10px; margin-top: 2px; }

.run-rate-block { background: #FFF8E1; border: 2px solid #F59E0B; border-radius: 12px; padding: 20px; margin-bottom: 24px; }
.run-rate-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.run-rate-badge { background: #F59E0B; color: #fff; font-weight: 700; font-size: 12px; padding: 4px 12px; border-radius: 6px; text-transform: uppercase; }
.run-rate-info { font-size: 11px; color: var(--text-secondary); }
.run-rate-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 10px; }
.rr-card { background: #FFFDE7; border: 1px solid #FFF59D; border-radius: 8px; padding: 10px 12px; }
.rr-card .rr-label { font-size: 9px; color: var(--text-secondary); text-transform: uppercase; font-weight: 600; }
.rr-card .rr-value { font-size: 18px; font-weight: 700; margin-top: 2px; }
.rr-card .rr-chg { font-size: 10px; margin-top: 2px; }
.rr-card .rr-prev { font-size: 9px; color: var(--text-secondary); margin-top: 2px; }

.view-toggle { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-bottom: 8px; }
.view-toggle button { padding: 4px 12px; font-size: 11px; border: none; cursor: pointer; background: var(--card); color: var(--text-secondary); font-weight: 500; }
.view-toggle button.active { background: var(--dark); color: #fff; }

.city-toggle-btn { display: inline-block; padding: 4px 14px; font-size: 11px; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; background: var(--card); color: var(--text-secondary); font-weight: 500; margin: 8px 0; transition: all 0.2s; }
.city-toggle-btn.active { background: var(--dark); color: #fff; border-color: var(--dark); }

@media (max-width: 1000px) {
  .chart-row { grid-template-columns: 1fr; }
  .kpi-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
}
@media (max-width: 768px) {
  .sidebar { width: 100%; position: relative; height: auto; }
  .main { margin-left: 0; padding: 16px; }
}
</style>
</head>
<body>

<nav class="sidebar">
  <div class="sidebar-header">
    <h2>3P Stores Ukraine</h2>
    <p>Weekly Performance Report</p>
  </div>
  <div class="sidebar-nav" id="sidebarNav"></div>
</nav>

<div id="cityNav" class="city-nav"></div>

<div class="main">
  <div class="top-bar">
    <h1 id="pageTitle">All 3P Stores</h1>
  </div>
  <div id="brandSelector"></div>
  <div class="controls-row">
    <div class="toggle-group" id="granToggle"></div>
    <div class="period-tabs" id="periodTabs"></div>
  </div>

  <div id="content"></div>
</div>

<script>
/*__REPORT_DATA__*/

(function() {
  const D = typeof REPORT_DATA !== 'undefined' ? REPORT_DATA : null;
  if (!D) { document.getElementById('content').innerHTML = '<p>No data loaded.</p>'; return; }

  // Merchant SKU Sessions Availability Rate — shown as-is (weighted rate from fact_provider_weekly).
  // Note: reads ~1.4x higher than the internal Looker report; definition not yet fully reconciled.
  const SHOW_SKU_AVAILABILITY = true;

  let currentView = 'overview';
  let currentGran = 'weekly';
  let currentPeriod = null;
  let currentCity = null;
  let charts = [];
  let showCityBreakdown = false;

  const $ = id => document.getElementById(id);

  /* ---- helpers ---- */
  function safe(arr) { return Array.isArray(arr) ? arr : []; }
  function fmt(v, dec=0) { if (v == null || isNaN(v)) return '—'; return Number(v).toLocaleString('en-US', {minimumFractionDigits: dec, maximumFractionDigits: dec}); }
  function fmtPct(v, dec=1) { if (v == null || isNaN(v)) return '—'; return Number(v).toFixed(dec) + '%'; }
  function fmtEur(v, dec=0) { if (v == null || isNaN(v)) return '—'; return '€' + Number(v).toLocaleString('en-US', {minimumFractionDigits: dec, maximumFractionDigits: dec}); }

  const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const MONTHS_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  function periodLabel(p, gran) {
    if (!p) return '—';
    const parts = p.replace(' 00:00:00','').split('-');
    if (parts.length < 3) return p;
    const month = parseInt(parts[1]) - 1, day = parseInt(parts[2]);
    if (gran === 'quarterly') { const q = Math.ceil((month+1)/3); return `Q${q} ${parts[0]}`; }
    if (gran === 'monthly') return MONTHS_FULL[month] + ' ' + parts[0];
    return MONTHS_SHORT[month] + ' ' + day;
  }

  function pctChange(cur, prev) {
    if (prev == null || cur == null || prev === 0) return null;
    return ((cur - prev) / Math.abs(prev)) * 100;
  }
  function ppChange(cur, prev) {
    if (prev == null || cur == null) return null;
    return cur - prev;
  }
  function changeHtml(cur, prev, inverted=false) {
    const ch = pctChange(cur, prev);
    if (ch == null) return '<span class="kpi-change neutral">—</span>';
    const up = ch >= 0;
    const cls = inverted ? (up ? 'down' : 'up') : (up ? 'up' : 'down');
    const arrow = up ? '&#9650;' : '&#9660;';
    return `<span class="kpi-change ${cls}">${arrow} ${Math.abs(ch).toFixed(1)}%</span>`;
  }
  function ppChangeHtml(cur, prev, inverted=false) {
    const pp = ppChange(cur, prev);
    if (pp == null) return '';
    const up = pp >= 0;
    const cls = inverted ? (up ? 'chg-down' : 'chg-up') : (up ? 'chg-up' : 'chg-down');
    const sign = pp >= 0 ? '+' : '';
    return `<span class="${cls}">${sign}${pp.toFixed(1)}pp</span>`;
  }
  function pctChangeInline(cur, prev, inverted=false) {
    const ch = pctChange(cur, prev);
    if (ch == null) return '';
    const up = ch >= 0;
    const cls = inverted ? (up ? 'chg-down' : 'chg-up') : (up ? 'chg-up' : 'chg-down');
    const sign = ch >= 0 ? '+' : '';
    return `<span class="${cls}">${sign}${ch.toFixed(1)}%</span>`;
  }

  function destroyCharts() { charts.forEach(c => { try { c.destroy(); } catch(e){} }); charts = []; }
  function last(arr) { return arr.length ? arr[arr.length - 1] : null; }
  function prev(arr) { return arr.length >= 2 ? arr[arr.length - 2] : null; }

  /* ---- collapsible wrapper (Show/Hide button, like GMV by City) ---- */
  function collapsible(label, innerHtml, open=true) {
    if (!innerHtml) return '';
    const disp = open ? 'block' : 'none';
    const verb = open ? 'Hide' : 'Show';
    return `<div style="margin-bottom:16px;"><button class="toggle-btn" data-label="${label}" style="font-size:12px;padding:6px 14px;border:1px solid var(--border);border-radius:6px;cursor:pointer;background:var(--card);" onclick="var t=this.nextElementSibling;var o=t.style.display==='none';t.style.display=o?'block':'none';this.textContent=(o?'Hide ':'Show ')+this.dataset.label;">${verb} ${label}</button><div style="display:${disp};">${innerHtml}</div></div>`;
  }

  /* ---- sidebar (Change 1: employee grouping) ---- */
  function buildSidebar() {
    const nav = $('sidebarNav');
    const highlightedPartners = new Set(['LOKO', 'VARUS', 'RUKAVYCHKA']);
    const subBrandKeys = new Set(safe(D.subbrand_keys));  // KOPIYKA sub-brands: reachable only via the KOPIYKA Group page
    const partnerSet = new Set(safe(D.partners_list).filter(p => !subBrandKeys.has(p)));
    let html = '<div class="nav-section-title">Overview</div>';
    html += `<div class="nav-item ${currentView==='overview'?'active':''}" data-view="overview">All 3P Stores</div>`;
    if (safe(D.city_list).length) {
      html += `<div class="nav-item ${currentView==='city'?'active':''}" data-view="city">City overview</div>`;
    }

    const groups = D.employee_groups || {};
    const groupNames = Object.keys(groups);

    if (groupNames.length) {
      const listed = new Set(subBrandKeys);
      groupNames.forEach(emp => {
        html += `<div class="nav-section-title">${emp}</div>`;
        const brands = safe(groups[emp]).filter(p => partnerSet.has(p));
        brands.sort((a, b) => (highlightedPartners.has(b) ? 1 : 0) - (highlightedPartners.has(a) ? 1 : 0));
        brands.forEach(p => {
          listed.add(p);
          const hl = highlightedPartners.has(p) ? ' highlighted' : '';
          html += `<div class="nav-item${hl} ${currentView===p?'active':''}" data-view="${p}">${displayName(p)}</div>`;
        });
      });
      const unlisted = safe(D.partners_list).filter(p => !listed.has(p) && !subBrandKeys.has(p));
      if (unlisted.length) {
        html += '<div class="nav-section-title">Other</div>';
        unlisted.forEach(p => {
          const hl = highlightedPartners.has(p) ? ' highlighted' : '';
          html += `<div class="nav-item${hl} ${currentView===p?'active':''}" data-view="${p}">${displayName(p)}</div>`;
        });
      }
    } else {
      html += '<div class="nav-section-title">Partners</div>';
      safe(D.partners_list).forEach(p => {
        const hl = highlightedPartners.has(p) ? ' highlighted' : '';
        html += `<div class="nav-item${hl} ${currentView===p?'active':''}" data-view="${p}">${p}</div>`;
      });
    }

    nav.innerHTML = html;
    nav.querySelectorAll('.nav-item').forEach(el => {
      el.addEventListener('click', () => {
        if (el.dataset.city) { currentView = 'city'; currentCity = el.dataset.city; }
        else { currentView = el.dataset.view; }
        currentPeriod = null;
        render();
      });
    });
  }

  /* ---- secondary city nav panel (right of the main sidebar, City overview only) ---- */
  function buildCityNav() {
    const el = $('cityNav');
    if (!el) return;
    if (currentView !== 'city') { document.body.classList.remove('city-mode'); el.innerHTML = ''; return; }
    document.body.classList.add('city-mode');
    let html = '<div class="city-nav-title">Cities · by GMV</div>';
    safe(D.city_list).forEach(c => {
      html += `<div class="city-nav-item ${currentCity===c?'active':''}" data-city="${c}">${c}</div>`;
    });
    el.innerHTML = html;
    el.querySelectorAll('.city-nav-item').forEach(elm => {
      elm.addEventListener('click', () => { currentCity = elm.dataset.city; currentPeriod = null; render(); });
    });
  }

  /* ---- brand sub-selector for groups that have sub-brands (e.g. KOPIYKA Group) ---- */
  function buildBrandSelector() {
    const el = $('brandSelector');
    if (!el) return;
    const groups = D.subbrand_groups || {};
    // Which group are we in? currentView is the group key or one of its sub-brand keys.
    let groupKey = null;
    Object.keys(groups).forEach(g => {
      if (currentView === g || (groups[g] || []).includes(currentView)) groupKey = g;
    });
    if (!groupKey) { el.innerHTML = ''; return; }
    const opts = [{ key: groupKey, label: 'Group' }].concat((groups[groupKey] || []).map(b => ({ key: b, label: b })));
    el.innerHTML = '<div class="view-toggle">' + opts.map(o =>
      `<button class="${currentView === o.key ? 'active' : ''}" data-bk="${o.key}">${o.label}</button>`
    ).join('') + '</div>';
    el.querySelectorAll('button').forEach(b => {
      b.addEventListener('click', () => { currentView = b.dataset.bk; currentPeriod = null; render(); });
    });
  }

  /* ---- granularity & period tabs with slider ---- */
  function buildControls() {
    buildBrandSelector();
    const gt = $('granToggle');
    gt.innerHTML = ['quarterly','monthly','weekly'].map(g =>
      `<button class="toggle-btn ${currentGran===g?'active':''}" data-g="${g}">${g.charAt(0).toUpperCase()+g.slice(1)}</button>`
    ).join('');
    gt.querySelectorAll('.toggle-btn').forEach(b => {
      b.addEventListener('click', () => { currentGran = b.dataset.g; currentPeriod = null; render(); });
    });

    const src = getDataSource();
    const periods = [...new Set(safe(src.financial).map(r => r.period))].sort();

    if (!currentPeriod && periods.length) {
      currentPeriod = periods[periods.length - 1];
    }

    const pt = $('periodTabs');
    let ph = '';
    periods.forEach(p => {
      ph += `<span class="period-tab ${currentPeriod===p?'active':''}" data-p="${p}">${periodLabel(p, currentGran)}</span>`;
    });
    pt.innerHTML = ph;
    pt.querySelectorAll('.period-tab').forEach(t => {
      t.addEventListener('click', () => { currentPeriod = t.dataset.p; render(); });
    });
  }


  function getDataSource() {
    if (currentView === 'overview') return (D.overview || {})[currentGran] || {};
    if (currentView === 'city') return (((D.cities || {})[currentCity] || {})[currentGran]) || {};
    return ((D.partners || {})[currentView] || {})[currentGran] || {};
  }

  function quarterLabel(period) {
    const d = period.replace(' 00:00:00','').split('-');
    const m = parseInt(d[1]);
    const q = Math.ceil(m / 3);
    return `Q${q} ${d[0]}`;
  }

  /* ---- KPI card builder ---- */
  function kpi(label, value, curRow, prevRow, field, opts={}) {
    const inv = opts.inverted || false;
    const chg = prevRow ? changeHtml(curRow[field], prevRow[field], inv) : '<span class="kpi-change neutral">—</span>';
    return `<div class="kpi-card"><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div>${chg}</div>`;
  }

  /* ---- acceptance/availability helpers ---- */
  function getAcceptAvail() {
    if (currentView === 'overview') return safe((D.acceptance_availability || {}).overview);
    return safe((D.acceptance_availability || {})[currentView]);
  }

  /* ---- aggregate partner city data (reuses aggregateCityData logic) ---- */
  function aggregatePartnerCityData(weeklyData, targetPeriod, targetGran) {
    return aggregateCityData(weeklyData, targetPeriod, targetGran);
  }

  /* ---- aggregate weekly city data for non-weekly granularity ---- */
  function aggregateCityData(weeklyData, targetPeriod, targetGran) {
    if (targetGran === 'weekly') {
      return safe(weeklyData).filter(r => r.period === targetPeriod).map(r => ({...r, city: r.city_name || r.city || 'Unknown'}));
    }
    const parts = targetPeriod.replace(' 00:00:00','').split('-');
    const yr = parseInt(parts[0]), mo = parseInt(parts[1]) - 1;
    let startDate, endDate;
    if (targetGran === 'monthly') {
      startDate = new Date(yr, mo, 1);
      endDate = new Date(yr, mo + 1, 0);
    } else {
      const qStartMonth = Math.floor(mo / 3) * 3;
      startDate = new Date(yr, qStartMonth, 1);
      endDate = new Date(yr, qStartMonth + 3, 0);
    }
    const cityMap = {};
    safe(weeklyData).forEach(r => {
      const rDate = new Date(r.period.replace(' 00:00:00',''));
      const cname = r.city_name || r.city || 'Unknown';
      if (rDate >= startDate && rDate <= endDate) {
        if (!cityMap[cname]) cityMap[cname] = { city: cname, orders: 0, gmv_eur: 0 };
        cityMap[cname].orders += (r.orders || 0);
        cityMap[cname].gmv_eur += (r.gmv_eur || 0);
      }
    });
    return Object.values(cityMap);
  }

  /* ---- render ---- */
  /* ---- display helpers ---- */
  function displayName(view) {
    if (view === 'overview') return 'All 3P Stores';
    if (view === 'KOPIYKA') return 'KOPIYKA Group';
    return view;
  }
  function partnerHasData(view) {
    const p = (D.partners || {})[view] || {};
    return ['weekly', 'monthly', 'quarterly'].some(g =>
      safe((p[g] || {}).financial).length > 0 || safe((p[g] || {}).operational).length > 0);
  }
  function anyDefect(arr) {
    return safe(arr).some(r => (r.item_quantity_defect_rate || 0) > 0 || (r.item_replacement_rate || 0) > 0

      const campC = campIdx >= 0 ? camp[campIdx] : last(camp);

      const pDemandPct = cpP && cpP.demand_incentives_gmv_share != null ? cpP.demand_incentives_gmv_share : null;

      html += '<div class="kpi-grid">';
      html += kpi('GMV', fmtEur(c.gmv_eur), c, p, 'gmv_eur');
      html += kpi('Orders', fmt(c.orders), c, p, 'orders');
      html += kpi('AOV (w/ Eater Fees)', fmtEur(c.aov_with_delivery, 2), c, p, 'aov_with_delivery');
      html += kpi('AOV (Items Only)', fmtEur(c.aov_items_only, 2), c, p, 'aov_items_only');
      html += kpi('Eater Fees / Order', fmtEur(c.eater_fees_per_order, 2), c, p, 'eater_fees_per_order');

        html += kpi('CP L2 Margin', fmtPct(cpC.cp_l2_margin_pct), cpC, cpP, 'cp_l2_margin_pct');

        html += '<div style="display:none;">' + cityHtml + '</div></div>';
      }
    }

    // Partner city breakdown (brand views with 2+ cities, all granularities)
    if (currentView !== 'overview') {
      const partnerCityAll = safe(D.partner_city_weekly).filter(r => r.group_name === currentView);
      const curCities = aggregatePartnerCityData(partnerCityAll, currentPeriod, currentGran);
      if (curCities.length >= 2) {
        const prevPer = getPrevPeriod(currentPeriod, currentGran);

      if (oc.stores_with_orders != null) html += kpi('Stores with Orders', fmt(oc.stores_with_orders), oc, op, 'stores_with_orders');
      html += kpi('Acceptance Rate', fmtPct(oc.acceptance_rate, 1), oc, op, 'acceptance_rate');
      html += kpi('Availability', fmtPct(oc.availability_rate, 1), oc, op, 'availability_rate');
      html += kpi('Avg Rating', fmt(oc.avg_rating, 2), oc, op, 'avg_rating');
      html += kpi('Honey Order Rate', fmtPct(oc.honey_order_rate, 1), oc, op, 'honey_order_rate');

      if (oc.cpo_eur != null) html += kpi('CPO', '€' + fmt(oc.cpo_eur, 2), oc, op, 'cpo_eur', { inverted: true });

    /* SECTION 3: Campaign Analytics */
    html += '<div class="section"><div class="section-title">Campaign Analytics — ' + city + '</div>';
    const ki = camp.findIndex(r => r.period === currentPeriod);
    const cc = ki >= 0 ? camp[ki] : last(camp);
    const cpv = ki > 0 ? camp[ki - 1] : (ki === 0 ? null : prev(camp));
    if (cc) {
      const dPct = cc.gmv_eur ? cc.campaigns_discount_eur / cc.gmv_eur * 100 : 0;
      const bPct = cc.gmv_eur ? cc.bolt_spend_eur / cc.gmv_eur * 100 : 0;
      const mPct = cc.gmv_eur ? cc.merchant_spend_eur / cc.gmv_eur * 100 : 0;
      const dPctP = cpv && cpv.gmv_eur ? cpv.campaigns_discount_eur / cpv.gmv_eur * 100 : null;
      const bPctP = cpv && cpv.gmv_eur ? cpv.bolt_spend_eur / cpv.gmv_eur * 100 : null;
      const mPctP = cpv && cpv.gmv_eur ? cpv.merchant_spend_eur / cpv.gmv_eur * 100 : null;

      html += kpi('Merchant Spend', fmtEur(cc.merchant_spend_eur), cc, cpv, 'merchant_spend_eur');
      html += kpi('Campaigns % GMV', fmtPct(dPct, 2), { v: dPct }, dPctP != null ? { v: dPctP } : null, 'v', { inverted: true });
      html += kpi('Bolt % GMV', fmtPct(bPct, 2), { v: bPct }, bPctP != null ? { v: bPctP } : null, 'v', { inverted: true });
      html += kpi('Merchant % GMV', fmtPct(mPct, 2), { v: mPct }, mPctP != null ? { v: mPctP } : null, 'v');
      html += '</div>';
    }
    html += buildCampaignDynamicsTable(camp);
    html += '<div class="chart-row"><div class="chart-container full"><h3>Campaign Spend Trend (% of GMV)</h3><div class="chart-wrap"><canvas id="chartCampaigns"></canvas></div></div></div>';
    html += buildCityPartnerCampTable(cityNode);
    html += '</div>';

    $('content').innerHTML = html;
    drawGmvOrdersChart(fin);
    drawEaterFeesChart(fin);
    drawShareCharts(src);
    drawCampaignsChart(camp);
  }

  /* ---- city per-partner table helpers ---- */
  function _managedPartners() {
    const s = new Set();
    const g = D.employee_groups || {};
    Object.keys(g).forEach(k => safe(g[k]).forEach(p => s.add(p)));
    return s;
  }
  // Every real portfolio partner (managed + has data somewhere) — shown as a row in each city
  // even if it doesn't operate in that city ("—"). Not-yet-activated placeholders are excluded.
  function _realManagedList() {
    return [...(_managedPartners())].filter(p => partnerHasData(p));
  }
  function _ssum(rows, key) { return rows.reduce((a, b) => a + (b[key] || 0), 0); }
  function _wavg(rows, key, wKey) {
    let num = 0, den = 0;
    rows.forEach(r => { const v = r[key], w = r[wKey] || 0; if (v != null) { num += v * w; den += w; } });
    return den ? num / den : null;
  }
  function _periodUsed(rows) {
    const r = safe(rows);
    if (r.some(x => x.period === currentPeriod)) return currentPeriod;
    const ps = [...new Set(r.map(x => x.period))].sort();
    return ps[ps.length - 1] || null;
  }

    const gmvCurBy = {}, gmvPrevBy = {}, cpCurBy = {}, cpPrevBy = {};
    gmvAll.forEach(r => { if (r.period === curP) gmvCurBy[r.group_name] = r; else if (r.period === prevP) gmvPrevBy[r.group_name] = r; });
    opsAll.forEach(r => { if (r.period === curP) cpCurBy[r.group_name] = r; else if (r.period === prevP) cpPrevBy[r.group_name] = r; });
    const managedList = _realManagedList().sort((a, b) => ((gmvCurBy[b] ? gmvCurBy[b].gmv_eur : -1) - (gmvCurBy[a] ? gmvCurBy[a].gmv_eur : -1)) || a.localeCompare(b));
    const othCur = gmvAll.filter(r => r.period === curP && !managed.has(r.group_name));
    const othPrev = gmvAll.filter(r => r.period === prevP && !managed.has(r.group_name));
    const othOpsCur = opsAll.filter(r => r.period === curP && !managed.has(r.group_name));
    const othOpsPrev = opsAll.filter(r => r.period === prevP && !managed.has(r.group_name));

    let html = '<div class="sub-section-title">Financial Overview by Partner</div>';
    html += '<div class="data-table-wrap"><table class="data-table"><thead><tr><th>Partner</th><th>GMV, €</th><th>Orders</th><th>AOV (Items Only)</th><th>Eater Fees / Order</th><th>CP Margin, %</th><th>CP L2 Margin, %</th></tr></thead><tbody>';
    const rowHtml = (name, cur, prev, curOps, prevOps) => {
      const g = cur ? cur.gmv_eur : null, gp = prev ? prev.gmv_eur : null;
      const o = cur ? cur.orders : null, op = prev ? prev.orders : null;

      const cpl = curOps ? curOps.cp_l2_margin_pct : null, cplp = prevOps ? prevOps.cp_l2_margin_pct : null;
      return `<tr><td>${displayName(name)}</td>`

        + `<td>${fmt(o)} ${pctChangeInline(o, op)}</td>`

  function aggregateCityFeeData(weeklyData, targetPeriod, targetGran) {
    if (targetGran === 'weekly') {
      return safe(weeklyData).filter(r => r.period === targetPeriod).map(r => ({...r, city: r.city_name || r.city || 'Unknown'}));
    }
    const parts = targetPeriod.replace(' 00:00:00','').split('-');
    const yr = parseInt(parts[0]), mo = parseInt(parts[1]) - 1;
    let startDate, endDate;
    if (targetGran === 'monthly') { startDate = new Date(yr, mo, 1); endDate = new Date(yr, mo + 1, 0); }
    else { const qs = Math.floor(mo / 3) * 3; startDate = new Date(yr, qs, 1); endDate = new Date(yr, qs + 3, 0); }
    const m = {};
    safe(weeklyData).forEach(r => {
      const rDate = new Date(r.period.replace(' 00:00:00',''));
      const cn = r.city_name || r.city || 'Unknown';
      if (rDate >= startDate && rDate <= endDate) {
        if (!m[cn]) m[cn] = {city: cn, orders: 0, total_eater: 0, total_del: 0, total_sof: 0, total_svc: 0};
        const ord = r.orders || 0;
        m[cn].orders += ord;
        m[cn].total_eater += (r.eater_fees_per_order || 0) * ord;
        m[cn].total_del += (r.delivery_fee_per_order || 0) * ord;
        m[cn].total_sof += (r.small_order_fee_per_order || 0) * ord;
        m[cn].total_svc += (r.service_fee_per_order || 0) * ord;
      }
    });
    return Object.values(m).map(c => ({
      city: c.city, orders: c.orders,
      eater_fees_per_order: c.orders ? c.total_eater / c.orders : 0,
      delivery_fee_per_order: c.orders ? c.total_del / c.orders : 0,
      small_order_fee_per_order: c.orders ? c.total_sof / c.orders : 0,
      service_fee_per_order: c.orders ? c.total_svc / c.orders : 0
    }));
  }

  /* ---- City Breakdown Section with deltas ---- */
  function buildCityBreakdownSection() {
    const rawWeekly = safe(D.city_breakdown_weekly);
    if (!rawWeekly.length) return '';

    let cityData = aggregateCityData(rawWeekly, currentPeriod, currentGran);
    if (!cityData.length) return '';

    const prevPeriod = getPrevPeriod(currentPeriod, currentGran);
    let prevCityData = prevPeriod ? aggregateCityData(rawWeekly, prevPeriod, currentGran) : [];
    const prevMap = {};
    prevCityData.forEach(r => { prevMap[r.city] = r; });

    cityData.sort((a, b) => (b.gmv_eur || 0) - (a.gmv_eur || 0));
    const totalGmv = cityData.reduce((a, b) => a + (b.gmv_eur || 0), 0);
    const top = cityData.slice(0, 10);
    const others = cityData.slice(10);

    let html = '<div class="sub-section-title">GMV by City — ' + periodLabel(currentPeriod, currentGran) + '</div>';
    html += '<div class="data-table-wrap"><table class="data-table"><thead><tr><th>City</th><th>Orders</th><th>GMV, €</th><th>% of Total</th></tr></thead><tbody>';
    top.forEach(r => {
      const pct = totalGmv ? (r.gmv_eur / totalGmv * 100) : 0;
      const pr = prevMap[r.city];
      const ordChg = pctChangeInline(r.orders, pr ? pr.orders : null);
      const gmvChg = pctChangeInline(r.gmv_eur, pr ? pr.gmv_eur : null);
      html += `<tr><td>${r.city}</td><td>${fmt(r.orders)} ${ordChg}</td><td>${fmtEur(r.gmv_eur)} ${gmvChg}</td><td>${fmtPct(pct, 1)}</td></tr>`;
    });
    if (others.length) {
      const oOrd = others.reduce((a, b) => a + (b.orders || 0), 0);
      const oGmv = others.reduce((a, b) => a + (b.gmv_eur || 0), 0);
      html += `<tr style="font-weight:600;"><td>Others (${others.length})</td><td>${fmt(oOrd)}</td><td>${fmtEur(oGmv)}</td><td>${fmtPct(totalGmv ? oGmv/totalGmv*100 : 0, 1)}</td></tr>`;
    }
    html += '</tbody></table></div>';
    return html;
  }

  function getPrevPeriod(period, gran) {
    const parts = period.replace(' 00:00:00','').split('-');
    const yr = parseInt(parts[0]), mo = parseInt(parts[1]) - 1, day = parseInt(parts[2]);
    let d;
    if (gran === 'weekly') d = new Date(yr, mo, day - 7);
    else if (gran === 'monthly') d = new Date(yr, mo - 1, 1);
    else d = new Date(yr, mo - 3, 1);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} 00:00:00`;
  }

  /* ---- Run Rate Block ---- */
  function buildRunRateBlock(fin, cp, camp) {
    const latest = fin[fin.length - 1];
    if (!latest) return '';
    const parts = latest.period.replace(' 00:00:00','').split('-');
    const year = parseInt(parts[0]), month = parseInt(parts[1]) - 1;
    const today = new Date();

    let daysInPeriod, dataEndDay, periodLabel;

    if (currentGran === 'quarterly') {
      const qStart = new Date(year, month, 1);
      const qEnd = new Date(year, month + 3, 0);
      daysInPeriod = Math.round((qEnd - qStart) / 86400000) + 1;
      const elapsed = Math.round((today - qStart) / 86400000) - 1;
      dataEndDay = Math.min(elapsed, daysInPeriod);
      const q = Math.ceil((month + 1) / 3);
      periodLabel = `Q${q} ${year}`;
    } else {
      daysInPeriod = new Date(year, month + 1, 0).getDate();
      dataEndDay = (today.getFullYear() === year && today.getMonth() === month) ? today.getDate() - 1 : daysInPeriod;
      periodLabel = MONTHS_FULL[month];
    }

    if (dataEndDay <= 0 || dataEndDay >= daysInPeriod) return '';

    const multiplier = daysInPeriod / dataEndDay;
    const monthName = currentGran === 'quarterly' ? periodLabel : MONTHS_FULL[month];
    const prevMonth = fin.length >= 2 ? fin[fin.length - 2] : null;

    const rr = {
      gmv: latest.gmv_eur * multiplier,
      orders: latest.orders * multiplier,
      aov_del: latest.aov_with_delivery,
      aov_items: latest.aov_items_only,
      eater_fees: latest.eater_fees_per_order,
      bolt_plus: latest.bolt_plus_gmv_share,
      users_activated: latest.users_activated * multiplier,
      active_users: latest.active_users * multiplier,
    };

    const campLast = safe(camp).find(r => r.period === latest.period);
    const campPrev = prevMonth ? safe(camp).find(r => r.period === prevMonth.period) : null;
    const rrCampTotal = campLast ? campLast.campaigns_discount_eur * multiplier : null;
    const rrCampBolt = campLast ? campLast.bolt_spend_eur * multiplier : null;
    const rrCampMerch = campLast ? campLast.merchant_spend_eur * multiplier : null;
    const rrCampPctGmv = (rrCampTotal && rr.gmv) ? (rrCampTotal / rr.gmv * 100) : null;
    const rrDemandPct = rrCampPctGmv;
    const commAov = rr.aov_del ? (rr.eater_fees / rr.aov_del * 100) : null;
    const commGmv = rr.gmv ? (rr.eater_fees * rr.orders / rr.gmv * 100) : null;

    let html = '<div class="run-rate-block">';
    html += '<div class="run-rate-header">';
    html += `<span class="run-rate-badge">${monthName.toUpperCase()} RUN RATE</span>`;
    const projTarget = currentGran === 'quarterly' ? `end of ${periodLabel}` : `${MONTHS_FULL[month]} ${daysInPeriod}`;
    html += `<span class="run-rate-info">${dataEndDay} days of data · ×${multiplier.toFixed(2)} projection to ${projTarget}</span>`;
    html += '</div>';
    html += '<div class="run-rate-grid">';

    const prevLabel = currentGran === 'quarterly' ? 'Q' + (Math.ceil((month+1)/3) - 1 || 4) : MONTHS_SHORT[month > 0 ? month - 1 : 11];
    function rrCard(label, displayVal, curRaw, prevRaw) {
      const chg = (curRaw != null && prevRaw != null) ? changeHtml(curRaw, prevRaw) : '';
      const hasChg = curRaw != null && prevRaw != null && pctChange(curRaw, prevRaw) != null;
      const chgStr = hasChg ? `<div class="rr-chg">${chg}</div>` : '';
      const prevStr = prevRaw != null ? `<div class="rr-prev">${prevLabel}: ${typeof prevRaw === 'number' && prevRaw > 100 ? fmtEur(prevRaw) : (typeof prevRaw === 'number' ? prevRaw.toFixed(1) : prevRaw)}</div>` : '';
      return `<div class="rr-card"><div class="rr-label">${label}</div><div class="rr-value">${displayVal}</div>${chgStr}${prevStr}</div>`;
    }

    html += rrCard('GMV', fmtEur(rr.gmv), rr.gmv, prevMonth ? prevMonth.gmv_eur : null);
    html += rrCard('Orders', fmt(Math.round(rr.orders)), rr.orders, prevMonth ? prevMonth.orders : null);
    html += rrCard('AOV (w/ Eater Fees)', fmtEur(rr.aov_del, 2), rr.aov_del, prevMonth ? prevMonth.aov_with_delivery : null);
    html += rrCard('AOV (Items Only)', fmtEur(rr.aov_items, 2), rr.aov_items, prevMonth ? prevMonth.aov_items_only : null);
    html += rrCard('Eater Fees / Order', fmtEur(rr.eater_fees, 2), rr.eater_fees, prevMonth ? prevMonth.eater_fees_per_order : null);
    html += rrCard('Bolt Plus GMV Share', fmtPct(rr.bolt_plus, 1), rr.bolt_plus, prevMonth ? prevMonth.bolt_plus_gmv_share : null);
    if (rrCampTotal != null) html += rrCard('Campaigns Total', fmtEur(rrCampTotal), rrCampTotal, campPrev ? campPrev.campaigns_discount_eur : null);
    if (rrCampBolt != null) html += rrCard('Campaigns Bolt', fmtEur(rrCampBolt), rrCampBolt, campPrev ? campPrev.bolt_spend_eur : null);
    if (rrCampMerch != null) html += rrCard('Campaigns Merchant', fmtEur(rrCampMerch), rrCampMerch, campPrev ? campPrev.merchant_spend_eur : null);
    if (rrCampPctGmv != null) html += rrCard('Campaigns % GMV', fmtPct(rrCampPctGmv, 1), rrCampPctGmv, campPrev && campPrev.gmv_eur ? (campPrev.campaigns_discount_eur / campPrev.gmv_eur * 100) : null);
    if (commAov != null) html += rrCard('Commission of AOV, %', fmtPct(commAov, 1), commAov, prevMonth && prevMonth.aov_with_delivery ? (prevMonth.eater_fees_per_order / prevMonth.aov_with_delivery * 100) : null);
    if (commGmv != null) html += rrCard('Commission of GMV, %', fmtPct(commGmv, 1), commGmv, prevMonth && prevMonth.gmv_eur ? (prevMonth.eater_fees_per_order * prevMonth.orders / prevMonth.gmv_eur * 100) : null);
    html += rrCard('Users Activated', fmt(Math.round(rr.users_activated)), rr.users_activated, prevMonth ? prevMonth.users_activated : null);

    html += '</div></div>';
    return html;
  }

  /* ---- Failed Order Breakdown ---- */
  function buildBadOrderBreakdown(ops, fail, opsIdx) {
    const oc = opsIdx >= 0 ? ops[opsIdx] : last(ops);
    const op = opsIdx > 0 ? ops[opsIdx - 1] : (opsIdx === 0 ? null : prev(ops));

    const failIdx = fail.findIndex(r => r.period === currentPeriod);
    const fc = failIdx >= 0 ? fail[failIdx] : last(fail);
    const fp = failIdx > 0 ? fail[failIdx - 1] : (failIdx === 0 ? null : prev(fail));

    if (!oc && !fc) return '';

    let html = '<div class="sub-section-title">Failed Order Breakdown</div>';
    html += '<div class="kpi-grid">';
    if (fc) {
      html += kpi('Failed Rate Total', fmtPct(fc.failed_rate_total, 1), fc, fp, 'failed_rate_total', {inverted: true});
      const fmPct = fc.total_placed ? (fc.failed_merchant / fc.total_placed * 100) : 0;
      const fpMPct = fp && fp.total_placed ? (fp.failed_merchant / fp.total_placed * 100) : null;
      html += kpi('Failed (Merchant)', fmtPct(fmPct, 1), {v: fmPct}, fpMPct != null ? {v: fpMPct} : null, 'v', {inverted: true});
      const fbPct = fc.total_placed ? (fc.failed_bolt_courier / fc.total_placed * 100) : 0;
      const fpBPct = fp && fp.total_placed ? (fp.failed_bolt_courier / fp.total_placed * 100) : null;
      html += kpi('Failed (Bolt+Courier)', fmtPct(fbPct, 1), {v: fbPct}, fpBPct != null ? {v: fpBPct} : null, 'v', {inverted: true});
    }
    if (oc) {
      html += kpi('Late Delivery', fmtPct(oc.late_delivery_rate, 1), oc, op, 'late_delivery_rate', {inverted: true});
      html += kpi('Late Pickup', fmtPct(oc.late_pickup_rate, 1), oc, op, 'late_pickup_rate', {inverted: true});
    }
    html += '</div>';
    return html;
  }

  /* ---- Operational Comparison Table (grouped into labeled blocks) ---- */
  function buildWoWComparisonTable(ops, fail) {
    const last10 = ops.slice(-10);
    if (last10.length < 2) return '';

    const cols = last10.length + 1;
    let html = '<div class="data-table-wrap"><table class="data-table"><thead><tr><th></th>';
    last10.forEach(r => { html += `<th>${periodLabel(r.period, currentGran)}</th>`; });
    html += '</tr></thead><tbody>';

    function groupHeader(label, cls) {
      return `<tr class="section-row ${cls}"><td colspan="${cols}">${label}</td></tr>`;
    }
    function rowFmt(label, getter, formatter, inverted=false) {
      let tr = `<tr><td>${label}</td>`;
      last10.forEach((r, i) => {
        const val = getter(r);
        const pv = i > 0 ? getter(last10[i-1]) : null;
        tr += `<td>${formatter(val)} ${pctChangeInline(val, pv, inverted)}</td>`;
      });
      return tr + '</tr>';
    }

    /* ===== Block 1: Overview ===== */
    html += groupHeader('Overview', 'grp-overview');
    html += rowFmt('Stores with Orders', r => r.stores_with_orders || r.active_stores, v => fmt(v));
    html += rowFmt('Acceptance Rate, %', r => r.acceptance_rate, v => fmtPct(v, 1));
    html += rowFmt('Availability, %', r => r.availability_rate, v => fmtPct(v, 1));
    html += rowFmt('Avg Rating', r => r.avg_rating, v => fmt(v, 2));
    html += rowFmt('Honey %', r => r.honey_order_rate, v => fmtPct(v, 1));
    html += rowFmt('Bad %', r => r.bad_order_rate, v => fmtPct(v, 1), true);
    html += rowFmt('Late Delivery Rate, %', r => r.late_delivery_rate, v => fmtPct(v, 1), true);
    html += rowFmt('Late Pickup Rate, %', r => r.late_pickup_rate, v => fmtPct(v, 1), true);
    html += rowFmt('Avg Delivery, min', r => r.avg_delivery_minutes, v => fmt(v, 1), true);
    if (last10.some(r => r.median_available_sku != null))
      html += rowFmt('Median Provider Available SKU, #', r => r.median_available_sku, v => v != null ? fmt(v) : '—');
    if (SHOW_SKU_AVAILABILITY && last10.some(r => r.sku_availability_pct != null))
      html += rowFmt('Merchant SKU Sessions Availability Rate, %', r => r.sku_availability_pct, v => v != null ? fmtPct(v, 1) : '—');

    /* ===== Block 2: Courier Metrics ===== */
    html += groupHeader('Courier Metrics', 'grp-courier');
    html += rowFmt('Courier Time / Order, min', r => r.courier_minutes_per_order, v => fmt(v, 1), true);
    html += rowFmt('Batching Rate, %', r => r.batching_rate, v => fmtPct(v, 1));
    html += rowFmt('Courier Acceptance Rate, %', r => r.courier_acceptance_rate, v => fmtPct(v, 1));
    html += rowFmt('CPO, €', r => r.cpo_eur, v => '€' + fmt(v, 2), true);

    /* ===== Block 3: Failed Order Breakdown (aligned to header periods) ===== */
    const failByPeriod = {};
    safe(fail).forEach(r => { if (r && r.period != null) failByPeriod[r.period] = r; });
    function failRow(label, getter) {
      let tr = `<tr><td>${label}</td>`;
      last10.forEach((r, i) => {
        const fr = failByPeriod[r.period];
        const pfr = i > 0 ? failByPeriod[last10[i-1].period] : null;
        const val = fr ? getter(fr) : null;
        const pv = pfr ? getter(pfr) : null;
        tr += `<td>${val != null ? fmtPct(val, 1) : '—'} ${pctChangeInline(val, pv, true)}</td>`;
      });
      return tr + '</tr>';
    }
    if (Object.keys(failByPeriod).length) {
      html += groupHeader('Failed Order Breakdown', 'grp-failed');
      html += failRow('Failed Merchant, %', r => r.total_placed ? (r.failed_merchant / r.total_placed * 100) : 0);
      html += failRow('Failed Bolt+Courier, %', r => r.total_placed ? (r.failed_bolt_courier / r.total_placed * 100) : 0);
      html += failRow('Failed Rate Total, %', r => r.failed_rate_total);
    }

    /* ===== Block 4: Order & Item Adjustments (brand views only) ===== */
    if (currentView !== 'overview') {
      const defectsAll = safe(((D.item_defects || {})[currentGran] || {})[currentView]);
      if (anyDefect(defectsAll)) {
        function defectRow(label, field) {
          let tr = `<tr><td>${label}</td>`;
          last10.forEach(r => {
            const d = defectsAll.find(x => x.period === r.period);
            const val = d ? d[field] : null;
            const dIdx = d ? defectsAll.indexOf(d) : -1;
            const dPrev = dIdx > 0 ? defectsAll[dIdx - 1] : null;
            const pv = dPrev ? dPrev[field] : null;
            tr += `<td>${val != null ? fmtPct(val, 2) : '—'} ${pctChangeInline(val, pv, true)}</td>`;
          });
          return tr + '</tr>';
        }
        html += groupHeader('Order & Item Adjustments', 'grp-adjust');
        html += defectRow('Item Quantity Adjustment Defect Rate, %', 'item_quantity_defect_rate');
        html += defectRow('Item Replacement Rate, %', 'item_replacement_rate');
        html += defectRow('Item Weighted Adjustment Defect Rate, %', 'item_weight_defect_rate');
        html += defectRow('Item Price Adjustment Defect Rate, %', 'item_price_defect_rate');
      }
    }

    html += '</tbody></table></div>';
    return html;
  }

  /* ---- Financial Overview Comparison Table (WoW/MoM/QoQ) ---- */
  function buildFinancialComparisonTable(fin, cp, camp) {
    const last10 = safe(fin).slice(-10);
    if (last10.length < 2) return '';

    return html;
  }

    makeChart('chartGmvOrders', {
      type: 'line',

        labels,
        datasets: [
          { label: 'GMV (€)', data: fin.map(r => r.gmv_eur), borderColor: '#34D186', backgroundColor: '#34D18630', fill: true, tension: 0.3, yAxisID: 'y' },
          { label: 'Orders', data: fin.map(r => r.orders), borderColor: '#1A1A2E', backgroundColor: '#1A1A2E30', fill: false, tension: 0.3, yAxisID: 'y1' }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        scales: {
          y: { type: 'linear', position: 'left', title: { display: true, text: 'GMV (€)' }, grid: { color: '#E2E8F020' } },
          y1: { type: 'linear', position: 'right', title: { display: true, text: 'Orders' }, grid: { drawOnChartArea: false } }
        },
        plugins: { legend: { position: 'top' } }
      }
    });
  }

  function drawEaterFeesChart(fin) {
    if (!fin.length) return;
    const labels = fin.map(r => periodLabel(r.period, currentGran));
    makeChart('chartEaterFees', {
      type: 'line',
      data: {
        labels,
        datasets: [
          { label: 'Total Eater Fees/Order', data: fin.map(r => r.eater_fees_per_order), borderColor: '#1A1A2E', borderWidth: 2.5, borderDash: [5, 3], fill: false, tension: 0.3, pointRadius: 3 },
          { label: 'Delivery Fee/Order', data: fin.map(r => r.delivery_fee_per_order), borderColor: '#6366F1', backgroundColor: '#6366F120', fill: true, tension: 0.3 },
          { label: 'Small Order Fee/Order', data: fin.map(r => r.small_order_fee_per_order), borderColor: '#F59E0B', fill: false, tension: 0.3 },
          { label: 'Service Fee/Order', data: fin.map(r => r.service_fee_per_order), borderColor: '#EF4444', fill: false, tension: 0.3 }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        scales: { y: { title: { display: true, text: '€ per Order' } } },
        plugins: { legend: { position: 'top' } }
      }
    });
  }

  const SHARE_PALETTE = ['#34D186','#1A1A2E','#6366F1','#F59E0B','#EF4444','#8B5CF6','#EC4899','#14B8A6','#F97316','#0EA5E9','#A3E635','#DB2777','#7C3AED','#22C55E','#EAB308'];
  const OTHERS_COLOR = '#CBD5E1';

  function doughnutCfg(labels, data, colors, total, isEur) {
    return {
      type: 'doughnut',
      data: { labels, datasets: [{ data, backgroundColor: colors }] },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: ctx => `${ctx.label}: ${isEur ? '€' + fmt(ctx.parsed, 0) : fmt(ctx.parsed, 0)} (${fmtPct(total ? ctx.parsed / total * 100 : 0, 1)})` } }
        }
      }
    };
  }

  // GMV + Orders share doughnuts: one ordered partner list (top 15 by GMV + Others),
  // fixed color per partner shared by both charts, single shared HTML legend.
  function drawShareCharts(dataSource, gmvId, ordersId, legendId) {
    const src = dataSource || getDataSource();
    gmvId = gmvId || 'chartGmvShare'; ordersId = ordersId || 'chartOrdersShare'; legendId = legendId || 'shareLegend';
    let partnerData = safe(src.gmv_by_partner).filter(r => r.period === currentPeriod);
    if (!partnerData.length) partnerData = safe(D.top_partners_gmv);
    if (!partnerData.length) return;
    const byPartner = {};
    partnerData.forEach(r => {
      const k = r.group_name;
      if (!k) return;
      if (!byPartner[k]) byPartner[k] = { name: k, gmv: 0, orders: 0 };
      byPartner[k].gmv += (r.gmv_eur || 0);
      byPartner[k].orders += (r.orders || 0);
    });
    const arr = Object.values(byPartner).sort((a, b) => b.gmv - a.gmv);
    const TOP = 15;
    const items = arr.slice(0, TOP).map((r, i) => ({ name: r.name, gmv: r.gmv, orders: r.orders, color: SHARE_PALETTE[i % SHARE_PALETTE.length] }));
    const rest = arr.slice(TOP);
    if (rest.length) items.push({ name: 'Others', gmv: rest.reduce((a, b) => a + b.gmv, 0), orders: rest.reduce((a, b) => a + b.orders, 0), color: OTHERS_COLOR });
    const labels = items.map(i => i.name);
    const colors = items.map(i => i.color);
    const gmvData = items.map(i => i.gmv);
    const ordersData = items.map(i => i.orders);
    const totalGmv = gmvData.reduce((a, b) => a + b, 0);
    const totalOrders = ordersData.reduce((a, b) => a + b, 0);
    makeChart(gmvId, doughnutCfg(labels, gmvData, colors, totalGmv, true));
    makeChart(ordersId, doughnutCfg(labels, ordersData, colors, totalOrders, false));
    const lg = document.getElementById(legendId);
    if (lg) lg.innerHTML = items.map(i => `<div style="display:flex;align-items:center;gap:6px;font-size:11px;margin-bottom:5px;"><span style="width:11px;height:11px;border-radius:2px;background:${i.color};display:inline-block;flex:0 0 auto;"></span><span>${i.name}</span></div>`).join('');
  }

  function drawCampaignsChart(camp) {
    if (!camp.length) return;
    const labels = camp.map(r => periodLabel(r.period, currentGran));
    makeChart('chartCampaigns', {
      type: 'line',
      data: {
        labels,
        datasets: [
          { label: 'Total Discount, % GMV', data: camp.map(r => r.gmv_eur ? (r.campaigns_discount_eur / r.gmv_eur * 100) : 0), borderColor: '#34D186', backgroundColor: '#34D18620', fill: true, tension: 0.3 },
          { label: 'Bolt Spend, % GMV', data: camp.map(r => r.gmv_eur ? (r.bolt_spend_eur / r.gmv_eur * 100) : 0), borderColor: '#1A1A2E', tension: 0.3 },
          { label: 'Merchant Spend, % GMV', data: camp.map(r => r.gmv_eur ? (r.merchant_spend_eur / r.gmv_eur * 100) : 0), borderColor: '#F59E0B', tension: 0.3 }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        scales: { y: { title: { display: true, text: '% of GMV' }, ticks: { callback: v => v.toFixed(1) + '%' } } },
        plugins: { legend: { position: 'top' } }
      }
    });
  }

  render();
})();
</script>
</body>
</html>
