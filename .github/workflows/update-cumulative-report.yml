name: Update Stores Cumulative Weekly Report

# Target 09:00 Kyiv. GitHub schedule can slip by hours, so several Monday UTC slots
# all run the same job; only stale data triggers a rebuild.
on:
  schedule:
    - cron: '0 6 * * 1'
    - cron: '0 7 * * 1'
    - cron: '0 8 * * 1'
    - cron: '0 9 * * 1'
    - cron: '0 10 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stores-cumulative-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if a rebuild is needed
        id: freshness
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Manual run — always rebuild."
            exit 0
          fi
          expected="$(python3 -c "from datetime import date, timedelta; t=date.today(); print((t - timedelta(days=t.weekday() + 7)).isoformat())")"
          current="$(python3 -c "import json; print(json.load(open('wow-analysis/data.json'))['metadata']['latest_week'])")"
          if [ "$current" = "$expected" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Already fresh: latest_week=$current (expected $expected)."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Stale data: $current -> $expected."
          fi

      - name: Set up Python 3.11
        if: steps.freshness.outputs.needed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        if: steps.freshness.outputs.needed == 'true'
        run: pip install -r requirements.txt

      - name: Rebuild report data
        if: steps.freshness.outputs.needed == 'true'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
        run: python wow-analysis/build_report.py

      - name: Verify the latest complete week landed
        if: steps.freshness.outputs.needed == 'true'
        run: python wow-analysis/verify_report.py

      - name: Commit and push
        if: steps.freshness.outputs.needed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wow-analysis/data.json
          if git diff --cached --quiet; then
            echo "Data unchanged - nothing to commit."
            exit 0
          fi
          git commit -m "Refresh cumulative Stores report through $(TZ=Europe/Kyiv date +'%Y-%m-%d')"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
