name: Update 3P Stores Weekly Report

on:
  schedule:
    - cron: '0 5 * * 1'  # Monday 05:00 UTC = 08:00 GMT+3
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest data from Databricks
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
        run: python fetch_weekly_data.py

      - name: Generate HTML report
        run: python integrate_data.py

      - name: Commit and push report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html overview_corrected_weekly.json partners_corrected_batch1.json partners_corrected_batch2.json partner_availability_corrected.json
          git diff --cached --quiet || git commit -m "Weekly update: $(date +'%Y-%m-%d')"
          git push
